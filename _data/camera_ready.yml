- paper_id: v25YMqd3Ro
  number: 1387
  status: Accept (Poster)
  title: 'Sketch2TikZ: Multi-Reward Reinforcement Learning for Converting Hand-Drawn Sketches to Executable TikZ'
  authors:
  - Shubham Paliwal
  - Arushi Jain
  - Monika Sharma
  - Manasi Patwardhan
  abstract: "Automatic digitization of hand-drawn sketches into editable formats is crucial for modern document workflows and LaTeX integration. Converting sketches into executable TikZ code provides a structured representation of diagrams, but remains challenging due to noisy and ambiguous inputs, which hinder reliable interpretation and limit the effectiveness of token-level supervision for ensuring global diagram validity.\nTo address these challenges, we propose ${Sketch2TikZ}$, a reinforcement learning framework that optimizes sketch-to-code generation via a sequential multi-reward strategy, combining Code-Structure ($R_{cs}$), OCR ($R_{ocr}$), CleanDIFT ($R_{cd}$), and Self-Similarity ($R_{ss}$) rewards to enforce textual, visual and structural correctness. We evaluate Sketch2TikZ on the ${SkeTikZ}$ and ${FlowChart-3B}$ benchmarks using metrics including compilation success rate (CSR), image similarity, code similarity, \nand character similarity. Our method achieves near-perfect compilation\
    \ success and improves visual and textual alignment over strong open-source baselines, while remaining competitive with proprietary GPT-based vision–language models. Extensive ablations demonstrate that curriculum-based reward scheduling is critical for reducing reward interference, stabilizing training and mitigating proxy over-optimization. Overall, our results highlight the effectiveness of reference-aware, multi-objective reinforcement learning for structured diagram generation from noisy sketches."

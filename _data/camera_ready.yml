- paper_id: alPDstNMcB
  number: 744
  status: Accept (Poster)
  title: 'Mind the Approximation: Fisher-Weighted SVD Compression for Vision Transformers'
  authors:
  - Moritz Thoma
  - Maximilian Groezinger
  - Maximilian Forstenhäusler
  - Emad Aghajanzadeh
  - Ryan Pégoud
  - Manoj Rohit Vemparala
  - Pierpaolo Mori
  - Alexander Frickenstein
  - Daniel Mueller-Gritschneder
  - Ulf Schlichtmann
  abstract: Model compression is key to mitigate deployment challenges of ever growing machine learning models. In this area of research, singular value decomposition (SVD)-based compression offers a compelling trade-off between computational efficiency and model accuracy. Fisher-weighted SVD in particular provides principled, loss-aware compression. However, we find that improving the fidelity of Fisher approximation used in the compression is poorly predictive of post-compression accuracy for Vision Transformers (ViTs). Motivated by this observation, we propose FACTS, a structured **F**isher **A**pproximation tailored to **C**ompressing Vi**T**s with Fisher-weighted **S**VD, which enforces token-local aggregation while preserving within-token activation-gradient dependence. Additionally, we introduce a fast **Co**nstrained **R**ank **S**earch (CoRS), that optimizes layer-wise rank allocation while adhering to a fixed floating point operation (FLOP) constraint. Extensive experiments across
    ViTs and hybrid architectures demonstrate that FACTS consistently improves accuracy-efficiency trade-offs without requiring finetuning. Notably, it outperforms the strongest SVD baseline by up to +5.8 percentage points (p.p.) Top-1 on Swin-B, with further gains driven by our search method. Code on [GitHub](https://github.com/MoritzTho/FACTS).

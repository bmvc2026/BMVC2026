- paper_id: vSedBeGjj8
  number: 211
  status: Accept (Poster)
  title: Post-training VLMs for Video Mistake Detection
  authors:
  - Federico Spurio
  - Olga Zatsarynna
  - Lars Doorenbos
  - Emad Bahrami
  - Gianpiero Francesca
  - Juergen Gall
  abstract: Human mistakes are inevitable when following instructions, yet they can lead to severe consequences. As such, there has been an increased interest in developing methods for mistake detection from videos, with current methods mostly focusing on a closed-set protocol. However, this protocol limits their wider applicability, as any change in instructions requires collecting new data and re-training models. Instead, mistake detection methods should learn the general concept of a mistake, rather than overfitting to step-specific details. To reflect this, we introduce the Mistake Detection Video Question Answering (MD-VQA) protocol and accompanying benchmark. MD-VQA tests whether methods can discern if a step was executed correctly with respect to its description, for both seen and unseen actions. To address this important challenge, we propose the first video-language-model post-training technique for mistake detection. Our method uses a tailored reward function to encourage the model
    to identify discrepancies between an instruction and the corresponding video. Extensive evaluations demonstrate that this approach outperforms previous zero-shot, supervised fine-tuning, and post-training baselines. Notably, our method generalizes especially well to unseen procedures, for instance, with an improvement of up to 11.6% over the best-performing baseline, paving the way toward general mistake detection. We release our code and benchmark at https://github.com/FedeSpu/mstk.

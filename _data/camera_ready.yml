- paper_id: bPhvafmjsp
  number: 731
  status: Accept (Poster)
  title: 'CompSplat: Compression-aware 3D Gaussian Splatting for Real-world Video'
  authors:
  - Hojun Song
  - Heejung Choi
  - Aro Kim
  - Chae-yeong Song
  - Gahyeon Kim
  - Soo Ye Kim
  - Jaehyup Lee
  - Sang-hyo Park
  abstract: High-quality novel view synthesis (NVS) from real-world videos is crucial for applications such as cultural heritage preservation, digital twins, and immersive media. However, real-world videos often contain long sequences with irregular trajectories and unknown poses, leading to pose drift and geometric distortion. Moreover, lossy compression amplifies these issues by introducing inconsistencies that gradually degrade geometry and rendering quality. While recent studies have addressed either long-sequence NVS or unposed reconstruction, compression-aware approaches still focus on specific artifacts or limited scenarios, leaving diverse compression patterns in long videos insufficiently explored. In this paper, we propose CompSplat, a compression-aware training framework that explicitly models frame-wise compression characteristics to mitigate inter-frame inconsistency and accumulated geometric errors. CompSplat incorporates compression-aware frame weighting and an adaptive pruning
    strategy to enhance robustness and geometric consistency, particularly under heavy compression. We establish a new video benchmark, CoRe-NVS, for compression-aware NVS. Extensive experiments on challenging benchmarks, including Tanks and Temples, Free, and Hike, demonstrate that CompSplat achieves comparable rendering quality and pose accuracy, surpassing most recent state-of-the-art NVS approaches under severe compression conditions. The project page, including code and videos, is available at https://hdddhdd.github.io/CompSplat-page/.

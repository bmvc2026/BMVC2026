- paper_id: 0kFLhPf1NU
  number: 230
  status: Accept (Poster)
  title: 'DRGSplat: Depth-Regularised 3D Gaussian Splatting'
  authors:
  - Daniel Barath
  - Keisuke Tateno
  - Marc Pollefeys
  - Federico Tombari
  abstract: 3D Gaussian Splatting has become a leading approach for photorealistic novel view synthesis, but its geometric accuracy often lags behind its visual fidelity. Existing geometry-improving variants commonly impose constraints on Gaussian primitives, which can reduce representational flexibility. We introduce DRGSplat, a depth-regularisation approach that improves geometric accuracy by supervising the rendered depth during 3DGS optimisation, without directly constraining Gaussian primitives. DRGSplat combines (i) a monocular depth consistency loss, (ii) a monocular normal consistency loss using normals computed from rendered depth, and (iii) a new uncertainty-weighted depth-gradient regulariser that encourages locally consistent depth structure while avoiding unstable gradients near depth discontinuities. Experiments on ETH3D, DTU, and Tanks and Temples show that DRGSplat substantially improves geometry while maintaining competitive novel-view synthesis quality. On ETH3D, DRGSplat
    improves the 3DGS accuracy, completeness, and F1 scores by 15, 25, and 17 percentage points at standard thresholds. The source code is publicly available at https://github.com/danini/depth_regularized_gaussian_splatting.

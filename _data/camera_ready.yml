- paper_id: tQTgS6OFTa
  number: 1628
  status: Accept (Poster)
  title: Evaluating Video LLMs’ Understanding of Corner Cases in Autonomous Driving
  authors:
  - Gabriel Manalu
  - Minh Son Hoang
  - Hyeontaek Hwang
  - Jaesung Lee
  - Hyojin Choi
  - Tran Tuan Phong
  - Seon Kwon Kim
  - Saad Wazir
  - Daeyoung Kim
  abstract: 'Natural language explanations promised by modern Video Large Language Models (Video LLMs) offer autonomous driving systems a path toward detailed scene description and interpretable decision making on the road. While recent benchmarks have begun assessing these models on driving scenes, they mainly target routine traffic conditions and general comprehension tasks based on existing driving datasets and therefore fail to evaluate model performance on the rarest and most safety‑critical driving events, also known as "*corner cases*". To provide a comprehensive evaluation of Video LLMs on precisely these scenarios, we introduce **DashBench**, a benchmark testing 26 Video LLMs on 1,709 carefully curated driving videos spanning not only collision-related corner cases but also rare non-collision ones. Through extensive prompts and open‑ended question answering, we expose a critical capability gap: all evaluated models perform substantially below the threshold required for safety‑critical
    driving applications, frequently misjudging or missing dangerous events on the road ahead and hallucinating non‑existent agents or actions in their explanations. We believe **DashBench**, combining an extensive dataset with a rigorous evaluation toolkit and a detailed diagnosis of current model limitations, drives progress toward safer, more explainable autonomous driving systems. The code and data will be shared at: https://cornercase-dashbench.github.io.'

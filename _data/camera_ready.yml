- paper_id: wq2XbmMela
  number: 532
  status: Accept (Poster)
  title: 'PE-Mamba: Bidirectional Selective Layer Aggregation for AI-Generated Image Detection'
  authors:
  - Kutub Uddin
  - Nusrat Tasnim
  - Khalid Malik
  abstract: |-
    AI-generated image (AIGI) detection has become increasingly challenging due to the rapid advancement of generative models and the diminishing gap
    between synthetic and authentic content.
    Existing vision transformer-based detectors commonly rely on
    weighted-sum strategies to aggregate intermediate
    representations across transformer layers, often overlooking the
    inherently ordered semantic progression of hierarchical features from
    shallow texture cues to deep semantic representations.
    In this work, we propose \textbf{PE-Mamba}, a novel framework built upon
    a pre-trained PE-Core vision transformer with lightweight LoRA adaptation
    that introduces three complementary components for cross-layer
    feature aggregation and fusion.
    First, a bidirectional selective aggregator (BSA) processes
    layer-wise classification tokens through forward and backward selective scans,
    where the forward scan progressively accumulates shallow-to-deep forensic
    evidence, and the backward scan performs deep-to-shallow contextual
    refinement to reinterpret low-level cues in light of high-level semantic
    context.
    Second, a softmax-weighted aggregator (SWA) computes a learned
    global summary of all layer tokens as a complementary
    aggregation path.
    Third, a sigmoid gated blend (SGA) adaptively fuses the BSA and SWA
    outputs via a learnable scalar gate, allowing the model to dynamically
    balance directional sequential evidence and global layer-wise aggregation.
    Extensive experiments on UniversalFakeDetect (96.6\% mACC, 99.5\% mAP) and AIGCDetect (95.3\% mACC, 98.1\% mAP) demonstrate that \methodname{} outperforms 18 detectors with superior generalization across diverse generative models, while training only 1.3\% of total parameters (0.13\% for LoRA alone).

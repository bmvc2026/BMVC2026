- paper_id: RrsJ5OnUcs
  number: 635
  status: Accept (Poster)
  title: 'InspectVQA: Expert-Verified Visual Reasoning for Underwater Pipe Inspection'
  authors:
  - Truong Thanh Nguyen
  - Trung Hieu Vu
  - M S MEKALA
  - Eyad Elyan
  - Tien Thanh Nguyen
  abstract: "Underwater industrial inspection is critical for maintaining offshore infrastructure, yet reliable visual assessment remains challenging due to low visibility, marine growth, and surface degradation. Despite recent advances, the robustness of large vision-language models (LVLMs) in safety-critical, real-world environments has not been systematically evaluated, particularly under ambiguous or partially occluded visual conditions.\nWe introduce InspectVQA, a large-scale, expert-informed VQA dataset and benchmark for subsea pipe inspection. The dataset comprises 6,596 high-resolution images collected from operational offshore inspection systems, annotated with multi-label anomaly categories (e.g., surface condition types) and expert-validated reasoning dialogues, yielding 46,172 question-answer pairs for inspection-oriented reasoning. To support both scalability and domain fidelity, we develop a semi-automated data construction pipeline in collaboration with subsea inspection experts.\n\
    InspectVQA captures domain-specific challenges that are underrepresented in existing VQA benchmarks and enables systematic evaluation of LVLMs in subsea environments. \nBenchmarking results across recent LVLMs reveal substantial performance degradation under underwater visual ambiguity, with particularly poor robustness for weld seam recognition and corrosion reasoning. Beyond evaluation, InspectVQA establishes a realistic benchmark for evaluating multimodal reasoning under safety-critical industrial conditions and provides a foundation for future research in robust underwater visual understanding. The dataset and code will be made available https://github.com/anonymous-submission-vqa-2026/InspectVQA."

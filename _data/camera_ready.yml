- paper_id: lsCNbMUOoM
  number: 949
  status: Accept (Poster)
  title: Intervention-Conditioned Multimodal Temporal Self-Supervised Learning for Retinal Disease Progression
  authors:
  - Yuanyuan Liu
  - Liangxiu Han
  - Xin Zhang
  - Guo Li
  - Peng Wang
  abstract: Multimodal retinal self-supervised learning typically aligns fundus and OCT representations at the same visit, focusing on snapshot correspondence rather than disease dynamics. However, clinical assessment relies on temporal change, particularly around treatment events. We propose Intervention-Conditioned Multimodal Temporal Self-Supervised Learning (ICMT), a framework that leverages treatment timestamps as weak temporal supervision for learning from longitudinal fundus-OCT pairs. Rather than relying on same-visit feature equivalence alone, ICMT additionally encourages modalities to agree on the direction and magnitude of temporal change in a latent disease progression state. The representation for each modality is factorised into a content branch for transferable representation learning and a progression branch that models a scalar latent state with heteroscedastic uncertainty. Temporal supervision is provided by a probabilistic ranking objective on intervention-crossing intervals
    and an uncertainty-normalised cross-modal change-consistency loss. Pretraining on the OLIVES dataset yields representations that improve transfer performance on external retinal benchmarks, particularly for OCT classification, while remaining competitive on colour fundus datasets despite domain shift. These results suggest that aligning modalities through temporal change rather than snapshot correspondence provides a principled signal for multimodal representation learning in longitudinal medical imaging.

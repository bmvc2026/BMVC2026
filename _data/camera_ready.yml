- paper_id: K5G8pC83RE
  number: 720
  status: Accept (Poster)
  title: 'TESS: Transitive Knowledge Editing via Bypass First-Token Penalty'
  authors:
  - Haibin Wen
  - Zhaowei Qu
  - Xiaoru Wang
  - Zebo Li
  - Yueyang Yan
  - Jiaxin Dong
  abstract: 'To address the issues of knowledge obsolescence and factual drift in Multimodal Large Language Models (MLLMs), Transitive Multimodal Knowledge Editing (TMKE) introduces a challenging setting: injecting knowledge via pure text while recalling it under joint image-text inputs. Although traditional Fine-Tuning (FT) can rapidly inject target knowledge, it is highly prone to forming fragile triggering patterns induced by relation templates or incorrect subjects. This leads to unstable model outputs during cross-modal recall or reliability testing. To mitigate this, we propose TESS (Transitive Edit Shortcut Suppression), a bypass first-token penalty method tailored for TMKE. Building upon the FT baseline, this approach incorporates a lightweight bypass suppressor that learns shortcut patterns by constructing placeholder subjects and negative samples. During the generation phase, it applies a non-negative penalty exclusively to the first token of the target answer, thereby suppressing
    the model''s tendency toward "over-activation" and premature output. We evaluate our method on a reconstructed TMKE dataset, which is filtered through a denoising process based on the base model''s answerability. Experimental results demonstrate that under identical data conditions, TESS significantly outperforms the FT baseline in Reliability, while achieving modest improvements in Generality, Stability, and Locality. This indicates that first-token-level shortcut suppression serves as an effective and lightweight complementary mechanism, substantially improving the primary edit success rate and controlling erroneous triggers, although its benefits for more complex transfer chains remain limited.'

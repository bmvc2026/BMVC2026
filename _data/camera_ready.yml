- paper_id: rQiXDbSE7b
  number: 641
  status: Accept (Poster)
  title: 'Benchmarking Interaction, Beyond Policy: a Reproducible Benchmark for Collaborative Instance Object Navigation'
  authors:
  - Edoardo Zorzi
  - Francesco Taioli
  - Yiming Wang
  - Marco Cristani
  - Alessandro Farinelli
  - Alberto Castellini
  - Loris Bazzani
  abstract: "We propose Question-Asking Navigation (QAsk-Nav), the first reproducible benchmark for Collaborative Instance Object Navigation (CoIN) that enables an explicit, separate assessment of embodied navigation and collaborative question asking.\nThe CoIN task requires an embodied agent to locate a target object specified through free-form natural language (e.g., ''Find the messy red bed'') using only egocentric visual observations and interactive natural-language dialogue with a human. The dialogue enables the agent to resolve ambiguities between visually similar object instances in cluttered environments.\nExisting CoIN benchmarks are primarily focused on navigation success and offer no support for consistent evaluation of collaborative interaction. \nTo address this limitation, QAsk-Nav provides (i) a lightweight question-asking protocol scored independently of navigation, (ii) an enhanced navigation protocol with realistic, diverse, high-quality target descriptions, and (iii) an\
    \ open-source dataset, that includes around 26,000 quality-checked reasoning and question-asking traces for training, evaluation and analysis of interactive capabilities of CoIN models.\nUsing the proposed QAsk-Nav benchmark, we develop Light-CoNav, a lightweight unified model for collaborative navigation that is 3x smaller and 70x faster than existing modular methods, while outperforming state-of-the-art CoIN approaches in generalization to unseen objects and environments."

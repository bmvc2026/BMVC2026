- paper_id: G5eNuwKfC0
  number: 569
  status: Accept (Poster)
  title: 'AliGen: Benchmarking and Advancing Few-Shot Industrial Anomaly Generation under Object-Level Misalignment'
  authors:
  - Tianjia Jiang
  - Guangpin Tao
  - Minglei Yuan
  - Ying Tai
  - Shirong Zou
  - Yixuan Wang
  - Ziyang Yan
  - Tong Lu
  abstract: "Few-shot anomaly generation (FSAG) methods alleviate data scarcity by synthesizing realistic and diverse anomalies, yet most rely on datasets with well-aligned objects. In real industrial scenarios, however, object misalignment—such as variations in position, scale, and quantity—makes obtaining plausible anomaly masks challenging. To bridge the gap,\nwe introduce MIAD, a Misaligned Industrial Anomaly Dataset comprising 1,905 anomalous image–mask pairs and 10,288 normal images across 20 objects and 53 anomaly categories, explicitly modeling diverse misalignments. To improve FSAG under misalignment settings, we propose AliGen, a plug-and-play framework that adaptively generates spatially plausible anomaly masks for arbitrary normal images. AliGen employs the Anomaly Markers to represent anomaly regions along with surrounding background contexts, and a Structure-Aware Diffusion Model (SADM) to produce spatially consistent Anomaly Markers with arbitrary normal images.  \nExperiments\
    \ show that AliGen substantially enhances anomaly generation, detection, and localization across state-of-the-art (SOTA) FSAG methods. The dataset and code are available at \\href{https://github.com/JiangSio/AligenMask}{https://github.com/JiangSio/AligenMask}"

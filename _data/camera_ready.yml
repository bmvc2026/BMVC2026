- paper_id: N9wPrZAz69
  number: 37
  status: Accept (Poster)
  title: 'Recursive Flow: Fast and Stable Generation via Next State Prediction'
  authors:
  - Zhenyu Liu
  - Jinqing Qi
  abstract: "Denoising generative models construct continuous paths from noise to data. Existing models predict one of three fixed targets: pixels, noise, or velocity fields. These endpoint-based prediction paradigms face a high-variance optimization challenge, as the input and prediction target often lie at vastly different noise levels. We introduce next state prediction, a new paradigm that directly predicts the intermediate state at the next timestep rather than fixed endpoints.\n\tThis approach ensures both input and output are intermediate noise samples, aligning their distributions across all timesteps through shared randomness.\n\tWe achieve this through a quadratic interpolation schedule that structurally links consecutive states, converging in logarithmic steps without requiring ODE solving or reparameterization.\n\tExperiments show that our approach achieves competitive generation quality with 8-10 sampling steps and exhibits improved training stability, particularly in phases\
    \ where distribution mismatch traditionally hampers convergence."

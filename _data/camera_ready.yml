- paper_id: qJ7ikhrXiD
  number: 46
  status: Accept (Poster)
  title: 'Self-Attention And Beyond the Infinite: Towards Linear Transformers with Infinite Self-Attention'
  authors:
  - Giorgio Roffo
  - Hazem ABDELKAWY
  - Nilli Lavie
  - Luke Palmer
  abstract: |-
    The quadratic cost of softmax attention limits Transformer scalability in high-resolution vision. We introduce Infinite Self-Attention (InfSA), a spectral reformulation that treats each attention layer as a diffusion step on a content-adaptive token graph, accumulating multi-hop interactions through a discounted Neumann series over attention matrices. This connects self-attention to classical graph centrality (Katz, PageRank, eigenvector centrality), yielding interpretable, structurally grounded token weighting. The same kernel is the fundamental matrix of an absorbing Markov chain, so a token's centrality equals its expected random-walk visits before absorption.

    We then propose Linear-InfSA, a linear-complexity variant that approximates the principal eigenvector of the implicit attention operator without forming the full attention matrix. It maintains an auxiliary state of fixed size, independent of the sequence length, is drop-in compatible with standard Vision Transformers, and supports stable training at 4096x4096 and inference at 9216x9216 (about 332k tokens).

    Integrated into a 4-layer Vision Transformer with 53.5M parameters and 59 GFLOPs at 224x224, Linear-InfSA achieves 84.7% top-1 on ImageNet-1K, a +3.2 percentage-point purely architectural gain over a standard 4-layer ViT baseline (81.5%) trained with an identical recipe. On ImageNet-V2, all InfViT variants surpass every compared baseline (up to 79.8% vs. 76.8% for the best prior method), indicating robust generalization. Attention maps are semantically grounded: MoRF-AOC reaches 76.0% and bounding-box PR-AUC 76.1%, versus 42.6% and 56.2% for softmax ViT. On an A100 40 GB GPU, Linear-InfViT sustains 1024x1024 inference at 231 img/s and 0.87 J/img, a 13x improvement in throughput and energy over a standard ViT of equal depth, and is the only tested model to complete 9216x9216 inference without running out of memory. The linear approximation recovers the dominant eigenvector of the full quadratic operator (cosine similarity 0.985).

- paper_id: 2uxtr0ZaVh
  number: 1018
  status: Accept (Poster)
  title: Rethinking Test-Time Adaptation for Streaming Person Re-Identification
  authors:
  - Jae-Won Yang
  - Taesik Gong
  - Jae-Young Sim
  abstract: 'Existing test-time adaptation (TTA) methods for person re-identification (re-ID) rely on unrealistic scenarios: they assume that query and large target gallery sets are pre-collected before deployment, and that input streams consist of i.i.d. samples aggregated from multiple cameras on a centralized server. In practice, however, re-ID models are often deployed on resource-constrained edge devices that continuously capture temporally correlated streams from a single camera. Under this practical setting, query identities are registered on-the-fly during operation, introducing two critical structural challenges: the gallery stream is heavily dominated by a single target-camera style, which risks progressive representation collapse, and query features extracted at registration become misaligned with the evolving embedding space as the model adapts. To address these challenges, we propose STRIDE, a practical TTA framework comprising two complementary components: (i) \textit{Streaming
    Gallery Distribution Compensation}, which prevents representation collapse by diversifying gallery inputs with query-derived style statistics, and (ii) \textit{Query Drift Compensation}, which continuously realigns historical query features with the evolving embedding space using parameter-induced drift vectors. Extensive experiments on multiple re-ID benchmarks demonstrate that conventional TTA methods fail to generalize under our proposed practical streaming setting. In contrast, STRIDE consistently achieves superior performance, outperforming the state-of-the-art re-ID TTA method by +12.3\% mAP, +10.8\% Rank-1, and +2.1\% NQR on average. Moreover, STRIDE is computationally feasible when evaluated on a real edge device.'

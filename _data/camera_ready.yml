- paper_id: zOGNEBPSmh
  number: 585
  status: Accept (Poster)
  title: 'TANGO: Logit-Normalized Distillation Preserves OOD Ability in Foundation Models and Reshapes Which Scores Work'
  authors:
  - Yeongje Park
  - EUICHUL LEE
  abstract: 'Foundation models (DINOv2, CLIP) carry strong out-of-distribution (OOD) detection ability, but distilling them into small students degrades it: vanilla KD, DKD, and feature-based baselines drop far-OOD AUROC by 7–11%p on CIFAR-100 → SVHN. We show that L2 logit-normalized KD (LogitNormKD) closes this gap to within 1%p, while revealing how training objectives reshape OOD-detectable geometry. Using a temperature-sweep diagnostic (TSS_curv) that probes logit-landscape shape, we show that LogitNormKD compresses logit magnitudes by ~30× and shifts OOD-discriminative information from magnitude-axis to softmax-shape features. This produces a sharp signature: TSS_curv, which improves over Entropy on standard KD baselines (+0.01 to +0.07 AUROC), *collapses* on LogitNormKD students, becoming a monotone transform of Entropy on CIFAR-100 ($\rho=+1.000$) or breaking numerically on CIFAR-10. The same reshaping suppresses or destabilizes magnitude-aware scores (Energy, ReAct, ASH). The resulting
    deployment recipe, **TANGO**—LogitNormKD training with Entropy scoring—reaches $0.834_{\pm .002}$ mean AUROC on the OpenOOD CIFAR-100 far-OOD suite (MNIST/SVHN/DTD/Places365), versus $0.727_{\pm .006}$ for vanilla KD + Entropy. On near-OOD (CIFAR-10 from CIFAR-100), the same $|z|$ compression trades 6–7%p against standard KD.'

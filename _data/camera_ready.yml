- paper_id: waqGxifDjH
  number: 870
  status: Accept (Poster)
  title: 'A Structured Benchmark for Text-Guided Anomaly Detection: When Language Stops Conditioning the Decision'
  authors:
  - Stefano Samele
  - Eugenio Lomurno
  - Teodora Jovanovic
  - Sanjay Shivakumar Manohar
  - ALBERTO CRIVELLARO
  - Matteo Matteucci
  abstract: 'Industrial anomaly detection has historically been a unimodal task. Recent multimodal vision-language models have produced a new class of systems that admit textual input alongside the image and are presented as enabling text-guided zero- and few-shot inspection. Yet these methods are evaluated with protocols inherited from unimodal visual benchmarks that hold the textual condition effectively constant and therefore cannot measure whether language conditions the decision; whether reported gains reflect text guidance or strong pretrained visual features remains open. We introduce Text-Guided Anomaly Detection (TGAD), a structured benchmark that progressively increases the functional role of language across three scenarios: a controlled prompt-sensitivity setting on MVTec-AD; a component-tagged extension of MVTec-AD that requires the model to restrict its assessment to an instructed part; and the new Assembled Panel Dataset (APD), a realistic industrial setting that requires both
    defect-type and component-location knowledge. We evaluate one representative model per paradigm: generative large vision-language, training-free discriminative, and embedding-adaptive discriminative. In all three, the textual interface conditions the decision only superficially: prompt content is absorbed unless the object noun is removed (the generative model''s I-AUROC drops $97.4 \to 82.6$); component-level instructions do not constrain the global decision once defects outside the instructed part are admitted as normal ($90.3 \to 66.3$); and when the two requirements combine on APD, image-level discrimination collapses well below the MVTec level, in one case below chance ($71.2$, $50.5$, $31.5$). These results suggest that standard benchmarks overstate the text-guided capabilities of current multimodal anomaly detection systems, and that a protocol of this kind is a prerequisite for building models that can be reliably controlled through language for industrial deployment.'

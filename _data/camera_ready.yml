- paper_id: bKf7PvTX5A
  number: 430
  status: Accept (Poster)
  title: 'When Gaze Meets Speech: Multimodal Multi-Person Speech and Gaze Behaviour Understanding'
  authors:
  - Cheng Peng
  - Tangzheng Lian
  - Oya Celiktutan
  abstract: Human gaze communication is tightly intertwined with speaking dynamics in natural conversations. However, existing gaze understanding approaches primarily rely on visual cues and largely overlook the intrinsic coupling between speech and gaze dynamics. Moreover, current benchmarks are predominantly exocentric and lack synchronised speaking annotations, limiting their applicability to embodied agents operating from a first-person perspective. To adress these limitations, we introduce EasyCom-Gaze, the first egocentric multi-person benchmark that provides synchronised gaze communication and speaking annotations. Furthermore, we propose the first unified multimodal, multi-task framework for jointly modelling multi-person gaze communication and speaker identification under realistic deployment constraints. We formulate the problem within a learning-with-privileged-information paradigm, where high-level semantic scene descriptions generated by a multimodal large language model are
    leveraged exclusively during training. To effectively transfer this semantic knowledge, we introduce a Semantic-Guided Representation Regularisation (SGR) module that aligns semantically enriched teacher representations with an audio–visual student model through intermediate feature distillation. Extensive experiments on EasyCom-Gaze and VACATION demonstrate that jointly modeling speech–gaze interactions and incorporating training-time semantic supervision consistently improve performance over existing baselines. The dataset and code will be publicly released upon acceptance.

- paper_id: P6lpNz9hkJ
  number: 839
  status: Accept (Poster)
  title: From Hierarchical Backoff to Reliable Open-World Inference
  authors:
  - Marouane HADJ-ALI
  - Florence Alberge
  abstract: Selective classification improves reliability by allowing a model to abstain on uncertain predictions. In hierarchical label spaces, however, abstention can discard useful semantic information, since a prediction may remain reliable at a coarser level. Hierarchical selective classification (HSC) addresses this by backing off to ancestor nodes, but existing methods often rely on uncalibrated hierarchical confidence scores and do not separate in-distribution (ID) uncertainty from out-of-distribution (OOD) inputs. We propose a post-hoc framework for calibrated HSC with OOD rejection. Our method introduces Hierarchical Order-Preserving calibration (HOP), which calibrates local branching probabilities while preserving tree consistency and sibling ordering. We also derive hierarchical compatibility scores for selective classification with out-of-distribution data (SCOD). The model-agnostic framework requires no backbone retraining and unifies hierarchy-aware inference rules under a
    risk-coverage view. Experiments on ImageNet-1K and iNaturalist21 show consistent HSC gains, while multi-backbone SCOD diagnostics show competitive hierarchy-compatibility ranking against hierarchical rules and representative flat OOD scores.

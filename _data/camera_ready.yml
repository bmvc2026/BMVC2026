- paper_id: nfQY7qKLBW
  number: 951
  status: Accept (Poster)
  title: 'HyMN: Hybrid Mamba UY-Network with Mask-Encoded Prior for Laparoscopic Smoke Removal'
  authors:
  - Mohamed Bassem
  - Marwan Torki
  abstract: 'Surgical smoke from energy-based instruments degrades visibility in minimally invasive surgery, obscuring the surgeon''s view and disrupting downstream vision tasks such as tool tracking and depth estimation. Computational desmoking methods face a trade-off: real-time mask-guided methods fuse the estimated smoke prior shallowly at the input, while methods that integrate it more deeply are too slow for intraoperative use. We present HyMN, a laparoscopic desmoking framework that integrates the prior deeply within the intraoperative real-time budget. A U-Net first estimates a dense smoke-density mask; a Y-Net restoration network then encodes the degraded image and the mask in separate streams and fuses them at every decoder scale through a generalized $N$-way iterative Attentional Feature Fusion module. Both stages use hybrid Mamba-Attention blocks that model long-range smoke structure without the quadratic cost of pure attention. A wavelet-guided frequency loss targets the fine
    tissue textures that smoke suppresses most. On synthetic and $\textit{in vivo}$ laparoscopic data, HyMN reaches state-of-the-art full-reference restoration quality at $48$\,FPS on an NVIDIA RTX 4090, within the intraoperative real-time budget. Source code and pre-trained model are available at https://github.com/mohamedbassem6/HyMN.'

- paper_id: p89bJO2W4k
  number: 575
  status: Accept (Poster)
  title: 'MFT: An Architecture-Agnostic Adapter for Foundation Models in Medical Segmentation'
  authors:
  - Yujie Lu
  - Jingwen Li
  - Min Zhu
  - Junlong Cheng
  abstract: 'The rapid evolution of foundation models offers immense potential for medical image analysis but faces a critical hurdle in medical image segmentation: severe architectural dependency. Existing paradigms typically require resource intensive, model specific fine-tuning, thereby limiting their flexibility in clinical deployment. To overcome this limitation, we propose the Medical Feature Transformer (MFT), a lightweight and plug-and-play module designed to bridge different transformer-based vision foundation encoders to downstream medical segmentation tasks without retraining the backbone. Specifically, MFT aligns the natural domain distribution with medical semantics via a frequency domain spectral modulation mechanism, which decouples features into scale invariant structural and textural components. Furthermore, to address feature dimension mismatches across different models, we design an Implicit Neural Feature Projector. This component utilizes a coordinate-based regression
    strategy to dynamically align feature spaces, decoupling the module from specific channel widths and enabling seamless transfer across heterogeneous architectures. Extensive experiments on multiple medical segmentation benchmarks demonstrate that an MFT module trained exclusively on SAM2-Tiny can be directly plugged into the entire SAM family, as well as DINOv2 and DINOv3 encoders. Our approach achieves superior parameter efficiency and yields consistent performance gains, suggesting a practical direction for reusable foundation model adaptation in medical image segmentation.'

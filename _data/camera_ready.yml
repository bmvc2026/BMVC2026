- paper_id: ndNYjSjlva
  number: 278
  status: Accept (Oral)
  title: 'FlowIt: Global Matching via Hierarchical Transformers and Optimal Transport for Optical Flow'
  authors:
  - Sadra Safadoust
  - Fabio Tosi
  - Matteo Poggi
  - Fatma Güney
  abstract: We present FlowIt, a novel architecture for optical flow estimation that combines global matching with confidence and occlusion-guided refinement. At its core, FlowIt leverages a hierarchical transformer architecture that captures extensive global context, enabling the model to effectively model long-range correspondences. To overcome the limitations of localized matching, we formulate the flow initialization as an optimal transport problem. This formulation yields a highly robust initial flow field, alongside explicitly derived occlusion and confidence maps. These cues are then seamlessly integrated into a guided refinement stage, where the network actively propagates reliable motion estimates from high-confidence regions into ambiguous, low-confidence areas. FlowIt achieves state-of-the-art results on the Sintel benchmark and establishes new state-of-the-art zero-shot generalization performance on Sintel, Spring, and LayeredFlow.

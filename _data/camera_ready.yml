- paper_id: JF2NkAXvwE
  number: 1256
  status: Accept (Poster)
  title: 'PERSIST: Persistent-State Discrimination for Shot Boundary Detection'
  authors:
  - Tingyu Lin
  - Christian Stippel
  - Armin Dadras
  - Jakob Zenzmaier
  - Florian Kleber
  - Wolfgang Aigner
  - Robert Sablatnig
  abstract: 'Shot boundary detection (SBD) is widely treated as the localisation of local visual discontinuities, yet many false positives such as hand-held shake, illumination flicker, motion blur, occlusion, and damaged archival material produce equally sharp local change without introducing a new shot. We reformulate SBD as boundary semantic discrimination: a frame is favoured as a boundary only when its local change evidence is accompanied by a persistent update of the video''s latent temporal state, rather than a transient excursion that returns to the surrounding trend. This persistence test is operationalised with a continuous latent state from a FiLM-conditioned sinusoidal representation network and a structured discriminator that combines three semantic cues, local change, transient impulse, and return-to-trend, into a single interpretable per-frame signal over a dual-rate temporal backbone. The resulting framework, PERSIST, turns every decision into an inspectable one: the persistence
    criterion is trained into the classifier, its per-frame effect stays readable from the gate triple, and its learned latent state is measurably boundary-discriminative. On a 2,727-video per-subtype diagnostic it removes 33–80% of flash, text-overlay, and archival false positives relative to an identically trained cue detector, and at matched true-transition recall it roughly halves the official TransNetV2''s pseudo-event false positives on that diagnostic and cuts its false positives on natural ClipShots footage by about a quarter, while preserving recall. It does so while reaching parity with the strongest public detector across modern online, broadcast, short-form, and historical-archive transfer evaluations, under markedly stricter training: it learns from ClipShots real transitions only, whereas the anchor draws on additional corpora whose transitions are 85% synthetic. Code is available at https://github.com/linty5/PERSIST.'

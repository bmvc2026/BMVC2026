- paper_id: CiLMrymOcf
  number: 479
  status: Accept (Poster)
  title: 'SOS! : A Streamlined Object-Conditional Transformer for Model-free Segmentation'
  authors:
  - Jiaqi Hu
  - Junwen Huang
  - Hongli XU
  - Peter KT Yu
  - Nassir Navab
  - Benjamin Busam
  - Slobodan Ilic
  abstract: Foundation segmentation models excel at generating high-quality, class-agnostic masks, but they struggle to associate these proposals with specific target identities. This semantic gap severely hinders their deployment in downstream applications like robotic manipulation, which demand precise unseen objects segmentation. Existing approaches attempt to resolve this by relying on exhaustive 3D object model priors, inherently introducing prohibitive computational overhead and complex, multi-stage pipelines. To address these limitations, we propose SOS (Streamlined Object-conditional Transformer for model-free Segmentation). SOS completely eliminates the reliance on 3D models, requiring only a single reference image per target. Central to our framework is a novel Object-Conditional Transformer that learns identity-anchored queries, unifying mask generation and target identification into a single feed-forward pass. This streamlined design drastically improves both structural and computational
    efficiency. Extensive evaluations across multiple benchmarks demonstrate that SOS establishes a new state-of-the-art for model-free unseen objects segmentation, delivering accurate and high-efficiency performance.

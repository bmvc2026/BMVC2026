- paper_id: ruybGvcjA1
  number: 1281
  status: Accept (Poster)
  title: 'Curriculum-guided Change Detection Training: Toward Accurate Serac Fall Monitoring'
  authors:
  - Arthur Dérédel
  - Carlos Fernando Crispim-Junior
  - Pierre Lemaire
  - Johan Berthet
  - Laure Tougne Rodet
  abstract: |-
    Change Detection (CD) aims to identify semantic or structural changes in nearly registered multi-temporal images. While recent advances in training methodologies have largely focused on semi-supervised learning and consistency regularization, alternative training paradigms remain underexplored. In particular, most deep CD methods rely on uniform sampling during training, implicitly assuming that all training samples contribute equally to the optimization process. However, such naive sampling can introduce noisy gradients and hinder robust representation learning.
    To address this limitation, we propose a curriculum learning framework tailored for outdoor change detection under strong and variable lighting conditions. Our approach investigates two complementary difficulty measures: the Solar Angular Gap (SAG), a physically grounded proxy for acquisition-condition variability, and the Structural Similarity Index Measure (SSIM), which evaluates appearance similarity between image pairs. Based on these criteria, the framework progressively introduces increasingly challenging samples during training, enabling models to learn robust representations in a coarse-to-fine manner.
    We evaluate our method on the challenging SeracFallDet benchmark, where results demonstrate significant improvements of the proposed approach over standard uniform-sampling strategies. These results highlight the potential of curriculum learning to improve robustness in terrestrial change detection in mountain environments. Importantly, our training framework is orthogonal to existing CD architectures, making it readily applicable to a broad range of methods.

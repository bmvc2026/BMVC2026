- paper_id: gjTexN91Ng
  number: 1086
  status: Accept (Poster)
  title: 'Advancing Semiconductor Inspection: A New Dataset and Approach for Robust Anomaly Detection with Large Vision Language Models'
  authors:
  - Jaehyeon Jeong
  - Hyeondo Jang
  - Donghyun Oh
  - Seongeun Kim
  - Namhoon Lee
  abstract: 'Large vision-language models (LVLMs) have recently shown promise for anomaly detection, moving beyond binary defect prediction toward language-grounded descriptions of defect type, location, and morphology. This capability is particularly valuable for scanning electron microscope (SEM) inspection in semiconductor manufacturing, where detailed defect descriptions are crucial for downstream analysis. However, applying existing LVLMs to real-world SEM inspection remains challenging due to the scarcity of domain-specific data. To address these, we introduce the Open Anomaly Synthetic Image with instruction data for Semiconductor (OASIS) dataset, a collection of defect SEM images and paired instruction-tuning data synthesized via a scalable, defect-wise pipeline. Our experiments demonstrate that training with OASIS enhances the performance of both general and defect-specialized LVLMs on real SEM defect imagery. Furthermore, we address a more realistic scenario: model generalization
    across diverse SEM sub-domains stemming from various products and process steps. We observe that even when anomaly detection performance degrades under severe sub-domain shifts, the visual encoder still retains relatively discriminative anomaly representations. Leveraging this insight, we propose a self-generating instruction data strategy that utilizes the visual encoder''s representation to label unannotated images in target domains. Our evaluation shows that instruction-tuning with this self-generated data helps recover the degraded detection capabilities, demonstrating its potential for real-world SEM deployment.'

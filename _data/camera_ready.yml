- paper_id: gPjPtLhVUK
  number: 1516
  status: Accept (Poster)
  title: 'Towards Reliable AI-Based Histological Staining: A Systematic Study of Scaling and Uncertainty in Unpaired Generative Models'
  authors:
  - Qasim Siddiqui
  - Adrian Friebel
  - Maiju Myllys
  - Zaynab Hobloss
  - Daniela González
  - Ahmed Ghallab
  - Stefan Hoehme
  abstract: |-
    Liver fibrosis, the principal predictor of long-term outcome in chronic liver disease,
    is staged from histological estimates of collagen content. Sirius Red (SR) provides
    the standard quantitative readout (collagen proportionate area, CPA) but is not
    acquired at every clinical centre and consumes tissue, time, and reagent cost beyond the
    routinely available Hematoxylin and eosin (H\&E) stain. AI-based virtual histological staining can generate
    SR directly from H\&E, yet systematic benchmarks of unsupervised models in this
    setting are scarce, and the predictive uncertainty of such models has not been
    quantified even though visually plausible outputs may not faithfully reproduce the
    underlying tissue structure.

    We benchmark six unsupervised image-to-image architectures (GAN-based and
    diffusion-based) across 54 scaling configurations on a newly released paired
    H\&E to SR mouse liver dataset, the first open resource for this translation task.
    Each configuration is evaluated jointly on perceptual, distributional, and
    task-specific axes; the best per model family is then retrained as a deep ensemble,
    providing the first systematic comparison of epistemic uncertainty across unsupervised
    stain-to-stain architectures.

    We find that across families, perceptual quality, task-specific error, and ensemble agreement
    measure largely independent axes of model fitness: GAN-based methods cluster tightly
    on perceptual metrics yet differ substantially on task error and ensemble agreement,
    while the diffusion-based method (CycleDiffusion) is qualitatively different on all three. No single
    metric captures these differences alone, so reliable virtual staining requires
    reporting and selecting on all three jointly. The dataset, tiling pipeline, model
    implementations, and evaluation code are released publicly to support reproducible
    benchmarking.

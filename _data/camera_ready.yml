- paper_id: 7mmwj5ZcXb
  number: 1321
  status: Accept (Poster)
  title: 'CAFIL: Concept-Aware Feature Invariance Learning for Annotation-Free Spurious Correlation Mitigation'
  authors:
  - Donghong Yu
  - Ziao Wang
  - William K. Cheung
  abstract: Image classifiers often suffer from a lack of robustness caused by spurious correlations between task-irrelevant attributes and class labels. Various concept-aware approaches have been explored to mitigate this challenge via sample reweighting and augmentation, which aim to reshape the training data distribution. Yet, these approaches do not explicitly discourage the model backbone from encoding spurious features associated with various visual contexts. To this end, we propose Concept-Aware Feature Invariance Learning (CAFIL), which addresses this gap by using within-class groups induced by discovered visual concepts as proxy environments for invariance learning, without requiring group annotations during training. CAFIL first discovers object-centric concepts from input image features. A minority score is then estimated for each image to indicate how likely it is to be spurious-conflicting, based on its k-nearest neighbors in the concept space and the loss of a lightly trained
    classifier. We then train the model by encouraging feature-level invariance across concepts within each class, while weighting samples according to their minority scores. Our experimental results on Waterbirds, CelebA, NICO, and MetaShift show that CAFIL attains competitive worst-group and mean accuracy against strong robust baselines, while representation probing indicates substantially reduced group-predictive information in the backbone. These results demonstrate that representation-level invariance over discovered concepts is a viable, label-efficient approach without requiring training group annotations.

- paper_id: U8KlYqWeww
  number: 360
  status: Accept (Poster)
  title: 'HDM-Flow: Historical Difference Momentum-Guided Flow Matching for Predicting Irregularly Sampled Longitudinal Medical Images'
  authors:
  - Xiaohui Li
  - Wenbo Zhang
  - Yutong Wang
  - Sijie Niu
  - Qiang Chen
  abstract: 'Diabetic macular edema is a leading cause of vision loss. Accurately predicting antivascular endothelial growth factor treatment outcomes based on longitudinal optical coherence tomography is crucial for devising personalized therapeutic strategies. However, clinical follow-ups often exhibit non-uniform sampling due to heterogeneous patient responses. Existing methods typically rely on an impractical fixed-interval assumption and overlook the patient-specific evolutionary inertia inherent in historical observations. This hinders the capture of pathological dynamics, leading to temporal perception bias and structural inconsistency. To this end, we propose HDM-Flow, a spatiotemporally adaptive flow matching prediction framework guided by Historical Difference Momentum (HDM). First, we introduce a Time-Adaptive and Global Momentum-Aware strategy, utilizing adaptive layer normalization to jointly embed absolute time intervals and relative global momentum, dynamically modulating
    network scaling and shifting parameters. Second, a Dual-Stream Attention mechanism is proposed to explicitly decouple static anatomical structures from dynamic pathological evolution. The static stream preserves current image features, while the dynamic stream processes evolutionary features derived from historical differences. Finally, we incorporate a Historical Momentum Correction mechanism, where the flow matching model infers non-linear evolutionary residuals to rectify the historical difference momentum, determining the final prediction velocity and direction. Extensive experiments on the OLIVES dataset and an in-house dataset demonstrate that HDM-Flow outperforms state-of-the-art methods in terms of SSIM, PSNR, LPIPS, and FID. Furthermore, ablation studies validate the effectiveness of the proposed modules in non-uniform longitudinal prediction tasks. Our code is accessible at: https://github.com/bemyself96/HDM-Flow.'

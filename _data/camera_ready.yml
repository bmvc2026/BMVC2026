- paper_id: idyf5zBi9T
  number: 586
  status: Accept (Poster)
  title: 'CSDiffWind: A Condition-Sensitivity-Distilled Diffusion Framework for Low-Altitude 3D Wind-Field Forecasting'
  authors:
  - Mingtao Zhu
  - JunjieChen
  - Imran Mumtaz
  - Zhan Ao Huang
  - Xiaojie Li
  - Xian Zhang
  - Xi Wu
  abstract: 'Accurate low-altitude 3D wind-field forecasting is essential for unmanned aerial vehicle operations and hazard early warning. However, iterative prediction remains difficult because data-driven models often suffer from error accumulation, distribution shift, and the loss of fine-scale turbulent structures. To address these challenges, this study proposes CSDiffWind, a condition-sensitivity-distilled diffusion framework for low-altitude 3D wind-field forecasting. CSDiffWind adopts a coarse-to-fine design: a Swin coarse predictor captures the dominant spatiotemporal evolution from historical multi-channel wind fields, while a conditional diffusion refiner learns residual corrections to restore local gradients, turbulent structures, and microscale details. To improve inference efficiency, condition sensitivity distillation enables a lightweight student model to learn both the CFG-guided teacher prediction and its response direction to conditional information. Experiments are conducted
    on a large-eddy simulation dataset and a Chengdu 2025 temperature–humidity–wind fusion dataset. Compared with the best baseline, CSDiffWind reduces MSE by 21.8% and 24.2% on the simulation dataset for single-step and 45-minute rolling prediction, and by 22.0% and 23.7% on the Chengdu fusion dataset for short-term and 45-hour forecasting. Overall, these findings suggest that CSDiffWind better represents the coupled effects of large-scale wind advection and urban boundary-layer perturbations, leading to more stable and physically consistent low-altitude wind-field forecasts.'

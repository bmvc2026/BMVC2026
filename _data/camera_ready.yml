- paper_id: T4GSP6eIm1
  number: 72
  status: Accept (Poster)
  title: 'SCE-CLIP: Geometry-Guided Attribute Decoupling via Spatial Consistency Enhancement'
  authors:
  - Yongxin Tang
  - Chang Feng
  - Wenze Wang
  - Haoxi Zhang
  abstract: Contrastive Language-Image Pre-training (CLIP) excels at global semantic matching, but its global objective provides limited patch-level spatial supervision, which can lead to spatial blindness and attribute-binding failures. We propose SCE-CLIP, a Geometry-Guided Spatial Consistency Enhancement framework that strengthens spatial-semantic grounding. Its Spatial Consistency Enhancement (SCE) loss aligns a text-to-patch similarity distribution with explicit geometric priors through KL-divergence regularization, while a Geometry-Guided (GG) training strategy uses synthetic primitives to create controlled counterfactual shape--color collisions. The synthetic stage uses no real-image pixel masks or bounding boxes. At inference, localization is obtained from a parameter-free patch--text similarity readout, without an additional learned decoder. On controlled collision tests, SCE-CLIP substantially improves robustness to color-matching distractors over global CLIP baselines. We separately
    evaluate CUB-200-2011 under a 1\% low-resource adaptation protocol with sparse part coordinates, where SCE-based variants markedly improve natural-image part localization. The controlled collision tests provide the direct evidence for binding robustness, whereas CUB evaluates low-resource spatial grounding. Overall, SCE-CLIP offers a lightweight mechanism for improving patch-level alignment and mitigating controlled attribute-binding failures in vision-language models.

- paper_id: MFTjxh97cy
  number: 1643
  status: Accept (Poster)
  title: Triple-Expert Learning from Noisy Labels for Semi-Supervised Vision Foundation Model Adaptation
  authors:
  - Hongyang He
  - Zheng Fang
  - Xuanyu Liu
  - Yundi Hong
  - Daizong Liu
  abstract: "Semi-supervised adaptation of vision foundation models (VFMs) commonly freezes the pretrained backbone and updates lightweight modules such as LoRA. \nHowever, pseudo-labels have mixed reliability, and a single LoRA adapter must absorb reliable, ambiguous, and noisy gradients in the same low-rank space. \nThis can make VFM adaptation sensitive to pseudo-label noise. \nWe propose TriNoL, a Triple-expert learning framework from Noisy Labels for semi-supervised VFM adaptation. \nTriNoL routes unlabeled samples into three confidence regions and assigns them to three LoRA experts: a Positive Expert for high-confidence pseudo-labels, an Alignment Expert for medium-confidence ambiguous samples, and a Negative Expert for low-confidence noisy samples. \nThe VFM backbone remains frozen, and only the LoRA experts and classifier head are updated. \nBy separating different pseudo-label reliability regions into specialized adaptation paths, TriNoL improves robustness to noisy supervision\
    \ while keeping the training cost low."

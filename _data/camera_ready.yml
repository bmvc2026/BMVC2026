- paper_id: dYLgP7jBrl
  number: 749
  status: Accept (Poster)
  title: Domain Generalization-Based Disentanglement of Subject Bias from Stress Signals for Multimodal Stress Recognition
  authors:
  - Seungkeon Lee
  - Yeongje Park
  - EUICHUL LEE
  abstract: Accurate stress recognition from non-contact physiological and behavioral signals remains challenging because substantial inter-subject variability limits generalization to unseen individuals. We propose a two-stage cross-subject domain generalization framework that disentangles subject-dependent bias from stress-discriminative representations using remote respiration patterns (rRSP) and facial-landmark dynamics. Subject-aware Representation Learning (SaRL) learns subject-specialized representations and classifiers capturing subject-specific physiological and behavioral response patterns, whereas Subject-invariant Representation Learning (SiRL) reuses these pretrained components as frozen subject-bias references. SiRL suppresses residual subject cues through uncertainty regularization, while classification and reconstruction preserve stress-discriminative and modality-specific information. Under strict subject-disjoint evaluation on UBFC-Phys, the method achieves 83.8\% accuracy
    for T1/T2/T3 under 8-fold cross-validation and 84.7\% for T1/T3(ctrl)/T3(test) under 5-fold cross-validation, outperforming the compared baselines. Objective and modality ablations support the complementary roles of the SiRL losses and facial/rRSP modalities. Quantitative analyses show more than 70\% reductions in multiple inter-subject discrepancy measures, while t-SNE visualizations show reduced subject clustering and clearer task-condition separability. An independent 54-subject, subject-disjoint evaluation on StressID further supports subject-centered bias suppression for improving cross-subject generalization to unseen individuals under the evaluated protocols.

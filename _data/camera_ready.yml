- paper_id: xdi6mGHdDz
  number: 1133
  status: Accept (Poster)
  title: 'Mars-JEPA: Multispectral Joint Embedding Predictive Architectures for Martian Landslide Segmentation'
  authors:
  - Sattwik Kumar Sahu
  - Aditya Sinha
  - Sujit PB
  abstract: Autonomous Martian exploration relies heavily on geomorphological mapping to mitigate mechanical hazards to robotic assets. While multispectral datasets have improved detection accuracy, traditional supervised models lack generalizability, and generative self-supervised approaches are computationally prohibitive and prone to learning trivial features through pixel reconstruction. In this work, we introduce Spatio-Spectral JEPA (SS-JEPA), a Joint Embedding Predictive Architecture specifically designed for multispectral terrain feature representation learning. Specifically, we propose a novel Spatio-Spectral masking strategy that tokenizes channels independently, forcing the model to learn deep physical correlations between heterogenous spectral bands, in an abstract latent space. On the MMLSv2 dataset, our best-performing SS-JEPA configuration achieves 0.865 mIoU, outperforming I-JEPA baselines by 2.8% and significantly exceeding the performance of single-model supervised backbones.
    While our single-model backbone trails the current state-of-the-art 5-fold ensemble by a marginal 0.2% mIoU, it does so with a $5.6\times$ reduction in parameter count. Our results demonstrate that latent-space prediction is more robust to Martian sensor noise and varying lighting conditions than traditional generative SSL. More broadly, our work presents a scalable and efficient framework for learning semantic representations from multispectral remote sensing data for terrain feature analysis.

- paper_id: FcKsgmJB15
  number: 1411
  status: Accept (Poster)
  title: 'RAMP: Robust Adaptive Mixed-Precision Quantization for Edge CPU Vision Models'
  authors:
  - David Población-Criado
  - Dario Garcia-Gasulla
  - Eduardo Quinones
  abstract: Deploying deep learning models on edge CPUs is often bottlenecked by computational and memory constraints. To alleviate this, mixed-precision quantization promises to reduce inference latency while preserving model accuracy. However, quantization affects different layer types in subtle and inconsistent ways, and yet identifying where accuracy loss is minimized and latency reduction is maximized is critical, as the effect accumulates over a full deployment into substantial savings or unacceptable task degradation. Such identification relies on sensitivity metrics, proxies that estimate layer-wise degradation without evaluating the task accuracy of every candidate policy. Nevertheless, widely used metrics fail systematically on modern architectures. We present a systematic empirical study of 13 sensitivity metrics for layer-wise INT8 quantization across four distinctly different neural networks, and validate the resulting policies on two ARM64 platforms. Gradient-based sensitivity
    methods fail on 4 out of 8 model-hardware configurations and weight-based statistics on 2. In contrast, the Jensen-Shannon Divergence achieves zero catastrophic failures, reliably isolating the layers that cannot be safely quantized. These results complement previous studies by quantifying how much more reliable output-space divergences are than the commonly used gradient- and weight-based criteria. A sensitivity metric alone does not define a policy, and the fixed thresholds typically used for that step are fragile over the highly skewed distributions of modern architectures. We address this with K-Means clustering, achieving near-lossless accuracy and a mean speed-up of $1.81\times$ over the full-precision model. Finally, we reveal that excluding from quantization the layers whose speed-up is negligible, regardless of their sensitivity, can be counterproductive, as it induces computational graph fragmentation and disables operator fusion. Our results yield concrete allocation policies
    for practitioners and researchers deploying quantized vision models on heterogeneous edge CPUs, without GPU access or gradient computation. Code is available at https://github.com/davidpob99/ramp-mpq.

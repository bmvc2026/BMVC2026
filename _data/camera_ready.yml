- paper_id: W47bhkSt17
  number: 138
  status: Accept (Poster)
  title: 'Emo-LiveSync: Real-Time Universal Lip Synchronization with Explicit Emotion Control'
  authors:
  - Sangjoon Yu
  - Seungeun Lee
  - JoonHyeok Shin
  - Ji-Su Kang
  abstract: Lip synchronization, the task of generating realistic lip movements synchronized with audio signals, is fundamental to applications such as film dubbing, virtual avatars, and digital content creation. Recent GAN-based methods offer computational efficiency but often lack visual fidelity, while diffusion-based approaches achieve high-quality results at the cost of substantial computational overhead. Moreover, most existing methods are limited to photo-realistic human faces, restricting their applicability to stylized characters and non-human entities. In this paper, we propose an efficient universal lip-sync video generation framework that achieves high-quality results without compromising computational efficiency. We revisit warp-based approaches and introduce a training strategy that aligns audio signals to an implicit motion space by distilling knowledge from a pre-trained video-to-motion model. This enables real-time inference while maintaining high visual fidelity, and naturally
    generalizes to diverse stylistic characters beyond photo-realistic humans. Furthermore, we introduce an expressive control gate that enables explicit manipulation of emotional expressions for enriched content generation. Extensive experiments demonstrate that our method achieves state-of-the-art performance in both visual quality and lip synchronization accuracy while ensuring real-time inference.

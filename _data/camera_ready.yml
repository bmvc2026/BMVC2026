- paper_id: glyh3ve0Kd
  number: 1171
  status: Accept (Poster)
  title: 'FlowSat: Flow-Matching Diffusion Transformers with Metadata Conditioning for Satellite Image Generation'
  authors:
  - Digvijay Singh Parihar
  - Rishabh Mondal
  - Nipun Batra
  abstract: |-
    Satellite image generation supports data augmentation, simulation, and
    counterfactual analysis in remote sensing, yet existing models inherit slow
    denoising U-Nets from natural-image diffusion and treat acquisition metadata
    weakly: global per-tile signals such as location, date, ground sampling
    distance, and cloud cover are folded into the timestep embedding without
    exploiting field geometry, or omitted entirely. We introduce **FlowSat**, a
    flow-matching Diffusion Transformer with structured global metadata
    conditioning. FlowSat fine-tunes a pretrained SANA DiT through a
    zero-initialised AdaLN metadata graft that preserves the backbone at
    initialisation, and a geometry-aware encoder representing location on the
    sphere, date cyclically, and sensor variables with multi-scale Fourier
    features. On fMoW-RGB, FlowSat attains the best FID and CLIP score among
    compared methods in only 20 Euler steps, at least 2.5× fewer than competing
    diffusion baselines. An encoder-controlled ablation attributes the gain to
    the geometry-aware encoding itself, improving FID from 46.81 to 37.96 with
    roughly 11× fewer conditioning parameters than a plain sinusoidal encoder.
    FlowSat transfers zero-shot to RSICD; ablations show zero initialisation is
    essential for stable fine-tuning, and controllability sweeps confirm
    expected seasonal and resolution changes.**Code:** <https://dsp81.github.io/flowsat-satellite-image>

- paper_id: Sf6UKC6TVk
  number: 615
  status: Accept (Oral)
  title: Is Single-View Mesh Reconstruction Ready for Robotics?
  authors:
  - Frederik P. Nolte
  - Andreas Geiger
  - Bernhard Schölkopf
  - Ingmar Posner
  abstract: |-
    This paper evaluates single-view mesh reconstruction models for their potential in enabling instant digital twin creation for real-time planning and dynamics prediction using physics simulators for robotic manipulation. Recent single-view 3D reconstruction advances offer a promising avenue toward an automated real-to-sim pipeline: directly mapping a single observation of a scene into a simulation instance by reconstructing scene objects as individual, complete, and physically plausible 3D meshes. However, their suitability for physics simulations and robotics applications under immediacy, physical fidelity, and simulation readiness remains underexplored. We establish robotics-specific benchmarking criteria for 3D reconstruction, including handling typical inputs, collision-free and stable geometry, occlusions robustness, and meeting computational constraints. Our empirical evaluation using realistic robotics datasets shows that despite success on computer vision benchmarks, existing approaches fail to meet robotics-specific requirements.
    We quantitively examine limitations of single-view reconstruction for practical robotics implementation, in contrast to prior work that focuses on multi-view approaches.
    Our findings highlight critical gaps between computer vision advances and robotics needs, guiding future research at this intersection.

- paper_id: InAaspSImQ
  number: 912
  status: Accept (Poster)
  title: 'CheXGround: Anatomical Region Tokens for Grounded Longitudinal Chest X-ray Interpretation'
  authors:
  - Adonay Demewez Gebremedhin
  - Wessam Shehieb
  - Sara Alansari
  - Mohamad Alansari
  - Muzammal Naseer
  - Sajid Javed
  - Naoufel Werghi
  abstract: "Recent radiology multi-modal language models have made substantial progress in chest X-ray report generation, visual question answering, and temporal reasoning. \nWhile longitudinal chest X-ray interpretation compares sequential examinations to describe change, visual grounding aims to connect clinical language with localized image evidence.\nAlthough longitudinal modeling and visual grounding have each advanced radiology language models, the role of localized visual evidence in generating language across a period of time remains under-explored. \nWe introduce \\textbf{CheXGround}, a region-grounded longitudinal chest X-ray language model that represents paired studies through corresponding anatomical regions. \nCheXGround extracts anatomical regions from current and prior radiographs, encodes them as temporally enhanced Region-of-Interest (ROI) tokens, and combines them with global temporal image context during generation. \nTo connect these region tokens with clinical text,\
    \ we propose Temporal Region--Phrase Alignment, a pretraining objective that aligns temporal anatomical representations with localized report phrases. \nWe evaluate CheXGround on single-study and longitudinal Visual Question Answering (VQA), longitudinal findings generation, temporal grounded VQA, and anatomical grounding. \nAcross these tasks, CheXGround improves clinical language quality, temporal reasoning, and localization accuracy over recent baselines. \nOur results suggest that organizing longitudinal evidence at the anatomical level is a strong representation for grounded radiology language modeling."

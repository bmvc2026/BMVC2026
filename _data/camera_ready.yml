- paper_id: VRxUBJDmme
  number: 660
  status: Accept (Poster)
  title: Flow-Guided Temporal Attention for Diffusion-Based Video Frame Interpolation
  authors:
  - Ajay Vamsi Velamarthi
  - Somdyuti Paul
  abstract: Recent diffusion-based video frame interpolation (VFI) methods have demonstrated improved perceptual quality over traditional flow-based approaches. State-of-the-art results in VFI have recently been achieved by leveraging the temporal attention mechanism of diffusion transformers (DiTs). While temporal attention enables cross-frame token interactions, the motion information needs to be implicitly inferred from such token interactions, which can limit performance in the presence of large motion. Further, implicit motion modeling from token interactions becomes more challenging as the model's learning capacity reduces. To address these limitations, we introduce explicit optical flow guidance to the DiT used for VFI, building upon EDEN, a DiT-based VFI model. Specifically, we incorporate optical flow priors for providing local guidance through gated token modulation prior to temporal attention and global flow-aware conditioning with pooled flow embeddings to modulate input tokens
    of transformer blocks via adaptive layer normalization. Experimental results demonstrate improved interpolation quality across perceptual and temporal consistency metrics. Larger gains are observed under large-motion scenarios, with 7.57% and 10.02% FloLPIPS gains over the best competing model achieved on the DAVIS and SNU-FILM (Extreme) benchmarks. Notably, a smaller variant of our model with only 62.7M parameters trained with explicit motion priors outperforms the baseline EDEN with 118.3M parameters, highlighting the efficacy of explicit motion priors as an inductive bias for diffusion-based VFI. Code is available at https://github.com/AjayVamsiV/EDENFlow.

- paper_id: AYUXPYoZUl
  number: 715
  status: Accept (Poster)
  title: 'MEIA: Reliability-Aware Multimodal Learning for Joint Emotion, Intention, and Action Recognition'
  authors:
  - Imad Gohar
  - Rashid Riyadh
  - Muzammil Behzad
  - John See
  abstract: 'A comprehensive understanding of human behaviour necessitates reasoning that integrates emotion, intention, and action. Traditional approaches frequently analyze these signals in isolation using single cues, which restricts their effectiveness in real-world contexts. We propose MEIA: Multimodal Emotion, Intention and Action, a unified tri-task multimodal framework for joint recognition of emotion (single-label), intention (multi-label), and action (multi-label) from paired visual and textual inputs. MEIA leverages vision and language encoders which are further integrated via a reliability-aware fusion module that dynamically weights modalities to mitigate noisy or incomplete inputs. We further extend the existing Multimodal IntentioN and Emotion Understanding in the Wild (MINE) and Facial Expressions & Emotion (FANE) datasets by introducing a newly generated multimodal dataset with aligned emotion, intention, and action annotations derived from textual and visual cues. To support
    scalable in-the-wild supervision, the dataset is constructed through a dual-teacher distillation pipeline that generates semantically aligned vision--language labels at scale. Furthermore, we address severe long-tailed class imbalance through a tri-task optimization scheme employing Dynamic Inverse Weighting and focal modulation. Extensive evaluations demonstrate that MEIA significantly outperforms multimodal baselines, achieving 91.88±0.43 emotion accuracy, 62.31±1.16 intention Macro-F1, and 81.30±1.17 action Macro-F1 on unseen test splits. https://github.com/rashidriyadh714-dev/MEIA-Framework'

- paper_id: vMx84QQe9m
  number: 606
  status: Accept (Poster)
  title: 'CoVR-R: Reason-Aware Composed Video Retrieval'
  authors:
  - Omkar Thawakar
  - Dmitry Demidov
  - Vaishnav Potlapalli
  - Sai Prasanna Teja Reddy Bogireddy
  - Viswanatha Reddy Gajjala
  - Alaa Mostafa Lasheen
  - Rao Muhammad Anwer
  - Fahad Shahbaz Khan
  abstract: Composed video retrieval (CoVR) aims to find a target video given a reference video and a textual modification. Prior work assumes the modification text fully specifies the visual changes, overlooking after-effects implicit consequences (e.g., motion, state transitions, viewpoint/duration cues) that emerge from the edit. We argue that successful CoVR requires reasoning about these after-effects. We introduce a reasoning-first, zero-shot approach that leverages large multimodal models to (i) infer causal and temporal consequences implied by the edit, and (ii) align the resulting reasoned queries to candidate videos without task-specific finetuning. To evaluate reasoning in CoVR, we also propose CoVR-Reason, a benchmark that pairs each (reference, edit, target) triplet with structured internal reasoning traces and challenging distractors that require predicting after-effects rather than keyword matching. Experiments show that our zero-shot method outperforms strong retrieval baselines
    on recall@K and particularly excels on “implicit-effect” subsets. Our automatic and human analysis confirm higher step-consistency and effect-factuality in our retrieved results. Our findings suggest that general-purpose LMM reasoning is an effective driver for CoVR, reducing the need for task-specific supervision and opening a path toward more explainable video search. Our model, code and benchmark will be publicly available.

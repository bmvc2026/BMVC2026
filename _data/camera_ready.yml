- paper_id: DUDDrjCysP
  number: 501
  status: Accept (Poster)
  title: 'StyleVerse: Infinite Style Sampling and Domain-Aware Text Adapters for Source-Free Domain Generalization'
  authors:
  - Mohd Athar
  - Snehasis Mukherjee
  abstract: 'Source-Free Domain Generalization (SFDG) enables models to generalize to unseen target domains without accessing source domain data. Existing SFDG methods suffer from two fundamental limitations: first, discrete feature coverage and second, modality gap at inference. We propose StyleVerse, a comprehensive SFDG framework that improves the state-of-the-art through four mathematically grounded improvements. First, we introduce per-class Gaussian Style Feature Resampling (SFR), fitting a Gaussian distribution over style-content features, and resampling new training examples each epoch, exponentially expanding effective training diversity. Second, we employ an LLM-generated semantic vocabulary of 367 domain-targeted style descriptors to reduce the modality gap at inference. Third, a Dual-Objective Channel Refinement Loss simultaneously minimizes intra-class style variance and maximizes inter-class feature separation in the style-removed embedding space. Fourth, a Text Adapter ensemble
    is proposed using an exponential kernel $\phi(x) = \exp(-\beta (1 - x))$, where $\beta$ is the kernel sharpness and $x$ is the cosine similarity across classes. The proposed kernel contains over 3,795 domain-class prototypes and provides complementary soft nearest-neighbor classification in inference. Extensive experiments on PACS, VLCS, OfficeHome, and DomainNet demonstrate that StyleVerse outperforms the state-of-the-art in all four benchmarks, achieving $60.02\%$ on DomainNet with ViT-B/16, a new state-of-the-art among source-free methods. The code will be available.'

- paper_id: I5HWWgNXMx
  number: 480
  status: Accept (Poster)
  title: Uni- and Bi-Directional Granularity-Aware Prompt Learning for Face Anti-Spoofing
  authors:
  - Kai-Heng Chien
  - Yi-Ting Lin
  - Pei-Kai Huang
  - Chiou-Ting Hsu
  abstract: Face Anti-Spoofing (FAS) is critical for securing facial biometric systems. However, existing Vision-Language Model (VLM)-based FAS approaches suffer from (a) coarse-grained supervision, (b) modality isolation, and (c) limited generalization to unseen attacks. To address these challenges, we propose UniBiFAS, a Uni- and Bi-directional Granularity-Aware Prompt Learning framework to enable deep, layer-wise cross-modal alignment between image and text branches. Since FAS relies heavily on subtle, low-level spoof cues, UniBiFAS strategically reverses the conventional unidirectional classification flow in VLMs. Specifically, early-stage image features guide the text encoder to focus on fine-grained spoof-related patterns, middle layers enforce bidirectional cross-modal refinement, and deeper text features steer the image branch to prevent subtle cues from being diluted by high-level identity semantics. To enhance spoof localization, we synthesize pseudo-spoof samples from live images
    by simulating fine-grained physical artifacts, such as moiré patterns and color distortions. Furthermore, to improve robustness against unseen attacks, we introduce a feature-level adversarial training mechanism that generates out-of-distribution (OOD) latent spoof representations. Extensive experiments on eight benchmarks demonstrate that UniBiFAS significantly outperforms previous FAS methods in both conventional two-class protocol and the live-only protocol without using actual spoof images, showing superior generalization to diverse and unseen attacks.

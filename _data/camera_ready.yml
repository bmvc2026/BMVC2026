- paper_id: yMK0OQ2ivl
  number: 509
  status: Accept (Poster)
  title: 'Revive-DETR: Combatting Representation Collapse for Tiny Object Detection'
  authors:
  - Xin Feng
  - Ang Gao
  - Yunlong Wang
  - Liu Cui
  abstract: 'Tiny object detection remains a challenging problem despite the rapid progress of generic object detectors. We identify representation collapse as a key bottleneck: as feature maps are repeatedly down-sampled in deep networks, the sparse structural cues of tiny objects are progressively weakened and can be overwhelmed by background clutter, leading to unreliable query initialization and weak discriminative representations. To address this issue, we propose Revive-DETR, a plug-and-play framework that improves tiny object detection through query isolation and feature revival. First, we introduce Decoupled Prior Gated Sampling (DPGS), which combines a spatial prior with geometric cues to allocate a dedicated query quota for tiny objects, reducing their competition with larger objects and background responses during query selection. Second, we propose Target-Aware Sparse Injection (TASI), which uses the localized tiny-object queries to retrieve high-resolution patches from shallow
    feature maps and translate them into semantic-aware residuals for deep query embeddings. With a zero-initialized injection design, TASI gradually learns to recover missing structural details without disrupting the pre-established attention behavior of the detector. Extensive experiments on AI-TOD, VisDrone2019, and SODA-A demonstrate the effectiveness and generality of our method. Notably, on AI-TOD, Revive-DETR improves the most challenging $AP_{vt}$ metric by +3.2 points over the baseline, achieving state-of-the-art performance on extremely tiny objects while introducing only a small computational overhead.'

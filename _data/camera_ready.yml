- paper_id: AG677mzGRF
  number: 583
  status: Accept (Poster)
  title: 'Why Multi-Source Audio Fails to Compose: A Geometric Diagnosis and Its Remedy'
  authors:
  - Anurag Singh
  - Prajwal Singh
  - Shanmuganathan Raman
  abstract: 'Multi-source audio-to-image generation often fails compositionally because audio tokens learned via reconstruction objectives can occupy geometrically displaced, semantically unanchored positions in the CLIP text-token space, where the diffusion U-Net lacks the prior needed to attend to them reliably or ground them in distinct spatial regions. We formalize this as the \textit{geometric displacement} phenomenon and make it explicit through a two-level clustering analysis comparing BEATs and CLAP embeddings at both the raw encoder level and the projected CLIP token level. Three geometric properties emerge as important: intra-class compactness, angular alignment with the CLIP text manifold, and inter-token spatial separation. We show that CLAP, whose contrastive language-audio pretraining aligns embeddings with natural language semantics, substantially outperforms BEATs across all three properties, improving the silhouette score by more than 3× and the Audio-Image Content score.
    Building on this geometric analysis, we introduce a multi-token extension that requires no diffusion-backbone retraining, assigns each audio source to a distinct placeholder token in the CLIP tokenizer, and complements it with a mixed inference-time objective that combines Attend-and-Excite with an A$^\ast$ spatial separation loss to resolve residual cross-token interference during denoising. To support evaluation, we construct compositional benchmarks from VGGSound with multiple input audios, VGG2, VGG3, and VGGN, and extend six standard audio-image metrics to the multi-source setting. Across five benchmarks and against four strong baselines, our method achieves strong results on the metrics most directly tied to compositional faithfulness, with AIC improvements exceeding 2× over the strongest baseline on the in-distribution compositional benchmarks. We propose geometric displacement as a diagnostic framework for cross-modal generation systems that project learned embeddings into a
    pretrained contrastive space.'

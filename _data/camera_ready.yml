- paper_id: EaLwE884Lx
  number: 989
  status: Accept (Poster)
  title: 'RDM: Recurrent Diffusion Model for Human Motion Generation'
  authors:
  - Mirgahney Mohamed
  - Harry Jake Cunningham
  - Riccardo Barbano
  - Marc Peter Deisenroth
  - Lourdes Agapito
  abstract: "Human motion generation is a challenging task due to its high dimensionality and the difficulty of generating fine-grained motions.  \nDiffusion methods have been proposed due to their high sample quality and expressiveness. \nEarly approaches treat the entire sequence as a whole, which is computationally expensive and restricts sequence length. \nIn contrast, autoregressive diffusion models generate longer sequences. \nHowever, their reliance on fully denoising previous frames complicates training and inference. \nConsequently, we propose RDM, a new recurrent diffusion formulation inspired by Recurrent Neural Networks (RNNs).\nRDM explicitly conditions the diffusion process on preceding noisy frames, avoiding the cost of full denoising. To overcome the challenge of maintaining its probabilistic nature, we employ Normalizing Flows to model recurrent connections.\nOur evaluations demonstrate RDM's effectiveness: it achieves comparable performance to autoregressive baselines and\
    \ generates long sequences that remain aligned with the text.\nRDM also skips diffusion steps during inference, reducing computational cost by up to $18\\times$ over autoregressive baselines.\nProject page: https://www.mirgahney.com/rfdm.io/."

- paper_id: hNKdCOwuuH
  number: 560
  status: Accept (Oral)
  title: Context-Guided Semantic Alignment for Feature Fusion Networks
  authors:
  - Hyungseop Lee
  - Jiho Lee
  - Woochul Kang
  abstract: "Feature fusion networks are fundamental components in modern object detectors, aggregating multi-scale features to detect objects of varying sizes. \nHowever, directly fusing features from different pyramid levels often introduces semantic inconsistency, causing information conflicts that distort the fused representation and degrade detection accuracy.\nIn this paper, we propose Feature Interaction NEtwork (FINE), a lightweight semantic alignment module that refines low-level features via high-level contextual guidance using cross-level attention prior to fusion. \nTo bridge the structural gap and ensure computational efficiency, we introduce an Alignment-Aware Token Sampling that aligns corresponding spatial regions across scales, reducing the attention complexity by an order of magnitude.\nThe resulting attention weights generate a spatial-channel modulation map that is applied to the low-level features via residual element-wise modulation. \nThis mechanism enables the network\
    \ to selectively enhance semantically relevant pixels while preserving the sub-pixel localization accuracy necessary for dense prediction tasks.\nFINE is generally applicable to various detectors and consistently improves detection accuracy with minimal computational overhead.\n\\faGithub \\ \\textit{Code: \\href{https://github.com/HyungseopLee/FINE}{HyungseopLee/FINE}}"

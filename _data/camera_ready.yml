- paper_id: wPj2tmnuqK
  number: 187
  status: Accept (Poster)
  title: 'CamoNeXt: Structure-Preserving Camouflage Generation with Background-Conditioned Diffusion'
  authors:
  - Ciheng Wu
  - Min Liu
  - Minming Ye
  - XiaoLiu
  - Chule Yang
  - Naiyang Guan
  abstract: 'In this work, we propose \textbf{CamoNeXt}, a background-conditioned diffusion framework that enables an object to visually blend into the surrounding environment while preserving the object''s structure. Most existing camouflage generation methods either alter the background or synthesize the entire image, which is at odds with real-world scenarios where the background is typically immutable. \textbf{CamoNeXt} introduces three modules: Masked Edge Control (MEC) extracts edges strictly within the object mask to lock object contours; Semantic Prompt-Aligned Attention Calibration (SPAC) leverages a vision-language model (VLM) to generate camouflage-oriented prompts for both camouflaged and non-camouflaged images, and performs parameter fine-tuning of cross-attention projections to align the diffusion prior with camouflage semantics; and Background-Masked Adapter (BMA) aggregates texture features from background regions and injects them into selected U-Net blocks to guide texture
    adaptation inside the masked object. Experiments on standard camouflage benchmarks validate the effectiveness of \textbf{CamoNeXt} and show that it consistently outperforms existing methods for camouflage image generation.'

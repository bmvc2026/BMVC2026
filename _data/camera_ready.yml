- paper_id: zCPjUyUDWC
  number: 1325
  status: Accept (Poster)
  title: 'SubPixR: A Generic Iterative Sub-Pixel Refiner for Point Tracking and Feature Matching'
  authors:
  - Tudor Alexandru Ileni
  - DARABANT Sergiu Adrian
  - Maduta Adrian-Pavel
  abstract: 'Sub-pixel residuals from modern point trackers and feature matchers dominate pose-estimation, tracking, and reconstruction metrics at tight thresholds. Existing refiners (Patch2Pix, S2DNet, CAPS) were each designed and evaluated inside their own sparse-matching pipeline and have never been tested on point tracking; trackers, in turn, treat sub-pixel precision as an internal concern. We present SubPixR, the first sub-pixel refiner evaluated jointly on long-term point tracking and feature matching, trained once on synthetic 3D-rendered patch pairs and applied unmodified to both regimes. Two contributions carry the result: (i) a ``closed-loop'''' scheme for TAP-Vid trackers in which the refiner''s own working template is updated frame-by-frame by an exponential moving average (EMA), keeping the visual anchor aligned with the tracked object; and (ii) a ten-configuration benchmark spanning TAP-Vid (DAVIS / Kinetics / RGB-Stacking), HPatches, MegaDepth, and ScanNet that places sparse,
    semi-dense, and dense refiners on equal footing. Closed-loop refinement reduces endpoint error (EPE) by up to 10.1\% on DAVIS-online (CoTracker3) and 25.5\% on RGB-Stacking-offline (TAPIR); SubPixR also improves two-view pose accuracy (mean Average Accuracy, mAA) on 3 of 5 MegaDepth matchers and all 5 ScanNet matchers, and correctly localises 58.8\% of perturbed keypoints within a 3-pixel threshold on HPatches---a mean matching accuracy (MMA@3) that is $+18.4$ points above the next-best local refiner (CAPS, 40.4\%). The 9.52 M-parameter network runs at 7.8 ms per keypoint---2.2$\times$ faster than S2DNet and 11$\times$ faster than COTR.'

- paper_id: 2Tk56ehUnb
  number: 163
  status: Accept (Poster)
  title: 'VSDPose: Voxel-based Self-distillation for Multi-view 3D Human Pose Estimation'
  authors:
  - Bo han chen
  - Chia-Chi Tsai
  abstract: |-
    Multi-view human pose estimation predicts 3D human joint locations from multiple synchronized views, providing greater robustness to occlusion and reduced depth ambiguity.
    A key challenge is how to further improve accuracy by effectively leveraging multi-view information within voxel-based frameworks.
    In this work, we propose VSDPose, Voxel-based Self-Distillation for multi-view 3D human Pose estimation.
    In a typical voxel-based pipeline, 2D features extracted by a backbone network are processed by RootNet for root localization, followed by PoseNet for 3D joint regression.
    Our Voxel-based Self-Distillation (VSD) module integrates knowledge distillation into this two-stage pipeline, enabling self-distillation for multi-view human pose estimation within voxel-based frameworks.
    Without relying on any external teacher model, our VSD module treats PoseNet as the teacher model, while RootNet and the backbone act as student models.
    More accurate 3D human poses provide refined supervision for estimating 3D root joints and multi-view heatmaps, thereby establishing a positive feedback loop that progressively improves pose estimation accuracy.
    We evaluate the proposed VSD module by integrating it into representative voxel-based methods, including VoxelPose, Faster VoxelPose, and 3DSA, on the Panoptic dataset, achieving consistent performance improvements across all models.

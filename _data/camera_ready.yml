- paper_id: BkKMvBhosD
  number: 1297
  status: Accept (Poster)
  title: 'GaitPPT: Parallel Part-based Transformer for Gait Recognition from Lidar Point Clouds'
  authors:
  - Balázs M. Bódis
  - Gergő Nagy
  - Csaba Benedek
  abstract: 'Recognizing a person by gait, i.e., the way they walk, is a well-studied biometric task for which Lidar point clouds offer substantially greater robustness than 2D images: the sensor is less affected by lighting and captures the 3D shape of the body more directly, which most notably improves robustness to viewpoint changes. Recent methods for Lidar gait recognition have focused on adapting point-cloud or voxel encoders to the gait domain, but the way information is aggregated within and across frames has received less attention. Most systems take the maximum activation across frames, ignoring that different feature channels may peak at different times in the gait cycle. We introduce GaitPPT, a Parallel Part-based Transformer that targets two underexplored design axes: where attention is allocated within a frame, and how information is aggregated across frames. Spatially, GaitPPT runs multiple transformer encoder branches in parallel, each restricted to a horizontal slice of
    the body at a different vertical resolution; e.g., leg-height tokens cannot attend to torso-height tokens. Temporally, a lightweight learned module assigns every feature channel its own per-frame weighting, replacing the max-over-frames pooling used by prior work. On the SUSTech1K benchmark, GaitPPT-Base reaches $94.23\%$ Cross-view Rank-1 with only $2.87$M parameters, an absolute improvement of $1.53\%$ over the previous best point-based method, LidarGait++ ($92.70\%$ at $4.32$M), while using roughly one-third fewer parameters. These results suggest that an explicit vertical-structure prior is a useful inductive bias for Lidar-based gait recognition, and that frame-wise max pooling underutilizes the temporal structure of gait.'

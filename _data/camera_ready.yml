- paper_id: t09CJLi83O
  number: 543
  status: Accept (Poster)
  title: 'PhysBeam: Physics-Informed Beam Splatting for Snowy LiDAR Simulation'
  authors:
  - Wenhao Rao
  - Guowei Fu
  - Yanming Yang
  - Mahdi Rezaei
  - Qian Xie
  abstract: LiDAR perception plays a critical role in autonomous driving, particularly under adverse weather conditions where camera-based perception can become unreliable. However, collecting large-scale LiDAR data in adverse weather, such as snowy scenes, is difficult, expensive, and often limited by safety and environmental constraints. This scarcity makes it challenging to develop and evaluate robust 3D perception models for such conditions. To address this issue, we propose PhysBeam, a physics-informed beam splatting framework for controllable snowy LiDAR point cloud generation that combines scene resimulation, 3D Gaussian splatting, and sensor-weather interaction modelling. PhysBeam represents the sensing environment as a unified Gaussian scatter field, where both scene surfaces and snow particles are modelled as physical Scatterers that jointly interact with each emitted LiDAR beam. This enables unified modelling of attenuation, backscatter, and power competition during LiDAR acquisition.
    Given a clean Gaussian scene reconstruction and specified snow parameters, our framework generates physically consistent snowy LiDAR scans. Experiments on real-world datasets show that our simulation better matches real snowy LiDAR statistics than existing baselines, improves downstream 3D object detection in snowy scenes, and provides interpretable control over weather severity.

- paper_id: 19xwTj7Wf5
  number: 1714
  status: Accept (Poster)
  title: Gland-Boundary Structure-Aware Networks for Generalizable Gleason Grading
  authors:
  - Guoshuai Xu
  - Kai Zhang
  abstract: 'Whole-slide images (WSIs) are central to the diagnosis and grading of prostate cancer. Deep networks now reach high accuracy on Gleason grading, yet they generalise poorly across slides: when training and test patches come from different WSIs, and especially from different centres or scanners, accuracy drops sharply. Our key observation is that Gleason grading is, in large part, a description of how gland-boundary structure degrades: regular, well-separated glands (pattern 3) progressively fuse and ultimately disappear (patterns 4 and 5). Building on this observation, we introduce GBSNet, which models gland-boundary structure explicitly. GBSNet consists of two modules: a gland-boundary prior module that turns colour-agnostic geometric cues into a soft spatial attention map, and a grading module that uses this attention to predict a slide-level grade. The prior module is guided by pixel-level gland annotations during training and requires none at inference. Because the modulation
    preserves the shape of the feature map, GBSNet is plug-in to any multiple-instance-learning (MIL) aggregator and to any backbone, including frozen pathology foundation models, where it further narrows the residual gap. Across SICAPv2, PANDA and BACH, GBSNet narrows the cross-slide generalisation gap by a margin that is significant under paired testing. To establish that the gain comes from the boundary information itself rather than from added capacity or from stain invariance, we break the attention while leaving the architecture intact, and most of the gain disappears. We report standard deviations and paired significance tests throughout.'

- paper_id: abfFdgw42E
  number: 1074
  status: Accept (Poster)
  title: Lighting-Aware Diffusion-based Data Augmentation for Robust Low-Light Re-Identification
  authors:
  - Toan Manh Bui
  - Donghyeok Min
  - Inyoung Oh
  - Junghyun Cho
  abstract: Low-light Re-Identification (LL-ReID) of pedestrians or vehicles plays a crucial role in real-world applications, but its progress is limited by the scarcity of labeled data collected under such low-light conditions. A straightforward approach is to synthesize low-light samples by translating foreground objects captured under normal illumination into low-light backgrounds using relighting or image-to-image translation techniques. In practice, however, this approach often fails because images in existing ReID datasets frequently degraded by low visual quality and camera distortions, making it difficult to reliably separate foreground objects from the background, especially under occlusions, motion blur, and blooming artifacts. To address these challenges, we propose a novel synthetic data generation framework, called Day-to-Night Adaptation via Diffusion (DNA-Diff), that explicitly accounts for lighting conditions while preserving identity information through an IP-Adapter. Our
    simple yet effective method generates low-light images that are both visually plausible and statistically reliable while maintaining identity consistency. Extensive experiments demonstrate that the proposed method significantly enhances the effectiveness of data augmentation for ReID models. As a result, models trained with augmented datasets become more robust to challenging low-light conditions and achieve improved performance in real-world applications such as surveillance, nighttime monitoring, and autonomous systems.

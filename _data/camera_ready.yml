- paper_id: TcjiYCeGkK
  number: 786
  status: Accept (Poster)
  title: 'RefineFlow : Estimating the Editing Velocity with Geometric, Trajectory, and Locality Priors for Inversion Free Flow Editing'
  authors:
  - RAMESHWAR MISHRA
  - A. Subramanyam
  abstract: Text guided image editing with rectified flow models has shown strong performance for simple edits, yet editing several attributes simultaneously through a single composite prompt remains challenging. Existing inversion free methods construct a single editing trajectory from target and source conditioned velocity differences. Under multi-target settings, the resulting editing velocity may contain geometric bias, trajectory inconsistencies, and unintended spatial propagation, leading to incomplete edits and degraded source preservation. We present RefineFlow, a training free framework that formulates multi target editing as a per step editing direction estimation problem. The resulting editing direction is refined through three complementary priors that constrain valid editing directions, trajectory evolution, and spatial propagation. A geometric prior constructs an order invariant editing subspace, removes source aligned bias, and suppresses off edit residual components through
    adaptive token level attenuation. A trajectory prior improves editing direction estimation through directional aggregation and predictor-corrector refinement. A locality prior identifies source stable regions and restricts unintended edit propagation through adaptive source locked corrections. Experiments on standard multi target editing benchmarks demonstrate consistent improvements in semantic alignment and source fidelity over inversion free baselines.

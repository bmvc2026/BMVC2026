- paper_id: 80E4zn3zCd
  number: 1747
  status: Accept (Poster)
  title: 'MobileGestMesh: Pretrain-Free 3D Hand Mesh Estimation via Multi-Scale Token Mixer and Bounded Two-Stage Decoding'
  authors:
  - Kamal
  - Deep Haloi
  - Debanga Raj Neog
  - M.K. Bhuyan
  abstract: Monocular 3D hand mesh estimation must balance reconstruction accuracy with computational cost, particularly in augmented reality, mobile HCI, and wearable vision. Most competitive systems rely on large pretrained backbones. We instead study a controlled pretrain-free setting in which the encoder is learned from random initialisation using only the FreiHAND training split. MobileGestMesh combines a DenseStack++ backbone with CBAM attention and a Multi-Scale Token Mixer that fuses a CNN feature pyramid through a lightweight Transformer encoder. A two-stage mesh decoder first predicts a coarse mesh from a 192-dimensional, training-set PCA basis and then applies per-vertex residuals bounded to 8 mm. The model is trained end to end with an eight-term geometric objective, including camera-projection consistency and a K-NN edge regulariser that does not require MANO face files. On our held-out FreiHAND validation split, the pretrain-free model obtains 6.75 mm PA-MPJPE (PJ) and 6.85
    mm PA-MPVPE (PV) at 13.6 GFLOPs and 69 FPS on an RTX A5000. Replacing DenseStack++ with an ImageNet-pretrained ResNet50, while retaining the decoder design and retraining the complete model, gives 5.92 mm PJ and 6.02 mm PV under the same local protocol. Published test-server results are included as contextual references only because they use a different evaluation split. The encoder study shows that the decoder architecture can be used with several encoder families, while the choice and initialisation of the encoder remain important for accuracy.

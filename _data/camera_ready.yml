- paper_id: Dv4osoypUD
  number: 334
  status: Accept (Poster)
  title: Fine-Grained Pedestrian Retrieval via Attribute-Aware Visual Grounding in Vision-Language Models
  authors:
  - Abhinav Nagpal
  - Chetan Arora
  abstract: 'Person re-identification (ReID) demands precise, fine-grained identity reasoning to overcome extreme variations in viewpoint, illumination, and modality. While recent vision-language model (VLM) based approaches have advanced multimodal understanding, they primarily rely on globally entangled representations. This entanglement often under-specifies subtle identity cues and leaves models vulnerable to shortcut reasoning when confronted with visually similar distractors. In this work, we propose AAG-ReID, an Attribute-Aware Visual Grounding framework designed to enforce spatially localized attribute reasoning. AAG-ReID introduces a Semantic Attribute Parser to decompose pedestrian images into three specialised views: person, clothing, and accessories. We implement a three-stage training strategy for visually grounding reasoning. In first stage, we train our model to generate fine-grained visually grounded descriptions based on the input image and three specialised views. In the
    second stage of the training, we instruction tune our model using view-controlled grounding tasks such as matching clothing view to the global view. The third stage trains the model for grounded ReID specialization. Extensive evaluation across 10 benchmarks in 4 diverse ReID settings demonstrates consistent state-of-the-art performance, establishing attribute-aware visual grounding as a superior paradigm for fine-grained pedestrian retrieval.'

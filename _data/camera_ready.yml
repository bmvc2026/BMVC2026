- paper_id: L8bnuTvVTh
  number: 441
  status: Accept (Poster)
  title: 'MedPlex: Deep Vision-Language Co-Adaptation for Clinically Grounded Medical Segmentation'
  authors:
  - Rafi Ibn Sultan
  - Hui Zhu
  - Chengyin Li
  - Dongxiao Zhu
  abstract: 'Medical image segmentation is still largely trained as a vision-only problem, even though clinical interpretation often relies on textual knowledge about anatomy, location, appearance, and surrounding context. Text-guided segmentation methods within the Vision-Language Model (VLM) paradigm seek to bring this complementary knowledge into dense prediction, but language is often used only as a static conditioning signal: encoded once, introduced after substantial visual abstraction, and weakly connected to how visual representations are formed. We argue that text can meaningfully guide segmentation only when it remains active throughout visual representation learning and is grounded in the clinical concepts that distinguish anatomical structures. We introduce **MedPlex** (**Med**ical **Plex**us of Vision and Language), an end-to-end VLM framework that turns text guidance into a continuous, clinically grounded learning process. Through **BiFusion** (**Bi**directional **Fusion**),
    visual and textual representations evolve together across the encoding hierarchy, while *class-level concept alignment* and *region-level concept alignment* anchor this shared representation to what each anatomical target is and where its descriptive concepts (e.g., shape, location, appearance, and texture) appear in the image. In this way, MedPlex uses language not as a late descriptor, but as structured guidance for learning segmentation representations. MedPlex achieves state-of-the-art performance across CT and MR benchmarks covering multi-organ, cardiac substructure, and tumor segmentation, including settings with real free-text clinical supervision. Source code: https://github.com/rafiibnsultan/MedPlex'

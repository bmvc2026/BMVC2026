- paper_id: DzA8di5dZV
  number: 1280
  status: Accept (Poster)
  title: 'RafeVPR: UAV Visual Localization with Adaptive Region Partitioning and Fourier Residual Enhancement'
  authors:
  - Yuhang Zhao
  - Fan Li
  - PING KUANG
  - Kaige Zhang
  abstract: Visual localization for unmanned aerial vehicles (UAVs) is essential to achieving autonomous navigation and wide-area perception. Existing methods predominantly rely on fixed region partitioning and spatial-domain enhancement, which limits their ability to adaptively focus on discriminative regions and exploit frequency-domain structural information. To address these limitations, we propose RafeVPR, a novel visual place recognition model. RafeVPR introduces an adaptive region partition module that replaces fixed grids with dynamic soft allocation, enabling feature aggregation to automatically concentrate on salient areas. In addition, a lightweight Fourier residual adapter enhances frequency-domain feature representations through parallel processing of different frequency components, improving feature discriminability with parameter-efficient fine-tuning. Extensive experiments on the UAV-VisLoc dataset demonstrate that RafeVPR achieves state-of-the-art performance, with average
    Recall@1 and Recall@5 reaching 70.06\% and 84.56\% across all test subsets, respectively. Ablation studies further validate the efficacy of each component. This research provides a new perspective for achieving robust UAV autonomous navigation in complex, GPS-denied  environments.

- paper_id: b1DxyuGPAJ
  number: 283
  status: Accept (Poster)
  title: 'DDM‑Net: Multi‑Weather Image Restoration with a Compact Dual‑Domain Mixer'
  authors:
  - Santosh Kumar Sharma
  - Snehasis Mukherjee
  abstract: We introduce DDM‑Net, a compact Dual‑Domain Mixer for unified multi‑weather image restoration. DDM‑Net compresses corrective processing into a 3‑channel RGB bottleneck and applies complementary spatial and spectral corrections — learned intensity remapping and smoothing in the spatial path, and log‑magnitude plus masked‑phase refinement with a differentiable radial low‑pass in the frequency path — fused by adaptive scalar gates, cross‑terms and a lightweight residual refiner. Operating in an RGB bottleneck reduces FFT cost and lets the mixer act as a standalone ultra‑compact restorer. The full encoder–decoder requires only 0.228M parameters (6.453G MACs) while the standalone mixer runs with 0.005M parameters (0.409G MACs), and our evaluations on dehazing, deraining and desnowing benchmarks show competitive fidelity (PSNR/SSIM/LPIPS) and perceptual quality. We report ablations and deployment measurements that explain the efficiency–accuracy tradeoffs and demonstrate the method's
    suitability for on‑device use.

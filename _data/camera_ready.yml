- paper_id: Kp0rZrO3Qm
  number: 1577
  status: Accept (Poster)
  title: 'FlexSplat: Flexible Feed-Forward 3D Gaussian Splatting without Point Cloud Correspondence'
  authors:
  - Amir Sabbaghziarani
  - Hanting Ye
  - Maria Gorlatova
  - Yi Ding
  abstract: 'We present FlexSplat, a feed-forward framework for novel view synthesis (NVS) from uncalibrated, object-centric multi-view image collections. A recent line of query-based methods reconstructs a compact set of 3D Gaussians by treating them as transformer queries that are refined with multi-view deformable attention; these methods, however, assume that camera poses are given. FlexSplat removes this assumption: a geometry transformer is trained jointly with the Gaussian decoder to predict per-image camera parameters and depth, which in turn ground a depth-guided Gaussian parameterization and a multi-view deformable cross-attention that aggregates evidence across all input views into a single, view-consistent set of primitives. An uncertainty-weighted depth self-consistency term lets the jointly trained geometry adapt to the reconstruction task, while the cross-view consensus formed during decoding absorbs the residual error of the estimated cameras and depth. The representation
    uses a compact Gaussian budget that is decoupled from the input resolution—unlike pixel-aligned methods, the primitive count does not grow with the image grid—and is not dictated by the number of views. On ShapeNet-SRN and Google Scanned Objects (GSO), FlexSplat matches or approaches posed state-of-the-art reconstructors while requiring neither camera poses nor ground-truth depth, and matches the best perceptual (LPIPS) quality among the compared methods on GSO. It also beats the two-stage predict-then-reconstruct alternative by 2.27 dB under one matched evaluation pipeline. Our results indicate that a jointly trained geometry front-end is sufficient to bring calibration-free operation to query-based Gaussian reconstruction while staying within 0.7 dB PSNR of posed methods (0.45 dB against a matched re-run) and matching their perceptual quality. The code is available at [https://github.com/amir-sbg/FlexSplat](https://github.com/amir-sbg/FlexSplat).'

- paper_id: lOibn7cjd8
  number: 1011
  status: Accept (Poster)
  title: 'PRISSM: PRV-Guided SSM for Non-contact Stress Estimation'
  authors:
  - Juha Park
  - Jiho Choi
  - Sang Jun Lee
  abstract: Recognizing stress states is essential for maintaining mental health and preventing stress-related disorders. Stress can be inferred from physiological signals, which are traditionally acquired using contact-based sensors such as electrocardiography and photoplethysmography. However, contact-based approaches may cause discomfort and are often unsuitable for long-term continuous monitoring. To address these limitations, we propose PRISSM, a non-contact stress estimation framework that combines remote photoplethysmography (rPPG) with selective state space modeling using pulse rate variability (PRV). PRISSM first estimates a blood volume pulse signal from facial video using an rPPG estimator and then performs stress recognition with our proposed StressMamba module in which the selective state-space parameters are dynamically modulated by frequency-domain PRV features through a PRV adapter. This design enables the model to integrate learned temporal pulse dynamics with physiologically
    interpretable PRV features associated with sympathetic nervous system activity. We evaluate PRISSM in controlled laboratory dataset UBFC-Phys and a real-world dataset RPED. We further assess PRISSM on stress state recognition and stress level recognition to examine stress estimation from both state and level perspectives. Experimental results show that PRISSM achieves the highest mean performance among the evaluated methods, improving accuracy on UBFC-Phys by 4.42 and 6.17 percentage points for stress-state and stress-level recognition, respectively.

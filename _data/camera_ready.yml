  - cuong tien nguyen
  - Dinh Viet Sang
  abstract: 'Thyroid ultrasound analysis requires both accurate lesion delineation and reliable malignancy prediction. However, existing methods typically treat segmentation and classification as separate tasks: segmentation models often predict only binary lesion masks, whereas image-level classifiers may rely on background cues without explicit lesion localization. We present SAT-Net, a unified semantic-aware framework for joint thyroid nodule segmentation and malignancy classification. Instead of attaching a separate image-level classifier to a segmentation backbone, SAT-Net associates lesion regions with benign/malignant semantics through a frozen BGE text encoder, a learnable medical concept projection, contrastive concept separation, parameter-efficient adapter tuning, and a boundary-aware curriculum sampling strategy. In our formulation, class specific proposed mask logits are used to derive malignancy prediction, while prompt-grounded mask logits are used to produce the final lesion
    segmentation mask. To the best of our knowledge, SAT-Net is among the first VLM-based promptable segmentation frameworks for joint thyroid nodule segmentation and malignancy classification via mask-level semantic assignment. On ThyroidXL, SAT-Net achieves 81.52% IoU and 89.12% Dice for segmentation, while obtaining the best accuracy and F1 among the evaluated classification baselines, with 86.63% accuracy and 85.83% F1. On TN3K, under a strict setting without TG3K gland annotations or auxiliary gland supervision, SAT-Net achieves 79.21% IoU and 86.68% Dice. These results show that SAT-Net performs best among the evaluated comparable baselines under the stated evaluation protocols. The project repository is available at github.com/chau25102001/SAT-Net.'

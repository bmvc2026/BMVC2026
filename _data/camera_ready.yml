- paper_id: 7lYHh6xgMX
  number: 1624
  status: Accept (Poster)
  title: A Feasibility Study on Self-Supervised LLM-Inspired Training for Generalizable Human Motion Understanding
  authors:
  - Mohammadreza Baharani
  - Ghazal Alinezhad Noghre
  - Armin Danesh Pazho
  - Gabriel Maldonado
  - Amir Kimiyaie
  - Hamed Tabkhi
  abstract: Despite recent advances in foundation models across text and vision, the potential of large-scale self-supervised pre-training for learning generalizable human motion representations remains largely unexplored. Inspired by the emergent generalization properties of large language models, we present a feasibility study and proof of concept demonstrating that LLM-inspired self-supervised training can be effectively applied to human motion understanding, enabling a single unified pretrained backbone to generalize across structurally different downstream tasks. Our approach encodes continuous human body motion into discrete tokens using a learned dictionary of motion primitives, enabling LLM-style pretraining over pose sequences while deliberately excluding surrounding scene context to preserve privacy. The resulting pretrained vision transformer is evaluated across action classification and both supervised and unsupervised anomaly detection by appending only a fully connected linear
    layer, without any task-specific architectural modification or pretraining. While not targeting state-of-the-art performance on any individual task, our model achieves comparable results to task-specific methods under similar backbone configurations across all evaluated tasks. On action classification, we demonstrate competitive performance on NTU RGB+D under both fine-tuning and one-shot learning paradigms. On anomaly detection, we achieve a frame-level AUC-ROC of 76.56% on ShanghaiTech in a self-supervised setting and 69.55% on UBnormal in a supervised setting. These results provide early evidence that LLM-inspired discrete motion tokenization is a viable and promising direction toward unified, privacy-preserving, and generalizable human motion understanding.

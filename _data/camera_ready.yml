- paper_id: CDrG0vClmD
  number: 416
  status: Accept (Poster)
  title: 'From Alignment to Synthesis: Contrastive Volumetric Grounding for Text-to-CT Generation'
  authors:
  - Daniele Molino
  - Camillo Maria Caruso
  - Filippo Ruffini
  - Paolo Soda
  - Valerio Guarrasi
  abstract: "Generating semantically controllable 3D CT volumes from radiology reports requires more than a rich text encoder, it requires vision-language alignment grounded in volumetric space.\nExisting Text-to-CT approaches condition generation on encoders pretrained with language only or 2D vision-language objectives, providing conditioning signals that are linguistically expressive but volumetrically blind.\nWe argue this is a structural limitation: the quality of 3D vision-language alignment, not the richness of the text encoder, is the primary bottleneck for semantic controllability in volumetric diffusion models.\nTo address this, we propose a generation-oriented 3D-CLIP encoder trained with structured hard negatives that operate exclusively at the text level.\nThis design increases contrastive difficulty without any additional 3D memory cost, overcoming the small-batch constraints inherent to volumetric encoders. \nThe resulting encoder conditions a fully end-to-end latent diffusion\
    \ model that operates directly in 3D latent space, eliminating the spatial artifacts and cross-slice inconsistencies introduced by super-resolution pipelines.\nThrough systematic ablations, we establish a clear empirical link between grounding quality and downstream generative controllability. Evaluated on CT-RATE across 18 pathological conditions, our method achieves state-of-the-art performance on both image fidelity and factual correctness, while requiring less inference time and GPU memory than all competing methods. Code is at https://github.com/danielemolino/Text2CT."

- paper_id: V9FPcYmF0p
  number: 1736
  status: Accept (Poster)
  title: 'R2Fusion: Reliability-Aware Recurrent Fusion for Burst Image Super-Resolution'
  authors:
  - Nirmala Bhatt
  - Aadvik Mazumdar
  - Subrahmanyam Murala
  - Balasubramanian Raman
  abstract: Burst Image Super-Resolution reconstructs a high-resolution image by aggregating complementary sub-pixel information from multiple low-resolution burst frames. However, even after feature alignment, burst accumulation remains vulnerable to unreliable residual responses caused by imperfect correspondence estimation and RAW sensor noise, which progressively corrupt the fused representation and degrade fine structural details. To address this limitation, we propose R2Fusion, a reliability-aware corrective fusion framework that reformulates burst fusion as a confidence filtered latent state evolution problem. Instead of directly aggregating aligned burst features, each incoming burst frame predicts a corrective residual update to the current fused representation, which is selectively integrated through reliability-guided gated fusion. To jointly capture local textures and long-range structural dependencies, the proposed framework combines local convolutional refinement with selective
    low-frequency state-space interaction while directly preserving high-frequency feature components for detail reconstruction. Extensive experiments on SyntheticBurst, RealBSR-RAW, and RealBSR-RGB benchmarks demonstrate that the proposed framework consistently outperforms existing state-of-the-art methods while maintaining a compact model size of only 5.8M parameters.

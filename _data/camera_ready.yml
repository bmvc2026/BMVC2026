- paper_id: ArUrd0iYl3
  number: 1497
  status: Accept (Poster)
  title: 'LACE: Lag-1 Autocorrelation-based Channel Excitation - A Plug-and-Play Module for Corruption-Agnostic CNNs'
  authors:
  - Kushaj Mallick
  - Subham Bhat
  - Aritra Dutta
  - Aleksandr Sinitca
  - Dmitrii Kaplun
  - Ram Sarkar
  abstract: 'Channel attention modules in Convolutional Neural Networks (CNNs) reweight each channel by a scalar read off some descriptor of the activation map. The descriptors used in practice: mean, standard deviation, maximum, are all marginal statistics, which means that a coherent feature map and a noisy feature map with the same value distribution receive identical weights. Two of these statistics also collapse to learned constants under Batch Normalization (BN), leaving the gate measuring BN parameters instead of the input. Our proposed methodology LACE (Lag-1 Autocorrelation-based Channel Excitation) uses a different scalar: the lag-1 spatial Pearson autocorrelation of the channel, which is Moran''s I specialized to a regular grid. This quantity is sensitive to where activations sit on the grid and has a frequency-domain reading via the Wiener-Khinchin theorem. Crucially, it is invariant to the affine transform BN applies, exactly for the idealized ratio, and to within 10^{-3} for
    the implemented estimator on any channel carrying appreciable signal, making it to our knowledge, the first channel descriptor that survives BN by construction rather than by architectural workaround. Standard deviation and spatial coherence move in opposite directions under noise and blur, hence we combine them multiplicatively into an indicator that fires only when both are unfavorable simultaneously, and use it alongside the channel mean and variance in a per-channel linear gate. LACE is a drop-in replacement for popularly used channel attention modules in the literature such as SE, CBAM, SRM, and ECA at the same cost as global average pooling. Across three CNN backbones (ResNet-18, DenseNet-BC-100-12, MobileNetV2) on CIFAR-10, GTSRB, and MiniImageNet, all averaged over three seeds, along with ResNet-50 on ImageNet-1k, LACE improves mean-corruption accuracy without reducing clean accuracy. We encourage readers to refer to our Github Link: https://github.com/KushajM/LACE-Lag-1-Autocorrelation-based-Channel-Excitation'

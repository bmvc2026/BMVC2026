- paper_id: Hgz9XaUJjJ
  number: 259
  status: Accept (Poster)
  title: 'Unapologetically Distributed: A Call for Decentralized Document Analysis'
  authors:
  - Adri Molina Rodriguez
  - Oriol Ramos Terrades
  - Josep Llados
  abstract: 'Privacy has become an increasingly important concern in the Document Analysis community, to the extent that in many environments such as archives, governmental institutions, and local businesses, the adoption of automation is restricted by legal and policy constraints. While distributed learning has often been regarded as a ``necessary evil'''',  implying an unavoidable performance trade-off in exchange for decentralization and privacy, many prior works overlook its potential to improve robustness to out-of-distribution data. In this paper, we present Unapologetically Distributed, the first comprehensive study evaluating distributed learning in Document Analysis along three key axes simultaneously: the tasks addressed, the architectures employed, and the fine-tuning strategies applied. Specifically, we demonstrate how various distributed training approaches enhance generalization capabilities across diverse tasks such as Table Recognition, handwriting recognition, and Word Spotting,
    particularly during transfer learning stages. Our results provide strong evidence that decentralization is not merely a constraint, but a valuable opportunity to improve model robustness and adaptability in real-world Document Analysis scenarios.'

- paper_id: YSANB9qkRH
  number: 1385
  status: Accept (Oral)
  title: 'Mistaking Periodicity for Manipulation: JPEG-Induced Structural Bias in Document Tampering Detection'
  authors:
  - Nauman Riaz
  - Ali Hussain
  - Saifullah Saifullah
  - Muhammad Imran Malik
  - Dr. Stefan Agne
  - Andreas Dengel
  - Sheraz Ahmed
  abstract: |-
    Deep models for document tampering detection increasingly rely on multimodal RGB+DCT architectures, implicitly assuming that JPEG block artifact grids (BAGs) provide stable cross-forgery cues. In this paper, we show that this assumption embeds a strong inductive bias that fails under minimal, adversarially constructed perturbations. Unlike natural images, where JPEG alignment is largely stochastic, document images contain sharply bounded glyph structures, making grid-aligned manipulations trivial for an adversary.
    We formalize this phenomenon through two complementary attacks. Grid-Aligned Forgery (GAF) preserves local JPEG block statistics by aligning copy--move, splicing, or generative manipulations to the underlying $8\times 8$ grid, suppressing the inconsistencies on which current models depend. Pad--Recompress--Crop (PRC) globally shifts the JPEG grid while preserving semantic content and image geometry. Together, they probe whether detectors meaningfully fuse RGB and DCT features or instead memorize position-dependent frequency cues.
    To quantify these effects, we use two evaluation metrics, Detection Failure Rate (DFR) for missing forged regions and False Positive Area (FPA) for unintended detections, which capture failure modes not measured by prior work.
    Evaluations on the DocTamper and TSROIE benchmarks show that both attacks substantially degrade performance across a range of state-of-the-art and robustness-oriented detectors, including adversarially trained models, such as CAT-Net, DTD, FFDN, DocForgeNet, and ADCD-Net. Our findings indicate that many existing models exhibit a strong bias toward JPEG-grid statistics, highlighting the need for more robust multimodal architectures for real-world, security-critical document forensics.

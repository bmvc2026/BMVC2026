- paper_id: Tg3oAcSDrS
  number: 155
  status: Accept (Poster)
  title: 'ML-CLIPSim: Multi-Layer CLIP Similarity for Machine-Oriented Image Quality'
  authors:
  - Feng Ding
  - Haisheng Fu
  - Jie Liang
  - Qihan Xu
  - Siyu Zhu
  - Jingning Han
  abstract: "Image quality assessment has traditionally focused on signal fidelity or human perception. However, in many contemporary vision pipelines, images are ultimately consumed by downstream machine models, including classifiers, detectors, segmenters, and vision-language models. A desirable measure should therefore capture information preservation for reliable machine inference.\nThis paper studies full-reference image quality from this machine-centric perspective. We formulate machine-oriented image quality as a latent machine utility, which measures the extent to which a distorted image preserves prediction-relevant information across a population of downstream models. Since this utility cannot be directly observed, we approximate it through pairwise predictive-consistency comparisons. \nSpecifically, we construct the Predictive Consistency Dataset for Machine Perception (PCMP), where PSNR-matched distortion pairs are assigned soft preference labels from multi-model consistency\
    \ voting.\nBased on this supervision, we propose Multi-layer CLIP Similarity (ML-CLIPSim), a differentiable full-reference quality metric built upon a frozen CLIP visual encoder. \nML-CLIPSim learns lightweight aggregation over intermediate patch tokens and global embeddings.intermediate patch-token representations and global image embeddings, allowing it to capture both localized evidence degradation and high-level semantic consistency. \nExperiments on the proposed PCMP dataset, external machine-preference benchmarks, human-IQA datasets, and learned image compression tasks show that ML-CLIPSim better aligns with machine-oriented preferences than conventional fidelity and perceptual metrics, while maintaining competitive correlation with human quality judgments. \nWhen used as a distortion term for learned image compression, ML-CLIPSim further improves rate--task trade-offs across multiple downstream tasks and codec architectures."

- paper_id: wfJ94PP5Io
  number: 740
  status: Accept (Poster)
  title: 'LagrangeGS: Non-Conservative Lagrangian System on Dynamic 3D Gaussian Splatting'
  authors:
  - Shogo Sato
  - Shoichiro Takeda
  - Takuhiro Kaneko
  - Tomoyasu Shimada
  - Riku Inoue
  - Kazuhiko Murasaki
  - Ryuichi Tanida
  abstract: 'Dynamic 3D Gaussian Splatting (3DGS) achieves photorealistic reconstruction of time-varying scenes, and recent physics-aware extensions improve extrapolation performance by explicitly predicting velocity fields. However, these extensions merely fit vector fields to visual deformations without satisfying Lagrangian mechanics, leading to three major issues: (i) physically inconsistent trajectories, (ii) lack of time-reversibility, and (iii) geometric collapse during long-term extrapolation. In this paper, we propose LagrangeGS, which formulates dynamic 3DGS as a non-conservative Lagrangian system. While this Lagrangian formulation fundamentally solves (i), its direct application to dynamic 3DGS requires an intractable velocity-Hessian inversion for calculating the velocity of millions of Gaussian particles. To overcome this computational bottleneck, we approximate the velocity-Hessian as an identity matrix, decoupling the particle dynamics for computational tractability. For (ii),
    we restrict the non-conservative forces to be explicitly time independent, enabling exact time reversal. Finally, to address (iii), we introduce a local rigid alignment that regularizes particle trajectories. Extensive evaluations on dynamic 3D scene benchmarks demonstrate that LagrangeGS enables stable long-term extrapolation, exact time reversal and counterfactual physics-based editing without retraining.'

- paper_id: bL6qnsEU1z
  number: 418
  status: Accept (Poster)
  title: Geometric Orbit Representatives for Unaligned 3D Tokenization
  authors:
  - Xiang Chen
  - Jianhan Mei
  - Alexander Binder
  abstract: 'Discrete 3D tokenizers usually assume a shared frame. We study the unaligned case, where an input is observed only up to an arbitrary SO(3) rotation and tokenization must first choose a stable, decoder-compatible element of that orbit. Our Orbit-Folding framework instantiates this representative with a geometry-defined principal-axis section and deterministic axis lock, then learns a local tri-plane LFQ tokenizer and representative-frame SDF decoder. The representative rule fixes a gauge rather than discovering semantic pose; learning makes the selected frame reconstructive and exposes spatial tokens to a prior. Folding out pose redundancy also reveals a support effect hidden by nominal code usage: standard VQ can touch many entries while concentrating mass on a small entropy-equivalent support, whereas LFQ’s fixed binary hypercube preserves broad, bit-structured support. On the 55-category ShapeNet benchmark, standard VQ activates 96.3% of its codebook but retains only 4.5%
    effective support, compared with 96.2% for LFQ. No-retraining stress tests further evaluate the representative rule on 8,192 diverse Objaverse-LVIS assets and 2,882 ScanObjectNN object scans; under independent point jitter, its 95th-percentile alignment error is 14.7 and 65.2 times lower, respectively, than matched PCA without the axis lock. Finally, a masked bit-field prior reaches 97.23% bit accuracy and 78.01% token exactness at 50% masking. At 75%, relaxed LFQ states reduce decoded failure relative to the hard-index oracle (0.98% versus 1.17%/1.56%) and lower edge error compared with thresholded bits or categorical indices. These results establish a stable orbit-token interface for unaligned shapes; full distributional generation and raw-scan SDF decoding remain downstream problems.'

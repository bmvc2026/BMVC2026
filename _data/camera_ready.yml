- paper_id: gXEgz3EhzP
  number: 758
  status: Accept (Poster)
  title: 'LinearMask-GS: Stable-Mask Importance Pruning for Compact 3D Gaussian Splatting'
  authors:
  - Donghun Ryu
  - Minhyeok Lee
  abstract: '3D Gaussian Splatting (3DGS) enables real-time novel view synthesis but produces millions of primitives through adaptive densification, leading to significant storage overhead. Learned-mask pruning methods such as LP-3DGS address this by assigning each Gaussian a learnable mask to identify and prune redundant primitives. However, we identify a limitation of this paradigm: the steep slope of the Gumbel-Sigmoid activation drives mask values to the extremes within the short mask-training window, before the importance ranking has stabilized, producing a sharply bimodal distribution from which that ranking can no longer be reliably recovered. We propose LinearMask-GS, which replaces Gumbel-Sigmoid with a linear increment activation that keeps mask values in a mid-confidence regime throughout mask training, producing a stable, unimodal mask distribution whose ranking tracks importance. On Mip-NeRF 360, our method achieves 3.6× and 1.6× Gaussian reductions over 3DGS and LP-3DGS, respectively,
    while maintaining or improving rendering quality. For outdoor scenes, it yields a 1.6× reduction (from 2.18M to 1.36M) with notable gains in PSNR (+0.38 dB), SSIM (+0.025), and LPIPS (-0.029).'

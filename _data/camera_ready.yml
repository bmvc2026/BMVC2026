- paper_id: YTO4ZcoU4y
  number: 376
  status: Accept (Poster)
  title: 'TraCE: Transformer-based Forensic Cue and Evidence Modulation for Image Forgery Detection and Localization'
  authors:
  - Souad Mohaoui
  - Adnan Munir
  - Shizhen Chang
  abstract: 'Image forgery detection and localization fundamentally relies on identifying subtle forensic traces that are often weak and inconsistent across manipulation types and datasets. Prior methods typically extract forensic cues from the input image and fuse them at fixed network stages, treating them as auxiliary side information rather than active modulation signals that shape feature learning. We propose TraCE, a forensic evidence–modulated transformer that derives structural, noise, and frequency cues from intermediate feature representations, allowing cue extraction and modulation to operate in the same representational space throughout decoding. To this end, we introduce a two-stage evidence integration framework: (i) lightweight encoder cue gates that preserve low-level forensic traces during encoding, and (ii) a multi-scale decoder composed of a forensic evidence modulation (FEM) module for adaptive evidence extraction and an evidence-guided fusion (EGF) module that regulates
    encoder–decoder information flow. Extensive experiments across multiple benchmarks demonstrate consistent localization performance and competitive cross-domain generalization compared to state-of-the-art methods. The code source will be available at \url{https://github.com/smohaoui/TraCE}.'

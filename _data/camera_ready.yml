- paper_id: NEcSY60POA
  number: 962
  status: Accept (Poster)
  title: Stochastic Nonlinearities Improve Uncertainty Estimation
  authors:
  - Mohammad Sarhangzadeh
  - Amirreza M. Shebly
  - Doruk Oner
  abstract: "Reliable uncertainty estimation is important across visual recognition tasks, providing information about the confidence and reliability of model predictions.\nMany uncertainty estimation methods obtain predictive diversity through mechanisms that can suppress intermediate features, perturb the input, or require substantial additional computation. \nStochastic activation functions, where network units randomly select between multiple nonlinearities during a forward pass, have previously been used to improve optimization behavior, mitigate limitations of fixed ReLU activations, and increase output diversity. \nIn this work, we reframe stochastic activation switching as a lightweight mechanism for uncertainty estimation. \nThe proposed method samples between nonlinear activation functions, inducing predictive diversity while keeping intermediate feature pathways active. \nThis enables uncertainty estimation from a single trained model without the training cost of ensembles, task-specific\
    \ uncertainty heads, or architectural redesign.\nWe evaluate the proposed approach across classification, semantic segmentation, and out-of-distribution detection using convolutional and transformer-based architectures on diverse datasets.\nAcross these settings, stochastic activation switching improves uncertainty quality while preserving competitive primary-task performance, showing that stochastic nonlinearities provide an effective and information-preserving source of predictive variation for visual recognition."

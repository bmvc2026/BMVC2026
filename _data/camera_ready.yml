- paper_id: 9QAEMxfint
  number: 556
  status: Accept (Poster)
  title: 'OmniSurvival: Ensemble Mixture Density Learning for Oncology Survival Prediction'
  authors:
  - Vasu Soni
  - Sandeep Kumar
  - ANKIT KUMAR
  - Kaustubh Atey
  - Ardhendu Sekhar
  - Amit Sethi
  abstract: 'Accurate survival prediction from medical imaging remains an open challenge in computational oncology, particularly with limited cohort sizes and highly censored clinical data. We present OmniSurvival, a modular multimodal survival framework that combines frozen foundation-model-derived CT representations (OMNIRAD), learned gated attention pooling across axial slices, optional fusion with structured clinical variables, and a Gated Mixture of Experts (GAME) survival head for probabilistic time-to-event modelling. The framework models full censored survival-time distributions while capturing multimodal risk patterns through mixture-based expert learning. Image representations are extracted using a pretrained 2D CT foundation model and aggregated into patient-level embeddings through gated attention. These embeddings can be fused with normalized clinical representations before survival prediction. We evaluate OmniSurvival on two oncology cohorts: KiTS23 for kidney tumour CT imaging
    and HECKTOR 2026 for multimodal head-and-neck cancer imaging. Under five-fold cross-validation, OmniSurvival achieves a mean C-index of 0.805 ± 0.046 on KiTS23 and 0.670 ± 0.069 on HECKTOR 2026. The HECKTOR configuration was selected following a 46-configuration development sweep; accordingly, its cross-validated performance is interpreted as internal validation rather than an independent estimate of generalisation. Overall, the results support bounded mixture regularisation combined with frozen foundation-model representations as a practical approach to survival modelling in small oncology cohorts.'

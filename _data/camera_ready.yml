- paper_id: Qhzo9ZZx3D
  number: 1123
  status: Accept (Oral)
  title: Mutual Evidence Transport for Training-Free Few-Shot Recognition
  authors:
  - Ahmed Radwan
  - Omar Abdelaziz
  - Islam Ibrahim Osman
  - Ahmad Abdel-Qader
  - Mohamed S. Shehata
  abstract: 'Training-free few-shot recognition must compare a query image with only a handful of support examples, often under domain shift and without task-specific adaptation. Neither side provides a clean representation of the target class. Query images contain background, context, and distractor regions, while support examples can also carry class-irrelevant evidence. We propose Mutual Evidence Transport (MET), a method that treats query and support examples as contaminated empirical measures over local visual descriptors and recognizes a class by selecting a common-evidence submeasure shared between them. Rather than forcing all patches to participate in the match, MET learns a partial transport plan whose marginals select the query and support evidence that can be mutually explained under a candidate class. The resulting coupling provides both a class score and interpretable evidence maps showing which regions support the prediction. With frozen DINO ViT-S features and no support-set
    fine-tuning, MET gives the highest listed result on miniImageNet (99.29%), tieredImageNet (95.21%), EuroSAT (93.50%), CropDiseases (96.98%), MS-COCO (81.53%), CIFAR-10 (91.31%), and CIFAR-100 (94.36%). It also gives the best BSCD-FSL average (67.10%) and five-target out-of-domain average (88.32%), improving the latter over DIPA by 8.76 percentage points. On medical cross-domain targets, MET is the strongest training-free method on HEp (69.59%) and reaches 66.08% on BCCD_WBC. These gains come from a frozen-feature classifier whose transport plan exposes the local evidence behind each prediction. Code: https://github.com/AhmedMostafaSoliman/MET.'

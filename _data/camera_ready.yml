- paper_id: 9HDBO2pUpi
  number: 582
  status: Accept (Oral)
  title: Hierarchical Two-Stage Multi-Modal Alignment via Unified Latent Structured Representation
  authors:
  - Wenqi Dong
  - Hujun Bao
  - Zhaopeng Cui
  abstract: Recent advances in multi-modal representation learning have established shared semantic spaces as a key mechanism for aligning visual, textual, and 3D modalities. Existing vision-language-3D methods commonly align explicit 3D representations, such as point clouds or 3D Gaussian primitives, with image-text embedding spaces under a CLIP-style contrastive paradigm. However, these explicit representations suffer from an inherent trade-off between geometric fidelity and computational efficiency, as increasing the number of points or primitives improves structural detail but substantially raises the alignment cost. Moreover, single compact embeddings alone are often insufficient for fine-grained cross-modal matching, especially when hard negatives share similar categories, appearances, or textual descriptions. To address these limitations, we propose HieAlign, a hierarchical two-stage framework that combines Unified Latent Structured Representation for efficient holistic alignment
    with modality-anchored listwise refinement for fine-grained and discriminative vision-language-3D matching. Rather than directly aligning dense point samples or Gaussian primitives, our method uses Structured LATents as the initial 3D representation and encodes them with a 3D VAE encoder into a unified latent volume. This compact volume preserves joint geometry and appearance features in a unified structured space, serving as an efficient 3D representation for cross-modal alignment. Through Structured Shape Anchor Encoding, a transformer encoder with a learnable 3D aggregation token adaptively consolidates this latent volume into a 3D shape anchor, which is aligned with image and text embeddings through holistic cross-modal alignment. To compare fine-grained object features among visually or semantically similar candidates, we separate coarse candidate selection from discriminative refinement. Using the resulting modality anchors, the first stage, namely modality-anchored candidate selection,
    selects a compact top-$K$ set from the full candidate set according to coarse cross-modal similarities. The refinement stage then applies modality-anchored listwise refinement to model contextual relations among selected candidates and produce refined relevance scores for hard-negative discrimination. This hierarchical design supports efficient holistic alignment through the compact latent volume, concentrates structured interaction on ambiguous top-$K$ candidates, and refines their relative relevance through fine-grained contextual comparison. Extensive experiments across multiple benchmarks demonstrate strong performance across evaluation metrics and consistent improvements in fine-grained cross-modal matching among visually or semantically similar candidates.

- paper_id: GkVIVRiwkE
  number: 860
  status: Accept (Poster)
  title: A Smaller Transformer in Your Transformer
  authors:
  - Dhananjay Tomar
  - Marius Aasan
  - Andreas Kleppe
  - Adín Ramírez Rivera
  abstract: Recent findings indicate that Vision Transformers settle into locally similar computational phases, implying a level of depthwise computational redundancy. However, existing methods to exploit this redundancy either fail to reduce inference compute or severely degrade model expressivity. In this work, we formalize a unified view of block redundancy that decouples the geometry from specific surrogate interventions. We then introduce Transformer-Within-Transformer (TWT), a post-hoc method that fuses contiguous groups of redundant layers into a single learned surrogate layer. TWT reduces parameter count and inference compute while remaining competitive with original models using half the depth on natural images, and in several downstream histopathology settings, TWT matches or even improves on the original baseline.

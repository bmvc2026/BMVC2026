- paper_id: w7fFpDN7CY
  number: 371
  status: Accept (Poster)
  title: 'MoG-VLM: Efficient Video Anomaly Detection through Motion-Guided Vision-Language Models'
  authors:
  - Khaled Waleed Dawoud
  - Muhammad Zaigham Zaheer
  - Khan Muhammad
  - Muhammad Haris Khan
  abstract: 'Vision-Language Models (VLMs) have shown strong potential for video anomaly detection, but dense frame-level inference makes them impractical for real-time deployment. Existing acceleration commonly relies on uniform sampling, which ignores content dynamics and can either waste computation on static segments or miss localized anomalies. We propose a motion-adaptive anomaly detection framework that uses motion purely as a lightweight control signal to decide when VLM inference is necessary. Introducing Temporal Gradient Magnitude (TGM), we perform content-aware sampling that concentrates computation on informative regions while avoiding redundant processing. We further introduce a hierarchical dual-stream design that combines motion-adaptive frame-level analysis with anchor-triggered context-window reasoning, where dense multi-frame VLM reasoning is activated only around frames with elevated anomaly likelihood and a fusion module integrates instantaneous semantic cues with temporal
    action dynamics. Across four benchmarks, our method achieves 84.30\%, 91.91\%, 87.88\%, and 78.96\% AUC-ROC on UCF-Crime, XD-Violence, MSAD, and ShanghaiTech, respectively, establishing new state of the art on three benchmarks under the zero-shot, training-free setting. On XD-Violence, we improve over the previous best result by $+$0.57\% while delivering a 1.31$\times$ inference speedup. These results demonstrate that content-aware allocation of VLM capacity, processing fewer frames more intelligently rather than all frames uniformly, is a more effective axis of progress than uniformly densifying VLM inference across frames. Code is available on GitHub: \url{https://github.com/kdawoud91/MoG-VLM}.'

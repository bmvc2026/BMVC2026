- paper_id: I4QLbfFZbo
  number: 868
  status: Accept (Poster)
  title: 'Gating Vision–Language Graders: A Multi-Task Detector for Reliable Evaluation of Handwritten Student Work Captured In-the-Wild'
  authors:
  - Sashank Sridhar
  - Sharath Adavanne
  abstract: "Vision-language models (VLMs) are increasingly used to automatically grade handwritten student solutions in remote one-to-one tutoring, where work is captured through a laptop webcam under uncontrolled conditions. Uneven lighting, low-end cameras, bandwidth-induced compression, and images that show no notebook at all produce a non-trivial fraction of captures that no human tutor would confidently grade. On these inputs, frontier VLMs do not abstain: they return confident, frequently incorrect evaluations that propagate downstream as spurious ``learning-gap'' diagnoses for individual students. We study \\emph{gradability gating} --- deciding, before a VLM is invoked, whether a webcam-captured image is reliable enough to grade. \n\nVLM self-gating is a weak solution: across eleven prompting strategies on two frontier VLMs (Gemini 3 Flash and GPT-4o-mini), no configuration combines safety with grading correctness --- Gemini variants remain broadly unsafe, with coverage-weighted\
    \ hallucination exposure (cwHER) of $0.22$--$0.36$, while GPT-4o-mini cuts hallucination only by collapsing toward a conservative classifier that over-rejects gradable work ($0.62$ accuracy at $0.038$ cwHER). A patch-based ResNet-34 classifier ($5\\times4$ patch grid with Cutout-style cell blanking) trained directly on tutor-aligned labels reaches $89.7\\%$ accuracy, but has no explicit notion of where the notebook lies: it must infer the relevant region from classification supervision alone, over a fixed patch grid that spans desk, hands, and background alike. \n\nWe introduce UNDR (UPRIO Notebook Detection and Readability), a compact unified detector-classifier, as a deployment ready alternative: a YOLOv8s notebook detector and a gradability head share a single backbone, with one branch regressing the notebook's bounding box and the other predicting gradability. A detection-guided pooling operator (DetGuidedPool) uses per-region detector confidence to weight the classifier's spatial\
    \ pooling, so the gradability decision is read out from the localized notebook region rather than the whole frame. On a held-out test set, this single model reaches $92.1\\%$ gradability accuracy and $0.930$ Macro $F_1$, while replacing the two-stage detect-then-classify pipeline at $13.9\\times$ lower latency ($71.7$ ms vs. $996$ ms per image on CPU for the YOLOv8s$\\rightarrow$ResNet-34 cascade). On the same subset used for the VLM comparison, it reaches $0.908$ Macro $F_1$ at $0.044$ cwHER, well ahead of the safest VLM configurations on both metrics ($0.612$ Macro $F_1$ for GPT-4o-mini; $0.215$ cwHER for Gemini 3 Flash)."

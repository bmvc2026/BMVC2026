- paper_id: F8acHPAWwg
  number: 1437
  status: Accept (Poster)
  title: 'ETNA: EnTropy regularization for compressed Neural Avatar'
  authors:
  - Guillaume Loranchet
  - Joao Pedro Cova Regateiro
  - Bharath Bhushan Damodaran
  - Franck Galpin
  - Adnane Boukhayma
  - Franck Multon
  - Pierre Hellier
  abstract: The growing demand for realistic and controllable virtual humans in large-scale applications such as online multi-user environments, gaming, and shared immersive realities raises challenges for memory efficiency and bandwidth usage. While implicit neural representations (INRs) provide a powerful alternative to explicit mesh-based avatars, they often require large neural networks whose parameters are not optimized for compression, limiting scalability. We introduce an entropy regularization framework for neural implicit avatar representations that shapes the weight distribution during training, making it suitable for standard compression schemes. Our approach adds regularization losses, including a differentiable soft-entropy loss and a L1 loss between quantized and unquantized weights, enabling the network to minimize entropy while maintaining high-fidelity geometric reconstruction. Our method does not require a custom forward pass and is meant to be used jointly with post-training
    compression tools. Experiments on DFaust, including unseen identities and poses, demonstrate significant reductions in model size while preserving generative capacities and show improvements over the state-of-the-art on compression methods. Entropy regularization enables robust compression at lower bitrates without sacrificing visual fidelity and reconstruction accuracy.

- paper_id: gWiupaOFen
  number: 311
  status: Accept (Poster)
  title: 'ComplicitSplat: Downstream Models are Vulnerable to Blackbox Attacks by 3D Gaussian Splat Camouflages'
  authors:
  - Matthew Daniel Hull
  - Alex Yang
  - Pratham Mehta
  - Mansi Phute
  - Aeree Cho
  - Haoran Wang
  - Matthew Lau
  - Wenke Lee
  - Willian T. Lunardi
  - Martin Andreoni
  - Duen Horng Chau
  abstract: As 3D Gaussian Splatting (3DGS) gains rapid adoption in safety-critical tasks for efficient novel-view synthesis from static images, how might an adversary tamper images to cause harm? We introduce ComplicitSplat, the first attack that exploits standard 3DGS shading methods to create viewpoint-specific camouflage—colors and textures that change with viewing angle—to embed adversarial content in scene objects that are visible only from specific viewpoints and without requiring access to model architecture or weights. Our extensive experiments show that ComplicitSplat generalizes across real-world captures of physical objects and synthetic indoor and outdoor scenes, successfully attacking popular single-stage, multi-stage, and transformer-based detectors while largely evading recent state-of-the-art 3DGS defenses, maintaining 97.5% of its attack effectiveness against DEGauss and 93.9% of DefenseSplat. To our knowledge, this is the first black-box attack on downstream object detectors
    using 3DGS, exposing a novel safety risk for applications like autonomous navigation and other mission-critical robotic systems. To enable reproducibility of our results, we have prepared our code for immediate release and included it in the Supplementary Material.

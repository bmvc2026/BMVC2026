- paper_id: TVbWxoqcX1
  number: 1856
  status: Accept (Poster)
  title: 'Food Image Nutrition Estimation with Open-Weight Large Multimodal Models: Fine-Tuning, Multi-View Ensembles, and Retrieval Augmentation'
  authors:
  - Zhi Ye
  - Mansi Goel
  - Morten Arendt Rasmussen
  abstract: 'Estimating nutrients from food images is a challenging task for automated dietary assessment. We present a comprehensive study of open-weight Large Multimodal Models (LMMs) for food image nutrition estimation, spanning zero-shot benchmarks, supervised fine-tuning (SFT), and retrieval-augmented generation (RAG). Using Gemma3-4B/12B and Qwen3-VL-4B/8B on two datasets, we evaluate multiple configurations with a hierarchical diagnostic of knowledge, identification, and portion estimation. Our study has three key findings: \textbf{(1) Multi-view SFT can substitute for model scaling}: a 4B model trained on multi-camera images with view-ensemble averaging achieves 23.90\% mean wMAPE, surpassing the 8B single-camera model (25.95\%). \textbf{(2) SFT substantially improves model performance}: SFT reduces the mean wMAPE more than using auxiliary information, indicating robust SFT surpasses text-aided reasoning. \textbf{(3) RAG with nutrition databases is counterproductive after SFT}: augmenting
    SFT predictions with FNDDS degrades performance across RAG modes, with the code-selection method raising wMAPE from 23.90\% to 59.90\%. The main error source is nutrient-density mismatch rather than portion allocation: fixing allocation through a discrete portion formulation leaves overall error unchanged.'

- paper_id: Uph4AwICHk
  number: 1445
  status: Accept (Poster)
  title: Gated Tabular-Conditioned Attention for Robust Multimodal Radiogenomic Glioblastoma Outcome Prediction
  authors:
  - Amitesh Sahoo
  - Qing Tian
  abstract: 'Accurate prediction of clinical outcomes in glioblastoma is critical for prognosis assessment and treatment planning. Although MRI plays a central role, imaging alone is often insufficient, and existing multimodal approaches frequently struggle to effectively exploit complementary information across modalities, particularly in small-cohort settings where structured clinical and molecular fields are often incompletely recorded. We study multimodal 12-month outcome prediction by jointly modeling structural MRI with clinical, molecular, and radiomic information. We propose the Gated Tabular-Conditioned Attention Network (GTCA-Net), a lightweight multimodal fusion framework in which the query that attends over a compact set of MRI tokens is formed as a per-patient gated combination of a tabular-derived query and a free, learnable query token. The free token is a learned, population-level prior over what to read from MRI: it broadens the queryable subspace beyond directions expressible
    by the tabular features. The gate, predicted from the tabular representation, weights the two queries per patient, so a single attention pass, without deep transformer stacks or excessive model capacity, yields an MRI readout that blends patient-specific tabular conditioning with this complementary learned prior. Across UPenn GBM and UCSF-PDGM, evaluated over 15 random seeds, GTCA-Net attains the highest mean Accuracy, AUROC, and F1-score among the compared fusion methods, with average improvements of 4.8 points in Accuracy and 5.4 points in AUROC over the strongest competing baseline, under matched encoders and training setups. GTCA-Net also retains its advantage as training data shrink, and degrades gracefully under evaluation-time masking of tabular fields, losing under two AUROC points when over half of the structured input is missing. These results suggest that complementing patient-specific tabular conditioning with a gated, learned query provides a data-efficient and missingness-robust
    mechanism for multimodal medical outcome prediction under limited data.'

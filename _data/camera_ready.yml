- paper_id: kl1hkKpVoX
  number: 43
  status: Accept (Poster)
  title: Recognising BSL Fingerspelling in Continuous Signing Sequences
  authors:
  - Alyssa Chan
  - Taein Kwon
  - Andrew Zisserman
  abstract: Fingerspelling is a critical component of British Sign Language (BSL), used to spell proper names, technical terms, and words that lack established lexical signs. Fingerspelling recognition is challenging due to the rapid pace of signing and common letter omissions by native signers, while existing BSL fingerspelling datasets are either small in scale or temporally and letter-wise inaccurate. In this work, we introduce a new large-scale BSL fingerspelling dataset, FS23K, containing 23K words and their intervals with letter-level annotations. The dataset is constructed automatically using a semi-supervised iterative annotation framework. In addition, we propose a fingerspelling recognition model that explicitly accounts for bi-manual interactions and mouthing cues. As a result, with refined annotations, our approach halves the character error rate (CER) on the CSLR dataset compared to the prior state of the art on fingerspelling recognition. These findings demonstrate the effectiveness
    of our method and highlight its potential to support future research in sign language understanding and scalable, automated annotation pipelines. The project page can be found at https://taeinkwon.com/projects/fs23k.

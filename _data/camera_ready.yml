- paper_id: lhNoTwRZCT
  number: 1397
  status: Accept (Poster)
  title: 'Beyond Pseudo-Masks: Semantic Disentanglement for Weakly Supervised Car Damage Segmentation'
  authors:
  - Bruno Silva
  - Jorge Batista
  abstract: Assessing vehicle damage in unconstrained environments is a fundamental challenge in fine-grained computer vision. While fully supervised segmentation successfully distinguishes complex damage morphologies, its reliance on pixel-level annotations severely limits scalability. Existing Weakly Supervised Learning (WSL) approaches bypass dense annotations but remain bottlenecked by their reliance on noisy intermediate pseudo-masks. Conversely, adapting pretrained vision-language models for this task often fails because global pretraining biases entangle localized fine-grained damage with overarching scene structure. To address these limitations, we propose a pseudo-mask-free, prompt-driven framework for weakly supervised vehicle damage segmentation. At its core is Semantic Car Damage Disentanglement (SCDD), a contrastive learning objective that explicitly decouples damage-specific semantics from normal object appearance. By applying weak supervision to contrast pristine and damaged
    image-caption pairs, SCDD realigns the vision-language space to localize meaningful fine-grained deviations rather than dominant object geometries. Leveraging this disentangled representation, we extract high-fidelity dense segmentation masks directly through context-aware text prompting, eliminating the need for pseudo-mask generation. Experiments on the CarDD and VehiDE benchmarks demonstrate that our method recovers precise spatial semantics without dense supervision, establishing that explicit semantic disentanglement enables accurate, prompt-driven localization from image-level labels alone.

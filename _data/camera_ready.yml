- paper_id: PJUq921gQM
  number: 1156
  status: Accept (Poster)
  title: Spherocylinder Pose from Silhouette
  authors:
  - Erol Ozgur
  - Mohammad Alkhatib
  - Youcef Mezouar
  - Emmanuel Buc
  - Bertrand Le Roy
  - Adrien Bartoli
  abstract: "A spherocylinder is a cylinder capped at one end by a hemisphere of equal radius.\nWe present $\\texttt{ScyPoSe}$ ($\\texttt{S}$phero$\\texttt{cy}$linder $\\texttt{Po}$se from $\\texttt{S}$ilhouett$\\texttt{e}$), a theory and method for estimating the spherocylinder $5$-DoF pose from its silhouette in a single 2D image. \n$\\texttt{ScyPoSe}$ exploits the geometric property that the spherically-normalised silhouette of a spherocylinder is formed of circular arcs on the camera-centred unit sphere: two great-circle arcs from the cylinder  and a single small-circle arc from the hemisphere. This structure reduces pose estimation to a sequence of constrained plane fitting problems, admitting simple, fast, and convex solutions for both the minimal $5$-point and redundant $n>5$ point cases. We further introduce $\\texttt{Robust-ScyPoSe}$, a RANSAC-based extension that jointly estimates pose, classifies silhouette points, and rejects erroneous ones. Experiments on synthetic and real\
    \ data demonstrate that $\\texttt{Robust-ScyPoSe}$ pushes the state of the art forward in accuracy and robustness."

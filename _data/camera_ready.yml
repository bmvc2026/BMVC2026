- paper_id: VPSXF8eygp
  number: 1028
  status: Accept (Poster)
  title: Compositional Concept Erasure in Text-to-Image Diffusion Models via Hierarchically Grounded Semantic Surgery
  authors:
  - Chen Dai
  - Ganyu Zou
  - Nathan Self
  - Chang-Tien Lu
  - Naren Ramakrishnan
  abstract: Removing copyrighted, unsafe, or user-specified concepts from a deployed text-to-image diffusion model is now a practical requirement. Weight-editing methods can suppress fixed targets, but they require per-target retraining and modify the model checkpoint. Training-free methods, on the other hand, are deployment-friendly, but they suffer from text-side routing failures on compositional prompts. In such prompts, the erase target may be invoked through a related class rather than its lexical name, and its modifiers may migrate onto preserved objects. This paper proposes Hierarchically Grounded Semantic Surgery (HGSS), a training-free framework for compositional concept erasure. The framework lifts both the routing signal and the edit operator used by text-side erasure. First, hierarchical span grounding resolves erase-target spans through lexical, taxonomic, and semantic evidence, while guarding against broad-hypernym and compound-head false positives. Second, dynamic attribute
    binding refines the text conditioning during early denoising via a counterfactual reference and a preserve-aware cross-attention objective, keeping surviving attribute–noun bindings intact. HGSS selectively removes the erase target without updating model weights or adding learned parameters. On SEE, HGSS cuts hierarchical evasion from $29.54$ to $10.02$ and roughly halves pairwise attribute leakage, achieving the best Neighbor $E$ and Attr$P$ scores among the reported methods. On UnlearnCanvas, HGSS slightly improves the six-metric average over the matched SS baseline, reaching state-of-the-art.

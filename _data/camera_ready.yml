- paper_id: WVgw3IcrAs
  number: 1775
  status: Accept (Poster)
  title: Spectral Mutual Inhibition Guided Coupled Tensor Dictionary Learning for CT–MRI Image Fusion
  authors:
  - Prankshu
  - Sayan Shaw
  - SnehaSingh
  abstract: Multimodal medical image fusion combines complementary information from different imaging modalities to support clinical interpretation and diagnosis. In CT–MRI fusion, CT captures dense anatomical structures and bone boundaries, while MRI provides high soft-tissue contrast and detailed lesion information. Existing fusion methods, including multi-scale transforms and deep learning approaches, often face challenges in preserving structural details while maintaining complementary modality-specific information. Dictionary learning methods improve representation quality but may suffer from cross-modal feature imbalance and redundant shared representations. To address these limitations, we propose a multimodal image fusion framework based on coupled tensor dictionary learning and frequency-domain residual decoupling. The proposed method first learns shared structural representations through coupled tensor sparse coding and a multiplicative support-consensus mechanism that promotes
    features activated consistently across both modalities. Residual modality-specific components are then separated in the frequency domain using a spectral mutual inhibition strategy that suppresses shared spectral overlap and preserves complementary information. The framework combines spatial tensor representations with patch-wise spectral decoupling to reduce redundancy while maintaining anatomical structures and texture details. Experiments on the SynthRAD2023 and Harvard Whole Brain Atlas datasets demonstrate that the proposed method preserves tissue contrast, structural boundaries, and complementary features, achieving the highest Average Gradient (7.70), Spatial Frequency (33.32), and competitive Entropy (4.24) on SynthRAD2023, alongside top Spatial Frequency (33.04) on the Harvard dataset, confirming competitive fusion performance across diverse CT–MRI image pairs.

- paper_id: hrx6UYp5gJ
  number: 327
  status: Accept (Poster)
  title: Ray-Space Self-Supervised Adaptation for Ray-Based 3D Geometry Models
  authors:
  - Fanqi Xu
  - Yasin Almalioglu
  - Niki Trigoni
  abstract: 'Recent ray-based geometry foundation models represent camera motion and scene structure as dense, per-pixel ray segments rather than as separate 6-DoF pose and depth predictions. This representation is expressive, but adapting such models to new domains with self-supervision remains underexplored. A straightforward solution converts predicted ray bundles into poses and depth maps and then applies conventional photometric supervision, but this projection compresses dense ray geometry into low-dimensional camera parameters and weakens the supervision signal. We introduce ray-space self-supervised fine-tuning, a framework that adapts ray-based geometry models directly in their native prediction space. Our approach treats ray origins and endpoints as first-class optimization variables and combines three complementary constraints: ray photometric consistency for cross-view appearance alignment, ray-flow geometric consistency for motion-field regularization, and ray semantic consistency
    for view-invariant feature alignment. This design preserves the dense geometric structure of ray bundles while avoiding a pose–depth bottleneck during training; standard pose and depth outputs are recovered only for evaluation. Experiments on KITTI and Oxford RobotCar show that ray-space fine-tuning consistently improves both visual odometry and monocular depth estimation over pose–depth fine-tuning baselines. These results indicate that self-supervision in ray space is an effective adaptation strategy for ray-based 3D geometry foundation models.'

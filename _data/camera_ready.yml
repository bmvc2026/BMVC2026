- paper_id: amej993g5o
  number: 431
  status: Accept (Poster)
  title: 'PoseDreamer: Scalable and Photorealistic Human Data Generation Pipeline with Diffusion Models'
  authors:
  - Lorenza Prospero
  - Orest Kupyn
  - Ostap Viniavskyi
  - Joao F. Henriques
  - Christian Rupprecht
  abstract: |-
    Acquiring labeled datasets for 3D human mesh estimation is challenging due to depth ambiguities and the difficulty of annotating 3D geometry from monocular images. Existing datasets are either real, with manually annotated 3D geometry and limited scale, or synthetic, rendered from 3D engines that provide precise labels but suffer from limited photorealism, low diversity, and high production costs.
    In this work, we explore a third path: generated data. We introduce PoseDreamer, a pipeline that leverages diffusion models to generate large-scale synthetic datasets with 3D mesh annotations. Our approach combines controllable image generation with Direct Preference Optimization for control alignment, curriculum-based hard sample mining, and multi-stage quality filtering. Together, these components maintain correspondence between 3D labels and generated images while prioritizing challenging samples to maximize dataset utility.
    Using PoseDreamer, we generate more than 500,000 high-quality samples, achieving a 76\% improvement in image-quality metrics over rendering-based datasets. We find that diffusion-generated and rendered synthetic data are complementary rather than competing: generated data, with its photorealism and in-the-wild variability, benefits performance on in-the-wild scenarios, while rendered data retains an advantage on metrics emphasizing 3D-geometric precision. Combining the two yields the best overall results, and we show this complementarity holds across HMR architectures and training objectives.

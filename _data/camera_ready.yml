- paper_id: kOxg1QrKhw
  number: 945
  status: Accept (Poster)
  title: 'MoE-AdURA-Net: An Uncertainty-Routed Mixture-of-Experts for Selective Multi-label Chest X-ray Classification'
  authors:
  - Antik Aich Roy
  - Ujjwal Bhattacharya
  abstract: Uncertainty is inherent in chest X-ray interpretation due to ambiguous and overlapping pathological patterns. A confident diagnosis often requires dynamic visual reassessment across fine-grained and global perspectives, and may demand additional diagnostic evidence. Traditional deep learning models are typically trained under a closed-set assumption, expecting test samples to match patterns observed during training, with fixed receptive fields offering no mechanism to revisit uncertain findings across different contextual perspectives. In the real world, distribution shifts, unseen pathologies, and out-of-distribution (OOD) samples frequently violate this assumption, resulting in unreliable predictions. We propose Mixture-of-Experts Adaptive Uncertainty-Routed Attention Network (MoE-AdURA-Net), an uncertainty-aware framework for reliable multi-label chest X-ray classification with calibrated abstention. Our method introduces an Uncertainty-Conditioned Multi-Scale Expert Block
    (UMEB) that adaptively separates overlapping pathological features by routing intermediate feature representations through local, contextual, and global expert branches. An Uncertainty-Guided Attention Router (UGA-Router) uses an early uncertainty probe to estimate intermediate uncertainty, amplify ambiguous features, and dynamically weight expert contributions. A dual-head objective jointly optimises discriminative classification and Dirichlet evidential uncertainty, enabling principled selective prediction in a single deterministic forward pass while maintaining a low memory footprint. MoE-AdURA-Net outperforms all the evaluated baselines on the official CheXpert benchmark, attaining the best mean AUC of 0.90 and the best calibration, while requiring 4.85× fewer FLOPs than Deep Ensembles (M=5). It transfers zero-shot to MIMIC-CXR, achieving a mean AUC of 0.884 and strong OOD detection across four distribution shifts.

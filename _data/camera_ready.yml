- paper_id: mQJGPrCj7J
  number: 423
  status: Accept (Poster)
  title: Diversifying Long Prompt Image Generation through Structured Prompt Embedding Space Sampling
  authors:
  - Bo-Kai Ruan
  - Teng-Fang Hsiao
  - Ling Lo
  - Yi-Lun Wu
  - Hong-Han Shuai
  abstract: Modern text-to-image models produce impressive visual results from richly specified prompts, yet their behavior under long-form remains insufficiently understood. In this paper, we study a practical failure mode in which accumulated semantic constraints progressively suppress output variation, causing diversity to collapse even when many visual factors remain unspecified. We show that this phenomenon appears consistently across recent generation models as prompt length increases, and provide a theoretical motivation that connects long-prompt conditioning with reduced sampling entropy in the prompt embedding space. Based on this observation, we introduce PromptMoG, a training-free approach that samples prompt embeddings from a Mixture-of-Gaussians distribution to restore generative flexibility while maintaining semantic fidelity. To support systematic evaluation, we further present LPD-Bench, a structured benchmark of long and semantically dense prompts for measuring both fidelity
    and diversity under compositional text conditioning. Extensive experiments on four large-scale diffusion models, including SD3.5-Large, Flux.1-Krea-Dev, CogView4, and Qwen-Image, show that PromptMoG consistently improves diversity for long-prompt image generation.

- paper_id: xwmrzPdHcb
  number: 264
  status: Accept (Poster)
  title: Essential Components in Stereo Video Stabilization
  authors:
  - Junpeng Jing
  - Weixun Luo
  - Ye Mao
  - Krystian Mikolajczyk
  abstract: Image stereo matching achieves high accuracy when trained on large-scale data but often produces temporally inconsistent disparities across videos due to its frame-by-frame processing nature. In contrast, video frameworks offer better temporal consistency but generally achieve lower accuracy, largely due to the limited scale of available video data for training. In this work, we explore Stereo Video Stabilization (SVS), which harnesses the complementary strengths of both image and video focused methods. Given the broad and underexplored design choices of SVS, we investigate its essential components and examine their roles from a minimalist perspective. By using established stereo modules with minimal modifications, we propose a compact and effective baseline stabilizer, BasicSVS, that leads to substantial gains in temporal consistency. Through systematic analysis, we explain the underlying factors of these improvements and discuss potential limitations. Experiments on standard
    benchmarks show that BasicSVS improves temporal consistency by over 30\% while maintaining accuracy, with less than 10\% additional computational overhead. Code and model will be released publicly.

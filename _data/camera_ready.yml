- paper_id: xsSfN06aBC
  number: 1296
  status: Accept (Poster)
  title: 'LiteUAV-DETR: Scale-Aware Feature Routing for Real-Time UAV Detection'
  authors:
  - Mingze Sun
  - Zhuoyu Wu
  - Tan Pei Sze
  - Jit Yan Lim
  - Raphaël C-W Phan
  - Shu-Min Leong
  abstract: The goal of real-time UAV image detection is to localize objects in each aerial image while satisfying the response-time requirement of online UAV perception. Despite their strong accuracy in UAV image detection, DETR-based detectors are often evaluated using model complexity, high-end GPU latency, or large-batch throughput, which may not reflect the batch-size-one frame-wise inference encountered in practical UAV scenarios. We therefore re-examine DETR-based UAV detection under batch-size-one inference and propose LiteUAV-DETR, a lightweight DETR-style UAV detector with a scale-aware feature routing encoder that reduces costly multi-scale interaction while preserving the scale-sensitive cues required for small objects in UAV imagery. Extensive experiments on VisDrone and UAVDT show that our method provides two favorable accuracy--latency operating points for real-time UAV detection. On VisDrone, the high-accuracy variant achieves 32.5 AP and runs over 2$\times$ faster than the
    state-of-the-art DOME-DETR-S model under the same batch-size-one protocol. The compact variant further reduces the parameter count to only 3.8M while reaching 28.2 AP, providing a low-latency operating point with competitive accuracy. Additional evaluation on eight UAV-related datasets with overlapping categories, including TinyPerson and DroneVehicle, shows that both variants maintain robust cross-dataset performance without fine-tuning. The code is publicly available at https://github.com/KyoukoChan-SSS/LiteUAV-DETR.

  number: 939
  status: Accept (Oral)
  title: Dense Indoor 3D Scene Recovery from Radar via Geometric Prior Distillation
  authors:
  - Samah Hussein
  - Haitham Al Hassanieh
  abstract: "Dense 3D scene understanding has long relied on LiDAR and RGB cameras, sensors that raise privacy concerns and fail under poor visibility conditions such as smoke, fog, or darkness. Millimeter wave radar offers a robust, privacy-preserving alternative, but translating its sparse and noisy point clouds into dense scene geometry is severely underconstrained: radar observations are corrupted by multipath reflections and specularity effects, and the same returns are consistent with many possible scene geometries.\nWe propose PRISM (Prior-guided Radar Indoor Scene Mapping), a framework that extends the application of mmWave radar to dense indoor 3D scene recovery. \nThe core challenge is that this mapping requires simultaneously acquiring the geometric structure of indoor environments and interpreting sparse and noisy radar returns. We address this by decoupling the two: a generative decoder is first trained on LiDAR data to internalize the geometric structure of indoor scenes and\
    \ then frozen while a radar encoder is trained to activate it. Reconstruction and distillation objectives guide the radar encoder to produce latent representations compatible with the frozen decoder's geometric prior, bridging the modality gap without requiring LiDAR at inference.\nOn real test scenes from unseen buildings, our approach achieves a 31\\% improvement in Chamfer Distance and a 26\\% improvement in F-score at 0.6 m over the best adapted prior radar method, while requiring approximately $3\\times$ less training data than end-to-end alternatives."

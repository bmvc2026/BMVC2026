- paper_id: ieeIxCrtNt
  number: 471
  status: Accept (Poster)
  title: 'TSkel-Mamba: Temporal Dynamic Modeling via State Space Model for Human Skeleton-based Action Recognition'
  authors:
  - Yanan Liu
  - Jun Liu
  - Hao Zhang
  - Kangjian He
  - Dan Xu
  - Hossein Rahmani
  - Mohammed Bennamoun
  - Qiuhong Ke
  abstract: Skeleton-based action recognition has garnered significant attention in the computer vision community. Building on the recent success of the selective state-space model (SSM) Mamba in handling 1D temporal sequences, we present TSkel-Mamba—a hybrid Transformer-Mamba architecture designed to effectively capture both spatial and temporal dynamics in skeletal data. Our framework employs a Spatial Transformer to extract rich spatial features and leverages Mamba for temporal modeling. However, Mamba processes each channel independently through separate SSM blocks, which limits its capacity to learn inter-channel dependencies—an essential aspect for understanding complex human motions. To address this limitation and better tailor Mamba to skeleton-based tasks, we introduce a Temporal Dynamic Modeling (TDM) block. This plug-and-play module incorporates a novel Multi-scale Temporal Interaction (MTI) mechanism, which uses multi-scale Cycle operators to model cross-channel temporal interactions—crucial
    for recognizing nuanced human actions. Extensive experiments on NTU-RGB+D 60, NTU-RGB+D 120, and NW-UCLA datasets demonstrate that TSkel-Mamba achieves state-of-the-art performance while maintaining low inference time, offering a compelling balance between accuracy and efficiency. Code will be available at https://github.com/ryannus2025-ai/TSkel-Mamba

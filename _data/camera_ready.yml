- paper_id: 6HvnhhTPbB
  number: 1279
  status: Accept (Poster)
  title: 'Paraphrase Robustness in Fine-Grained CLIP: A Joint Visual–Lexical Failure Mode on Cluster-Member Classes and a Cluster-Aware Soft-Prompt Recovery'
  authors:
  - RICHARD ADUSEI
  - KWABENA OWUSU-AGYEMANG
  - Linda Amoako Banning
  - Brigid Addai-Mmra
  - Emmanuel Ahene
  abstract: Fine-grained CLIP recognition collapses under paraphrase on a structured slice of classes. These are classes whose images are visually near-identical to their cluster mates, and whose canonical names share a token naming a common parent label. On FGVC-Aircraft, the centroids of image features within a cluster sit at cosine $+0.97$, while substitute-robust top-1 accuracy on cluster-member classes drops by $19$ percentage points (pp) against zero-shot under CoOp tuning. We characterise this joint visual and lexical failure mode through a per-class metric of substitute-robust top-1 accuracy, paired with a per-class bank of substitutes drawn from programmatic edits, common-name aliases, and trait-description paraphrases. A simple diagnostic labels each dataset's regime in advance, namely the sign of CoOp's change in substitute-robust top-1 accuracy on cluster-member classes, relative to zero-shot. The label matches $CASPT$'s outcome on each of the three benchmarks we test (FGVC-Aircraft,
    CUB-200, Stanford Cars). As a targeted recovery for the in-regime case, we propose $CASPT$, a modification of CoOp's prompt learner. $CASPT$ replaces a single global context with one learnable context per lexical cluster and one shared context across singletons. $CASPT$ delivers $+9.8$ pp over CoOp on FGVC-Aircraft substitute-robust top-1 accuracy for cluster-member classes ($K{=}16$, three-seed $95\%$ CI $[+7.1, +12.7]$), and the gain replicates at OpenCLIP ViT-L/14. The diagnostic and the characterisation of the failure mode are the central contributions, with $CASPT$ as a worked recovery in the regime the diagnostic identifies.

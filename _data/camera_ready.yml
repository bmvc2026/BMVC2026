- paper_id: FJfFLvPU4e
  number: 1632
  status: Accept (Poster)
  title: 'OCCAM: Class-Agnostic, Training-Free, Prior-Free and Multi-Class Object Counting'
  authors:
  - Michail Spanakis
  - Iason Oikonomidis
  - Antonis Argyros
  abstract: 'Class-Agnostic object Counting (CAC) involves counting instances of objects from arbitrary classes within an image. Due to its practical importance, CAC has received increasing attention in recent years. Most existing methods assume a single object class per image, rely on extensive training of large deep learning models, and address the problem by incorporating additional information, such as visual exemplars or text prompts. In this paper, we present OCCAM, the first training-free approach to CAC that operates without the need for any supplementary information and addresses the multi-class variant of the problem. Our approach is capable of counting the object instances in each and every class among arbitrary object classes within an image. We leverage Segment Anything Model~2 (SAM2), a foundation model, and a custom threshold-based variant of the First Integer Neighbor Clustering Hierarchy (FINCH) algorithm to achieve competitive performance on widely used benchmark datasets,
    including FSC-147 and CARPK, while making fewer assumptions. We also propose a synthetic multi-class dataset and the F1 score as a more suitable evaluation metric. The code for our method and the proposed synthetic dataset are available at: https://mikespanak.github.io/OCCAM_counter.'

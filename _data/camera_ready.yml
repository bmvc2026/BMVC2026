- paper_id: BARxWpKjjJ
  number: 565
  status: Accept (Poster)
  title: Adapting Foundational Image Models to Video Action Recognition Model via Learnable Context Tokens
  authors:
  - Chen-Kai Chang
  - Wei-Chen Chiu
  abstract: 'We address the challenge of adapting foundational image models to video tasks, which requires bridging the gap between static spatial semantics and dynamic temporal evolution. To this end, we propose a novel framework, DINO-Temporal Context (DINO-TC), that augments frozen image encoders with learnable ``context tokens'''' and lightweight temporal modeling layers. Unlike existing adapters that entangle spatial and temporal features, our context tokens decouple these dimensions, effectively aggregating temporal information while preserving the fine-grained spatial interpretability of the original image backbone. Furthermore, we maintain strict inference efficiency by employing mergeable linear adapters as a parameter-efficient fine-tuning strategy. Extensive experiments on Something-Something V2, Diving48, and FineGym demonstrate that our method achieves competitive performance among parameter-efficient transfer learning approaches. Notably, DINO-TC exhibits strong temporal generalization,
    seamlessly handling variable video lengths unseen during training without performance degradation. Finally, our method offers superior model transparency: we demonstrate that our context tokens yield attention maps robust enough to guide off-the-shelf video object segmentation models (e.g., SAM2) in generating high-quality segmentation masks without explicit dense supervision.'

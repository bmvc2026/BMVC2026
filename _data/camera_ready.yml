- paper_id: 9SoX4WySuK
  number: 1843
  status: Accept (Poster)
  title: 'Advancing Trademark Image Retrieval: A Real-World Benchmark and Foundation Model Adaptation'
  authors:
  - Eyup Halit Yilmaz
  - Furkan Coşkun
  abstract: 'The trademark registration process relies heavily on accurate similarity assessments against existing trademarks, which demands robust feature representations and nuanced domain understanding. While general-purpose vision encoders provide a strong baseline, their embedding spaces can be adapted to better capture the two dimensional figurative and compositional elements unique to trademark logos. We introduce TURPAT-Logo-3K, a novel benchmark dataset comprising 3,074 manually curated query-similar-dissimilar triplets derived from official decisions for real-world trademark infringement filings. To rigorously evaluate embedding quality, we define novel triplet-aware performance metrics: Pairwise Similarity Ratio (PSR), Temperature-Scaled Triplet Confidence (TSTC), and Triplet Silhouette Score (TSS). For optimal domain adaptation, we train TM-DINOv3, obtained through large-scale training on a meticulously pre-processed dataset of over 3 million figure-only and mixed-modality logos.
    Experiments demonstrate that TM-DINOv3 consistently outperforms state-of-the-art vision encoders (IJEPA, SigLIP2, DINOv2, and DINOv3). On TURPAT-Logo-3K, TM-DINOv3 achieves a PSR score of 5.94, a TSTC value of 92.83\%, and a TSS value of 50.85\%. Furthermore, TM-DINOv3 exhibits superior generalization on the widely studied METU\_v2 benchmark, improving the Normalized Average Rank (NAR) to 1.04\% and Hit@1 to 48.72\%, outperforming its base DINOv3-ViT-H model. By publicly releasing TURPAT-Logo-3K, we provide a rigorous novel testing ground to foster future benchmarking and research in AI-driven intellectual property protection. TURPAT-Logo-3K is available at https://huggingface.co/datasets/BILGEM-AI/TURPAT-Logo-3K'

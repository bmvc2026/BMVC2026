- paper_id: MSsX5UirST
  number: 1786
  status: Accept (Poster)
  title: 'Repurposing Motion Priors: VFI-Guided Task-Agnostic Temporal Consistency Correction'
  authors:
  - Muhammad Kashif Ali
  - Eun Woo Im
  - Dongjin Kim
  - Tae Hyun Kim
  - Bernhard Egger
  abstract: Frame-wise image processing of videos often introduces severe temporal flicker due to the absence of explicit temporal constraints. Existing temporal consistency correction methods either require clean unprocessed videos at test time or attempt to recover consistent motion cues from corrupted frames using over-parameterized models or expensive optimization, limiting their practicality and generalization. We move beyond this implicit motion modeling paradigm by repurposing off-the-shelf Video Frame Interpolation (VFI) models, which encode natural motion priors learned from large-scale video data and are explicitly trained to handle complex motion and occlusions. We introduce a dual-role VFI guidance mechanism in which interpolated frames serve both as explicit motion-consistent visual guides for restoration and as spatiotemporal supervisory anchors through a novel temporal perceptual loss that facilitates temporal smoothness and perceptual fidelity across broader video restoration
    and synthesis pipelines. Using these pretrained motion priors, we address temporal consistency correction using a task-focused network that does not require raw videos at test time and avoids scene-specific optimization. Extensive experiments across diverse applications demonstrate strong temporal consistency correction and perceptual fidelity on standard benchmarks.

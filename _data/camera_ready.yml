- paper_id: EZAFfj9i8d
  number: 481
  status: Accept (Poster)
  title: 'From Words to Wavelengths: VLMs for Few-Shot Multispectral Object Detection'
  authors:
  - Manuel Nkegoum
  - Minh-Tan Pham
  - Bruno Avignon
  - Elisa Fromont
  - Sébastien Lefèvre
  abstract: "Multispectral object detection is essential for safety-critical systems but remains challenging due to the scarcity of annotated RGB-IR training pairs. While existing methods invest in increasingly sophisticated cross-modal fusion modules, the \nfew-shot multispectral setting remains largely underexplored. We investigate Vision-Language Models (VLMs) for few-shot multispectral object detection (FSMOD) and argue that the shared textual supervision implicitly aligns RGB and IR representations under unified category semantics, reducing the need for complex fusion design. We adapt two state-of-the-art VLM-based detectors to multispectral inputs and show that (i) simple fusion mechanisms can match or outperform complex cross-modal fusion strategies when built upon strong VLM \nrepresentations, and (ii) VLMs trained solely on RGB data can generalize effectively to unseen thermal modalities without backbone adaptation. Experiments on FLIR, M3FD, and DroneVehicle show improvements of\
    \ up to 30~mAP@50 over existing methods. All codes and original data splits can be found at https://github.com/Manuelnkegoum-8/MSVLM"

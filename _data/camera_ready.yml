- paper_id: 6J351phD4V
  number: 247
  status: Accept (Poster)
  title: 'Vision Model Inference on Mobile Devices: A Large-Scale Delegate-Aware Benchmark Beyond FLOPs'
  authors:
  - Saif U Din
  - Faraz Kayani
  - Radu Timofte
  - Dmitry Ignatov
  abstract: 'Efficient vision research commonly relies on FLOPs as a proxy for deployment efficiency, assuming a stable compute-bound relationship between architectural complexity and inference latency. However, modern inference systems execute neural networks across heterogeneous hardware backends whose behaviour differs substantially across operators and devices, making FLOPs-based optimisation objectives unreliable predictors of real deployment performance when latencies are pooled without regard to delegate assignment. We address this gap with a delegate-aware empirical benchmark of 586 vision network topologies on five Android SoCs spanning three SoC vendors, measuring forced CPU, GPU, and NPU latencies separately and in a best-of-delegate primary metric. Best-of-delegate primary fp32 latency can invert FLOPs–latency slopes (Kirin 710: ˆβF = −0.21 ; int8 n.s.), illustrating backend mixing as a confound in efficient vision benchmarking.CPU fp32 execution is predominantly memory-bandwidth-bound
    (FLOPs explain at most 8% of variance), whereas fixed GPU/NPU paths are compute-bound (R2 up to 35% for int8); mixing backends in primary-latency regressions leaves fp32 at most 6% (cross-device pooling R2 ≈ 0.035; int8 primary 15– 20%; I2 = 83%) and can invert regression coefficients entirely. Conditioning on the selected backend increases predictive power by up to 5×. Across more than 5 800 inference runs, CIFAR-10 top-1 int8 PTQ pre-serves in zoo accuracy rankings (a controlled ranking proxy, not cross-dataset SOTA; r =0.963 [0.957 , 0.969 ], n=577; host-side evaluation), stable across device-valid subsets (r ∈ [0.953, 0.963]), while int8 primary latency rankings transfer robustly across SoC classes (ρ = 0.85) despite large absolute differences. Pearson and Spearman correlations yield qualitatively different conclusions under backend mixing, demonstrating that single-metric reporting is insufficient for efficient vision evaluation. These findings motivate backend-aware architecture
    evaluation, a Rank-then-Verify deployment protocol, and dual Pearson/Spearman reporting standards for future efficient vision research.'

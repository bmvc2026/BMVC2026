- paper_id: ga3aBAnuEm
  number: 424
  status: Accept (Poster)
  title: Unified Detection of Adversarial Images Across Diverse Vision Tasks
  authors:
  - Yunqi Xue
  - Guorui Chen
  - Wenqian Yu
  - Zhijiang Li
  - Yao Qin
  - Philip Torr
  - Jindong Gu
  abstract: 'Deep neural network-based visual models have demonstrated outstanding performance, yet they remain susceptible to adversarial attacks that pose security risks in computer vision applications. Existing adversarial image detection methods are often task-specific, which poses challenges in real-world applications where a single image may undergo diverse stages to extract different information. We introduce an interesting and important question: *Can we develop a single detector to detect adversarial images created on various vision tasks?* To investigate this question, we first create a dataset containing adversarial images for various vision models and their corresponding clean images for evaluation. Furthermore, we propose the first Adversarial image Unified Detector (Adv-UDor) that models the distribution of clean images, enabling it to detect various adversarial examples in a task-agnostic manner. Our extensive experimental results on our created dataset demonstrate the effectiveness
    of our Adv-UDor across various vision tasks and fundamental adversarial attack methods, as well as in detection-aware attack scenarios.'

- paper_id: jJdBhmQ8WZ
  number: 20
  status: Accept (Oral)
  title: 'Beyond Direct Answers: Camera Motion Grounded Training and Evaluation for Vision-Language Models'
  authors:
  - Hsiang-Wei Huang
  - Junbin Lu
  - Kuang-Ming Chen
  - Jianxu Shangguan
  - Cheng-Yen Yang
  - Jenq-Neng Hwang
  abstract: Vision-Language Models (VLMs) have achieved impressive accuracy on spatial question answering task with recent advancement in model architecture, training objective, and data pipeline. However, whether the widely adopted question answer accuracy alone fully reflect the spatial understanding ability remains unclear. To answer the spatial question correctly, vision-language models must first understand the basic camera motion from the input video. Our study reveals that current state-of-the-art spatial question answering VLMs do not achieve notable camera motion understanding ability compared to base model, suggesting the potential unfaithful spatial reasoning. To address this, we propose the Spatial Narrative Score (SNS), a diagnostic evaluation metric in which a VLM first generates a question-agnostic spatial narrative that captures both scene semantics and camera motion; a proxy LLM then reasons from this narrative to answer the original spatial question. SNS serve as a diagnostic
    complementary metric to the direct question answer accuracy, which reflects whether the VLM to generate faithful spatial evidence for downstream question answering task. Using SNS, we find that spatial QA-specialized VLMs can improve direct QA accuracy while producing weaker spatial narratives. To address this blind spot, we introduce CaMo-30K, a camera-motion grounded VLM training dataset with spatial narrative supervision and standard spatial QA data. Finetuned on CaMo-30K, CaMo-3B achieves consistent performance across SNS, direct spatial QA, and camera motion captioning, suggesting improved faithfulness of spatial evidence generation while remaining competitive on direct question answering accuracy. Model and code are available at https://github.com/hsiangwei0903/CaMo.

- paper_id: HU4UDCEDHO
  number: 981
  status: Accept (Poster)
  title: End-to-End Occlusion Ordered Semantic Instance Segmentation
  authors:
  - Jeremy Yu
  - Soroosh Baselizadeh
  - Olga Veksler
  - Yuri Boykov
  abstract: 'Joint architectures for predicting instance masks with additional depth-related information have shown improvements in performance on both the original segmentation tasks and their corresponding depth-related tasks. Closely related to depth, occlusion can also provide strong cues for segmentation. Although occlusion ordering between instances provides less supervision than full pixel-wise depth, occlusions can be easily annotated for existing datasets. We develop an end-to-end framework to perform instance segmentation and per-instance global occlusion order prediction simultaneously by appending a global occlusion order head to standard instance segmentation architectures. Our approach to occlusions is different from most prior work. Prior work performs occlusion estimation in a local pairwise manner: given two instances, classify one of them as the occluder. Due to locality, for scenes known not to have occlusion cycles, such approaches can (and do) produce occlusion cycles,
    which are errors. Unlike most prior work, we directly label instances with their occlusion-order labels, where an instance with a larger label occludes any neighboring instance with a smaller label. This approach is cycle-free by design. Using cross-entropy with occlusion-order labels fails as occlusion-order labels do not have a fixed semantic meaning. Therefore, we develop a novel regularized loss function for successful training. Our framework is able to achieve high occlusion-order accuracy for the KINS and COCOA datasets. The added supervision can also improve performance on instance segmentation.'

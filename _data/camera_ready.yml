- paper_id: H1AYJHmscW
  number: 437
  status: Accept (Poster)
  title: 'See-through-GS: Static Car Removal and Cross-view Consistent Inpainting with 3DGS'
  authors:
  - Yuzhou Zhou
  - Andrew Markham
  - Niki Trigoni
  abstract: "Static car removal and background reconstruction in street-scene 3D Gaussian Splatting (3DGS) are important for applications such as driving simulation and privacy preservation.\nHowever, existing video inpainting and 3DGS editing methods often suffer from removal artifacts and ambiguous background reconstruction in ego-vehicle scenes.\nThe primary challenge lies in producing geometrically realistic and consistent 3D backgrounds under severe occlusions and directional viewpoints.\nIn this paper, we propose See-through-GS, \na framework for static car removal and background inpainting in street-scene 3DGS. \nAfter removing the target object from the Gaussian field, our method introduces three key components.\nFirst, we introduce a hypothesis-selection strategy that automatically determines the reference-view inpainting by evaluating depth consistency. \nSecond, we design a depth-based filtering and mask refinement module that leverages depth guidance from the reference view to\
    \ suppress artifacts and refine inpainting masks. \nThird, we identify geometrically consistent supporting views and jointly incorporate them into 3DGS re-optimization.\nExtensive experiments demonstrate consistent improvements over existing 2D and 3D baselines in both perceptual quality and geometric coherence, resulting in more realistic background reconstruction."

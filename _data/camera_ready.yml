- paper_id: 2TDh1n6hY5
  number: 596
  status: Accept (Poster)
  title: Conditional Diffusion for 3D CT Volume Reconstruction from 2D X-rays
  authors:
  - Martin Rath
  - MORTEZA GHAHREMANI
  - Yitong Li
  - Ashkan Taghipour
  - Marcus R. Makowski
  - Christian Wachinger
  abstract: "Computed tomography (CT) provides rich 3D anatomical details but is often constrained by high radiation exposure, substantial costs, and limited availability. \nWhile standard chest X-rays are cost-effective and widely accessible, they only provide 2D projections with limited pathological information. Reconstructing 3D CT volumes from 2D X-rays offers a transformative solution to increase diagnostic accessibility, yet existing methods predominantly rely on synthetic X-ray projections, limiting clinical generalization. \nIn this work, we propose AXON, a multi-stage diffusion-based framework that reconstructs 3D CT volumes directly from real X-rays with substantially improved fidelity over existing approaches.\nAXON adopts a coarse-to-fine reconstruction paradigm that progressively transforms 2D X-ray observations into anatomically consistent 3D volumes. The framework begins with a Brownian Bridge diffusion model that captures global anatomical structures, followed by a ControlNet-guided\
    \ refinement stage that enhances local intensity details and anatomical realism. To alleviate the depth ambiguities inherent in 2D-to-3D reconstruction, AXON seamlessly incorporates bi-planar X-ray views, enabling more accurate spatial reasoning and structural recovery. A dedicated super-resolution module further increases the spatial resolution of the generated volumes.\nExtensive experiments on both public and external datasets demonstrate that AXON consistently surpasses state-of-the-art approaches while maintaining strong generalizability across diverse clinical distributions. Notably, at our highest-resolution bi-planar setting, AXON achieves an 11.9% improvement in PSNR and an 11.0% increase in SSIM over the strongest baseline evaluated at that resolution. In the 128³ single-planar setting, it maintains a consistent lead of 7.8% in PSNR on LIDC-IDRI, with even larger margins on the external clinical dataset of 8.0% in PSNR and 16.9% in SSIM. Our code is available at https://github.com/ai-med/AXON/."

- paper_id: sJSeaES3NB
  number: 1845
  status: Accept (Poster)
  title: 'Seeing Step-by-Step: Progressive Semantic Feedback for Joint Fusion and Segmentation'
  authors:
  - Wenjun Jia
  - Jun-Jie Huang
  - Ge Luo
  - Xueting Chen
  - Tianrui Liu
  - Xueqiong Li
  - KE LIANG
  - Xinwang Liu
  abstract: 'Existing joint infrared-visible image fusion and semantic segmentation frameworks typically rely on complex cross-modal feature interactions or external semantic priors, yet they rarely establish explicit feedback mechanisms that allow intermediate segmentation states to guide fusion refinement. We observe that intermediate segmentation predictions provide two complementary cues for fusion refinement: (i) high-entropy regions indicate insufficient discriminability in fused features, and (ii) object boundaries impose structural constraints shared by both fusion and segmentation tasks. Based on this observation, we propose S3Fusion, a progressive semantic feedback framework for joint infrared-visible image fusion and semantic segmentation. Specifically, a Semantic-Aware Gated Fusion (SAGF) module leverages an uncertainty map derived from segmentation entropy and a learned boundary map supervised by semantic labels to progressively refine cross-modal features in high-level stages.
    We further adopt a progressive refinement strategy to mitigate over-refinement while preserving progressive semantic gains. Extensive experiments on the FMB and MSRS datasets demonstrate that S3Fusion achieves state-of-the-art segmentation performance while maintaining competitive fusion quality, without relying on external foundation models.'

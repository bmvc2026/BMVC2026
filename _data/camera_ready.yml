- paper_id: BgNQfTppob
  number: 1419
  status: Accept (Poster)
  title: 'FetAngle: Toward Generalizable Automated Fetal Brain Angle Biometry via Test-Time Adaptation'
  authors:
  - Yitong Luo
  - Yijin Li
  - Mingxuan Liu
  - Yi Liao
  - Kasidit Anmahapong
  - Hongjia Yang
  - Yifei Chen
  - Xiaotian Hu
  - Haibo Qu
  - Qiyuan Tian
  abstract: 'Reliable measurement of fetal brain biometric angles is critical for prenatal neurodevelopmental assessment and diagnosis of posterior fossa abnormalities, but remains largely manual and subject to inter-observer variability. Although deep learning enables automation, models suffer from significant performance degradation under cross-institutional domain shifts and disease-induced anatomical variations. To address this, we propose FetAngle, a test-time adaptation (TTA) framework for robust fetal MRI angle measurement. The model is first trained with a supervised encoder–decoder network enhanced by contrastive learning for discriminative representation. During adaptation, it is updated without target labels or source data using four objectives: angle consistency, boundary regularization, entropy minimization, and self-supervised contrastive learning. Experiments on three external cohorts show that FetAngle consistently outperforms existing TTA and biometry methods, achieving
    landmark MREs of 1.38, 1.72, and 1.64 mm, respectively. Disease-level analysis further supports its clinical value in detecting posterior fossa abnormalities. Overall, FetAngle enables accurate and generalizable fetal biometric angle measurement under domain shift, with potential for prenatal clinical decision support. Code is available at https://github.com/birthlab/FetAngle.'

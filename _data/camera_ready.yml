- paper_id: 6PfpdTI6DB
  number: 420
  status: Accept (Poster)
  title: 'LEGAU: Learning Semantic Gaussian Priors for Scalable Category-level Pose Estimation'
  authors:
  - Hongli XU
  - Zhaowei Lu
  - Junwen Huang
  - Jiaqi Hu
  - Peter KT Yu
  - Benjamin Busam
  - Federico Tombari
  - Slobodan Ilic
  abstract: |-
    Category-level 6D pose estimation from a single RGB-D observation is inherently under-constrained, since partial visible geometry must be interpreted together with a canonical object structure before a stable pose can be determined. We present LEGAU, a unified framework that jointly predicts NOCS correspondence, object pose and size, and a canonical Semantic Gaussian Field. Rather than treating reconstruction as a detached auxiliary task, LEGAU uses the Gaussian field as a category-conditioned structural prior that participates in multimodal feature fusion and provides global guidance for local pose reasoning. Conditioned on a categorical text embedding, LEGAU processes
    RGB-D observations through a transformer-based fusion module that integrates visual, geometric, and category-level cues, decoding the NOCS map, pose and size information and the Gaussian-based object representation. Extensive experiments on synthetic and real-world benchmarks show that this coupled pose-shape formulation achieves strong performance in a single-model multi-category setting, with up to 22% on SOPE and competitive transfer to real-world data. These results highlight the benefit of jointly learning canonical correspondence, object shape, and pose alignment within a unified representation.

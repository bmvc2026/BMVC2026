- paper_id: fcVxwGWWCk
  number: 1087
  status: Accept (Oral)
  title: Class-Conditional Closed-Form Low-Rank Merging for Federated Continual Learning
  authors:
  - Zarka Bashir
  - Mridula Verma
  - C Krishna Mohan
  abstract: Federated Class-Incremental Learning (FCIL) requires distributed clients to continuously learn new categories without sharing raw data, while resisting catastrophic forgetting under non-IID distributions. Low-Rank Adaptation (LoRA) enables scalable FCIL via lightweight adapters, however, existing methods either rely on iterative server-side optimization prone to client drift, or ignore class-conditional feature heterogeneity across clients. Recent closed-form merging approaches avoid iterative optimization but aggregate class-blind pooled statistics that amplify majority-class feature directions and may risk privacy leakage. Furthermore, merging layers independently ignores cross-layer activation dependencies, causing client representations to lie in inconsistent feature spaces and degrading aggregation quality. We propose $\textbf{CoLoR}$, a $\textbf{C}$lass-c$\textbf{o}$nditional closed-form $\textbf{LoR}$A merging framework for FCIL. In CoLoR, by transmitting lightweight per-class
    feature means, the server reconstructs a provably unbiased population Gram estimate, achieving second-order aggregation without exposing raw features, gradients, or covariances. Critically, CoLoR's privacy leakage decreases with dataset size, in contrast to prior methods. We enforce a cross-layer consistent forward pass that aligns all clients within a shared representation space prior to aggregation, and fit a global ridge-regression classifier directly under the consolidated backbone to eliminate feature-classifier mismatch at inference. We establish theoretical guarantees on estimator unbiasedness, merging error, and classifier consistency. Comprehensive experiments across heterogeneous FCIL benchmarks demonstrate SOTA performance.

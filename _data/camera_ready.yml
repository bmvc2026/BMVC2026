- paper_id: 3WDtY7tiXk
  number: 667
  status: Accept (Poster)
  title: 'MEJA: A Self-Supervised Joint-Embedding Predictive Architecture for 3D Mesh Semantic Segmentation'
  authors:
  - Mohammadreza Heidarianbaei
  - Max Mehltretter
  - Franz Rottensteiner
  abstract: "The application of deep learning to large-scale 3D textured meshes generated by photogrammetry is hindered by their structural irregularity and the scarcity of dense semantic annotations. \nWe address these limitations by introducing a new architecture for the semantic segmentation of 3D textured meshes and a self-supervised learning framework. \nOur network uses FlashAttention to process dense per-pixel texture and employs dynamic multi-configuration clustering to facilitate global information exchange while not requiring manifoldness. \nWe also propose MEJA (Mesh Joint-Embedding Predictive Architecture), a self-supervised learning framework for the network based on predicting features for masked mesh clusters, comparing them to features computed for the entire mesh. \nAn evaluation on several datasets demonstrates that our method for semantic segmentation achieves state-of-the-art results with 87.5\\%, 84.7\\% mF1 on the SUM and SeMet datasets, respectively. \nPre-training\
    \ by MEJA yields consistent performance improvements compared to supervised learning from scratch."

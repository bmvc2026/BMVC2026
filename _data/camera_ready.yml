- paper_id: Zctd8iaIXG
  number: 1809
  status: Accept (Poster)
  title: Survival-Based Collision Anticipation with an Interpretable Kinematic Memory
  authors:
  - Duc Viet Le
  abstract: 'We formulate dashcam collision anticipation as censored survival prediction over an online, human-readable kinematic memory. Our model, SurvNam, tracks nine named object-centric quantities and predicts a conditional distribution over time to collision using an additive piecewise cumulative-hazard head. A single likelihood produces monotone risk estimates, treats benign clips as censored observations, and reveals how each feature contributes to a warning, without requiring a separate explanation method. This formulation also exposes a limitation of the standard evaluation protocol, which scores models by average precision at fixed pre-impact horizons. On the standard Nexar split, the shortest horizon contains no positive events by construction, while reproduced recurrent models that perform well in-domain degrade by more than a factor of seven under cross-camera shift. We evaluate cross-dataset generalization using a Nexar/DAD/CCD transfer matrix. Against academic baselines reproduced
    with a shared YOLO11x front end, SurvNam achieves the best integrated Brier score in five of the six off-diagonal settings. Its $95\%$ intervals across random seeds do not overlap with those of the baselines in four settings, with statistical ties in the remaining two. Compared with BADAS-Open, a foundation model with approximately $300$M parameters, SurvNam wins one of the two Nexar transfer settings and loses the other, while using over $6000$ times fewer parameters. Its learned features remain directly interpretable, with a mean per-feature Spearman correlation of at least $0.82$ between each feature''s stated attribution and its measured counterfactual effect on Nexar and CCD. These results show that robust cross-camera collision anticipation does not require a large black-box model: SurvNam is compact, interpretable, and competitive across datasets.'

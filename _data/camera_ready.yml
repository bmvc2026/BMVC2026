- paper_id: QdQtTpPzAB
  number: 1772
  status: Accept (Poster)
  title: 'Cross-Task Generalization Between Understanding and Generation in Unified Vision-Language Models: A Controlled Study'
  authors:
  - Jihai Zhang
  - Tianle Li
  - Linjie Li
  - Zhengyuan Yang
  - Yu Cheng
  abstract: |-
    Unified vision-language models (VLMs) aim to support both visual understanding and generation within a single framework, but it remains unclear when mixed training benefits both capabilities and when it introduces conflicts.
    This paper presents a controlled empirical study of cross-task generalization between understanding and generation in unified VLMs.
    We construct two controllable image-text benchmarks, SmartWatch and modified CelebA, with paired VQA, captioning, and text-to-image generation tasks, and evaluate multiple LLM-based unified architectures built from SigLIP and VQ-VAE visual spaces.
    Our experiments show that mixed understanding-generation training can improve both tasks over task-specific training, but the benefit depends strongly on the relation between vision input and output spaces.
    Unified models with better aligned visual spaces exhibit stronger cross-task transfer, while misalignment of the input visual spaces substantially weaken this effect and can turn mutual benefits into conflicts.
    We further find that increasing data from one task can initially improve the other, but excessive imbalance between understanding and generation data may degrade the complementary task.
    By controlling attribute frequencies, we show that generation supervision can help recover underrepresented visual concepts for understanding.
    Adapter analyses suggest that this transfer is not primarily caused by richer visual adapter features, but by the base language model learning relationships that generalize across aligned visual spaces.
    A real-case experiment on LLaVA provides additional evidence that mixed understanding-generation training can benefit visual understanding beyond controlled benchmarks.

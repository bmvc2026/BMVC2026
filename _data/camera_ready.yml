- paper_id: wJPfcz6Qh4
  number: 1190
  status: Accept (Poster)
  title: 'SourceReward: Source-Preserving Reward Modeling for High-Precision Image Editing'
  authors:
  - Rishav Sahay
  - Karan Malhotra
  - Lavanya Sita Tekumalla
  - Akanksha Roy
  - Purav Aggarwal
  abstract: Instruction-guided image editing models excel at following instructions but often introduce unintended changes to source regions that should remain unchanged, a critical failure in high-precision applications like product troubleshooting. Existing reward models primarily evaluate instruction adherence and perceptual quality, but do not explicitly assess whether edits preserve the underlying source content outside the intended modification. We introduce SourceReward, a reward model that incorporates source adherence as a first-class evaluation dimension. Our approach jointly reasons over the source image, edit instruction, and edited output, using edit-centric cross-attention to capture both source consistency and instruction alignment, enabling the model to distinguish intended modifications from unintended deviations. To address the lack of human preference data in domain-specific settings, we propose a scalable pipeline that generates diverse edit candidates, aggregates multi-judge
    evaluations via Reciprocal Rank Fusion, and leverages inter-judge agreement for uncertainty-aware training. Experiments on a large-scale product troubleshooting dataset show that SourceReward improves detection of source-unfaithful edits and enhances best-of-N edit selection, while reducing per-sample scoring latency by 15.6X over the strongest VLM judge baseline.

- paper_id: VZaiJKDidz
  number: 504
  status: Accept (Poster)
  title: 'Sketch-a-Pose: Bridging Abstract Drawings and 6-DoF Camera Estimation'
  authors:
  - Ben Canini
  - Richard Bowden
  - Yi-Zhe Song
  abstract: |-
    Camera pose estimation has traditionally relied on RGB images, assuming access to rich visual detail and low-level features. In this paper, we introduce a novel framework for estimating 6-DoF camera pose directly from human sketches. This new setting is both highly challenging—sketches are abstract, sparse, and stylistically diverse—and uniquely valuable, enabling pose estimation when photos are unavailable or when structural abstraction is preferable (e.g., design, ideation, cultural heritage).

    We present Sketch-a-Pose (SAP), a lightweight framework that bridges the modality gap between drawings and geometry through three components: (i) a sketch adapter that maps CLIP embeddings into the pose-sensitive DINO space for robust initialization, (ii) a sparse Gaussian edge representation that captures sketch-aligned structure and supports efficient rendering, and (iii) an analysis-by-synthesis refinement loop guided by perceptual (CLIP) and structural (LPIPS) losses.

    Across the Tanks and Temples dataset, SAP demonstrates that sketches alone can yield accurate camera pose recovery, often rivaling or even surpassing RGB-based baselines such as iNeRF, NeMO+VoGE, and 6DGS. Beyond raw numbers, SAP reveals a surprising insight: structural alignment from sketches can outperform photorealistic cues, suggesting a new paradigm of semantic-guided geometric vision.

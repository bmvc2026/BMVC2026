- paper_id: nOjQeXR4EZ
  number: 1291
  status: Accept (Poster)
  title: 'Beyond Report Imitation: Clinically Aware Multi-Image Ultrasound Report Generation from Visible Evidence'
  authors:
  - Yuchen Yang
  - Wang Xin
  - Lufan Wang
  - Yinghong Pan
  - Yujuan Feng
  - Yuqing Yang
  abstract: 'Multi-image ultrasound report generation requires aggregating clinical evidence across views, yet archived key frames only partially observe the dynamic examination. Raw report imitation is therefore structurally misaligned: clinically valid report content may be unverifiable from the images given to a model. This gap induces a clinical behavior alignment problem, where a model must preserve visible findings, avoid diagnostic reversals and unsupported completion, and avoid collapsing into conservative templates. We propose CAMEO, a Clinically Aware Multi-image Evidence-grounded Orchestration framework for ultrasound report generation. Stage I adapts the model to ultrasound visual-language primitives; Stage II performs Cross-View Evidence Grounding by distilling trusted visible report points into multi-image QA and report-style supervision; and Stage III performs Clinically Aware Preference Alignment with clinical-error-oriented preference pairs. Based on USReport, we construct
    \usreport with 17,670 evidence-grounded paired-image training instances and \uspref with 21,869 preference pairs, and train with \pubmedus, a 25,631-sample ultrasound subset. On the primary \usreport benchmark, \ours improves over EchoVLM from 0.25 to 0.40 BLEU-1, 0.28 to 0.45 ROUGE-1, and 0.27 to 0.43 METEOR, while increasing ClinicalScore from 55.02 to 74.20. These results suggest that reliable ultrasound report generation requires evidence-grounded supervision, clinically aware alignment, and clinically meaningful evaluation.'

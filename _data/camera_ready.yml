- paper_id: 40tu77RZJq
  number: 384
  status: Accept (Poster)
  title: 'InterTalk: 3D Multi-Round Dyadic Conversation Modeling with Interleaved Linear-Biased Pairwise Causal Attention'
  authors:
  - Rittik Panda
  - Divyam Choudhary
  - Dinesh Babu Jayagopi
  - Raj Tumuluri
  - Magnus Revang
  abstract: 'Realistic 3D conversational avatars require modeling not only accurate speech-driven animation, but also natural conversational dynamics such as turn-taking, non-verbal feedback, backchannels, overlaps, pauses, and seamless role transitions for coherent multi-round interactions. However, most existing methods model speaking and listening behaviors independently, limiting conversational realism by overlooking these key interaction dynamics. Only a few recent approaches jointly model conversational interactions to capture these dynamics, but they rely on additional motion inputs and non-causal processing, limiting them to offline settings. To address these limitations, we present \textbf{InterTalk}, a unified framework for 3D multi-round dyadic conversational facial motion generation from dual audio streams without requiring additional motion inputs. InterTalk jointly models speaking, listening, and other conversational dynamics within a single streaming-compatible causal architecture.
    At its core, InterTalk introduces cross-speaker token interleaving with temporal coupling of adjacent tokens to enable efficient modeling of inter-speaker coordination and seamless role transitions. We further propose linear-biased pairwise causal attention to enforce causality while improving long-range generalization. When trained on dyadic conversational data, InterTalk supports three tasks: multi-round dyadic conversation, standalone speaking, and non-verbal listening behavior generation, all at inference, within a single architecture, without retraining or architectural modification. Extensive experiments on DualTalk, MEAD, and ViCo datasets demonstrate state-of-the-art performance across all three tasks, showing that InterTalk not only improves conversational realism by capturing key interaction dynamics but also strengthens standalone speaking and non-verbal listening behavior generation.'

- paper_id: PfZkYawn8v
  number: 801
  status: Accept (Poster)
  title: 'UniRes: Degradation-Aware Disentangled Feature Learning for Unified Image Restoration'
  authors:
  - Ailin Li
  - Pinjie Su
  - Ying Huang
  abstract: 'In the field of multi-task image restoration, developing unified models to address diverse degradations remains challenging due to two primary issues: (1) direct processing of multiple kinds of degraded images in a unified framework typically leads to entangled task-specific features, limiting the overall restoration performance; and (2) processing diverse degraded images typically requires reliance on task-specific priors and explicit degradation modeling. To address these limitations, we propose UniRes, a multi-task image restoration framework based on feature disentanglement and unified degradation modeling. Specifically, we introduce an enhanced Retinex based feature disentanglement strategy adapted for diverse degradation tasks, followed by a simple yet effective unified modeling approach for integrated image restoration. UniRes employs a two-stage learning process to adaptively extract task-independent components while predicting task-specific degradation representations.
    These representations are formulated as unified degradation perturbations in the illumination domain, enabling UniRes to adapt to diverse restoration scenarios such as dehazing, deraining, denoising, shadow removal, and low-light enhancement. Experimental results across multiple restoration tasks show that UniRes achieves competitive restoration performance, offering valuable insights for multi-task image restoration.'

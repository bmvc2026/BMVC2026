- paper_id: ZGZc6w3frP
  number: 251
  status: Accept (Poster)
  title: 'PnP-OC: Efficient Optimal Control for High-Fidelity Flow-Based Inverse Problems'
  authors:
  - Yilong Liang
  - Chenyang Wang
  - Qiangqiang Shen
  - Zhiwei Zhong
  - Kui Jiang
  - Junjun Jiang
  - Xianming Liu
  abstract: Imaging inverse problems aim to recover high-quality signals from degraded observations and play a fundamental role in computational imaging and computer vision. Recently, Plug-and-Play (PnP) frameworks based on pre-trained flow matching models have demonstrated promising reconstruction performance by leveraging powerful generative priors. However, existing PnP-flow methods typically perform local trajectory correction at each iteration, lacking global constraints over the entire generative dynamics. As a result, the reconstructed trajectory may gradually deviate from the learned data manifold, leading to over-smoothing artifacts and loss of structural details in severely degraded inverse problems. To address this limitation, we propose PnP-OC that integrates lightweight optimal control into flow-based trajectory evolution. Instead of performing expensive full-trajectory optimization, PnP-OC introduces a look-ahead control mechanism that provides future-aware trajectory guidance
    while preserving efficient inference. By regulating the global evolution of the reconstruction path, the proposed method effectively maintains consistency with the high-fidelity image manifold and mitigates trajectory-induced artifacts. Extensive experiments on multiple inverse problem tasks, including image inpainting, deblurring, and super-resolution, demonstrate that PnP-OC consistently improves perceptual reconstruction quality and suppresses over-smoothing artifacts, outperforming existing Plug-and-Play, diffusion-based, and flow-based baselines while maintaining competitive computational efficiency.

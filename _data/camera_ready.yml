- paper_id: 9eHDJ2fR3o
  number: 223
  status: Accept (Poster)
  title: 'Restoration Utility Maps: Diagnosing and Refining Face Restoration for Recognition'
  authors:
  - Yongsoo Choi
  - Nam Ik Cho
  abstract: Blind face restoration is commonly used as a preprocessing step for face recognition; however, standard restoration methods can inadvertently reduce downstream identity similarity. On a synthetically corrupted LFW benchmark, 29.9% of CodeFormer outputs exhibit lower cosine similarity to the clean template than their degraded inputs. To address this issue, we present Restoration Utility Maps (RUM) as a framework based on path-integrated gradients that decomposes restoration-induced changes in recognition scores into spatial attribution maps. By attributing score changes directly to pixels, RUM identifies specific regions responsible for recognition gains or losses. RUM serves three complementary roles. First, as a post-hoc diagnostic, it enables actionable region-level interventions and a selector that performs comparably to a whole-image selection oracle. Second, RUM provides pixel-level supervision for restoration fine-tuning. It works best when changes are localized and identity-only
    FT leaves headroom, with identity alignment further shaping the outcome. Third, an optional template-based pixel refinement reduces the rate of harmful restoration by 16-24 percentage points relative to raw CodeFormer output across five recognition backbones when the corruption type is known. Separately, a regime-aware deployment rule that requires no clean template at inference lowers harmful restorations by 1.23 percentage points on a held-out test split while largely preserving the visual quality of the identity-only checkpoint. In summary, RUM offers a principled and actionable framework for diagnosing and improving recognition-coupled face restoration.

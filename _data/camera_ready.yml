- paper_id: 3L2wYKY9Li
  number: 1078
  status: Accept (Poster)
  title: 'Beyond Calibration : Improving Mixup for Medical Image Classification via Feature-Space Selective Confidence'
  authors:
  - Quoc Viet Nguyen
  - Hai Trong Dong Pham
  - Quan Pham Anh
  - Hai Nguyen Hong
  - Duong Bach
  - Cuong Do
  abstract: 'Learning to reject plays an important role in medical imaging because it allows models to abstain from uncertainty predictions, reducing the risk of severe diagnostic errors in clinical practice. However, medical imaging tasks often suffer from data scarcity and class imbalance, which make training reliable deep learning models challenging. To address this issue, Mixup has become a promising data augmentation strategy due to its strong generalization and calibration benefits. However, recent evidence has pointed out a contradiction between the calibration and discrimination ability of Mixup-trained models: by encouraging the probabilities of unambiguous samples to be lower to avoid overconfidence, Mixup can mix the confidence ranges of correct and incorrect samples, making it difficult to distinguish failures from slightly ambiguous images. This results in degraded selective prediction ability, making Mixup-trained models problematic for high-stakes medical diagnosis. In this
    work, we demonstrate that this pathology is linked to a mismatch between the smooth feature-space transitions induced by Mixup and the directional sensitivity of the final linear head, which makes confidence estimation from the logit layer unreliable. Motivated by this observation, we propose Feature-KNN, a post-hoc selective prediction method that bypasses sole reliance on the final linear transformation and recovers confidence ranking by estimating a local vicinal posterior in feature space. Experiments on seven medical imaging datasets spanning multiple modalities, including X-ray, MRI, CT, and histopathology, and multiple backbone architectures demonstrate that our method outperforms existing post-hoc failure prediction methods, achieving approximately 17.5% AURC reduction on average. These results highlight that the final linear transformation is suboptimal for Mixup-trained models in selective prediction, and that confidence ranking quality can be exploited from feature space by
    approximating the vicinal posterior.'

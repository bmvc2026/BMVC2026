- paper_id: XggLA7dhUS
  number: 1707
  status: Accept (Poster)
  title: Adaptive Subspace Projection for Generative Personalization
  authors:
  - Van-Anh Nguyen
  - Anh Tuan Bui
  - Tamas Abraham
  - Junae Kim
  - Amardeep Kaur
  - Rollin Omari
  - Thuy-Trang Vu
  - Dinh Phung
  abstract: 'Generative personalization enables diffusion models to synthesize user-specific subjects, but it often suffers from the semantic collapse problem (SCP), where the learned personalized concept overwhelms the prompt and causes the model to ignore important contextual details. In this paper, we present a comprehensive analysis of SCP through the lens of prompt-embedding drift relative to the original pre-personalization representation. Our analysis shows that the residual induced by the personalized token is not arbitrary: it remains consistent across diverse contexts and is concentrated in a low-dimensional subspace. This reveals that the contribution of the personalized concept can be explicitly controlled by regulating the strength and direction of its identity residual. Building on this analysis, we propose Adaptive Subspace Projection (AdaptSP), a simple training-free test-time method for compositional personalization. AdaptSP anchors the prompt with the pre-personalization
    text encoder and injects the personalized identity through a controlled residual-subspace adjustment. Experiments across multiple personalization pipelines show that AdaptSP improves prompt fidelity and contextual alignment while maintaining strong subject consistency.'

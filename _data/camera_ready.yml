- paper_id: Sq0WlG62qp
  number: 1064
  status: Accept (Poster)
  title: Real-Time Dental Panorama Generation from Handheld Intraoral Video
  authors:
  - Taegon Kim
  - GangHyeon Jeong
  - Seungho Eum
  - Jaehong Myung
  - Jihoon Lee
  - Unsang Park
  abstract: 'Handheld intraoral cameras provide a practical and low-cost way to document dental surfaces, but their narrow field of view makes it difficult to observe the dental arch as a continuous structure. Existing intraoral stitching methods often rely on hand-crafted feature matching, controlled acquisition settings, or GPU-based learned matchers, limiting their suitability for real-time chairside use. This paper presents a CPU-oriented framework for real-time dental surface panorama generation from handheld intraoral video. The proposed method constructs left and right half-jaw panoramas through zero-normalized cross-correlation (ZNCC)-based sequential frame selection, translation alignment, and seam-aware blending. The two half-jaw panoramas are then registered by landmark-guided left–right fusion. The framework supports buccal, lingual, and occlusal views of both upper and lower jaws without task-specific model training. We evaluate the method using representative classical and
    learning-based stitching baselines, human visual assessment, frame-to-panorama consistency metrics, and runtime analysis. The proposed framework achieves more stable panorama construction and higher perceptual quality than the evaluated baselines, while sustaining practical CPU throughput for online use: 34.3 FPS for 540 × 960 input frames and 25.4 FPS for 600 × 1080 input frames. These results suggest that the proposed framework offers a lightweight and deployable solution for real-time intraoral surface panorama generation under realistic handheld scanning conditions.'

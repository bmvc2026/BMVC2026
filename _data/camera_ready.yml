- paper_id: 66mjifHCKg
  number: 552
  status: Accept (Poster)
  title: Investigating Adversarial Robustness of Multi-modal Large Language Models
  authors:
  - Hashmat Shadab Malik
  - Muzammal Naseer
  - Salman Khan
  abstract: "Multi-modal Large Language Models (MLLMs) achieve strong performance on vision–language tasks; however, incorporating visual inputs through a vision encoder (e.g., CLIP) substantially expands the attack surface, making these models vulnerable to visual adversarial perturbations. \nPrior defenses typically preserve compatibility with pretrained MLLMs by enforcing strict alignment to CLIP's original embedding space during adversarial fine-tuning; while practical, this constraint fundamentally limits achievable robustness. \nWe present a systematic investigation of adversarial robustness in MLLMs along multiple complementary dimensions. We first introduce a diagnostic CLIP-alignment protocol that predicts, prior to full MLLM training, which robust vision encoders will transfer effectively to the multimodal setting—revealing that large-scale multimodal adversarial pretraining, rather than unimodal scale alone, is the critical factor for strong robustness transfer.\nBuilding on this,\
    \ we integrate such encoders into MLLMs via end-to-end multimodal training, yielding average gains of 28 CIDEr points on image\ncaptioning tasks and 11.7% in VQA accuracy  under strong adversarial attacks compared to constrained plug-and-play baselines. \nWe further show that adversarial training applied directly to a standard non-robust MLLM degrades both clean and adversarial performance—establishing robust visual representations as a strict prerequisite—while end-to-end adversarial training from a robust backbone delivers additional gains of  1.9 CIDEr points\nand 4.3% in VQA accuracy, most pronounced under strong ensemble-based attacks. \nBeyond training-time defenses, we show that lightweight test-time visual stochastic transformations serve as an effective practical black-box defense for non-robust MLLMs, elevating adversarial performance from near-zero to levels comparable with robust models, making image-space stochastic transformations surprisingly effective at disrupting adversarial\
    \ feature structure before it reaches the language model.\nFinally, we evaluate white-box visual jailbreak robustness and demonstrate that our robust models substantially reduce toxic generation across all attack strengths.\nTogether, these findings provide practical and scalable guidelines for improving adversarial robustness in MLLMs. Code and pretrained weights will be released publicly to support future research."

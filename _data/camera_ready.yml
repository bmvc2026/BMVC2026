- paper_id: sKMM70JrKW
  number: 514
  status: Accept (Poster)
  title: Geometric Signatures of Neural Networks through Invertible Weight Trajectory Decomposition
  authors:
  - Thomas Hudcovic
  - Gabriel Zachmann
  abstract: 'We present a geometric framework for analyzing neural network learning dynamics at the level of semantic units, including convolutional filters, feed-forward neurons, and attention channels. Neural network training induces coherent trajectories through weight space, yet existing analyses primarily operate on the global parameter vector, providing limited insight into the internal organization of learned components. We project the training trajectory of each semantic unit into a shared invertible low-dimensional embedding per layer, retaining an orthogonal residual for reconstruction. Across selected representatives of CNN-, MLP-, and Transformer-based models on classification and segmentation tasks, each one exhibits a distinct geometric signature: a characteristic pattern in the intrinsic dimensionality and dynamics of its semantic unit trajectories. Moreover, a unit''s displacement from initialization in this embedding is indicative of its functional sensitivity, with the
    direction of this relationship tracking the layer''s computational role. The embedding supports direct intervention: manipulating semantic units the geometry identifies as sensitive degrades model performance substantially more than manipulating random units at matched magnitude.'

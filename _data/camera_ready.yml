- paper_id: ZXhpK4fO0H
  number: 50
  status: Accept (Poster)
  title: 'PruneNAS: Constraint Aware Neural Architecture Search based Pruning'
  authors:
  - Sudhakar Sah
  - Nikhil chhabra
  - Honnesh Rohmetra
  - Andy Li
  abstract: Neural Architecture Search (NAS) has achieved state-of-the-art performance across diverse tasks, but its high computational cost remains a major barrier. We introduce PruneNAS, a novel framework that integrates structured pruning into NAS to efficiently explore high-performing architectures while leveraging pretrained models. Unlike conventional NAS methods that train each candidate from scratch, PruneNAS generates a candidate pool by pruning pretrained networks at multiple granularity levels and formulates the selection as a global optimization problem using training-free importance metrics. This approach enables rapid evaluation of candidate architectures under strict resource constraints, dramatically reducing search time from hundreds of GPU hours to mere minutes. Experiments on standard benchmarks demonstrate that PruneNAS discovers compact, high-accuracy architectures that nearly halve the computational cost (MACs) of prior methods on ResNet-50, while also showing strong
    generalization on object detection tasks with YOLO. Our method bridges structured pruning and NAS, offering a practical solution for resource-constrained model deployment.

- paper_id: kXs2CV7tap
  number: 722
  status: Accept (Poster)
  title: 'IESC-4DGS: Interpretable and Self-Corrective 4D Gaussian Splatting for Dynamic Street-Scene Reconstruction'
  authors:
  - Tianfu Guo
  - Kohei Inoue
  abstract: "Dynamic street-scene reconstruction is essential for autonomous driving, as it provides spatial-temporal representations for perception, simulation, and planning. \nRecent 4D Gaussian Splatting methods achieve efficient rendering and dynamic scene modeling, but most of them remain black-box optimization systems driven by photometric losses and heuristic Gaussian updates. \nAs a result, it is difficult to explain why reconstruction errors occur, which factors dominate failure regions, and how the Gaussian structure should be corrected. \nMoreover, adding interpretability may introduce extra optimization burden and degrade reconstruction quality.\n\nTo address these issues, we propose IESC-4DGS, a plug-and-play interpretable and self-corrective framework for dynamic street-scene 4D Gaussian reconstruction. \nOur framework consists of several newly designed modules: Sparse Diagnostic Attribution (SDA) identifies sparse high-residual regions and decomposes errors into motion, geometry,\
    \ visibility, and static-dynamic assignment factors; Dynamic Diagnostic Prototype Memory (DPM) and Prototype Online Purification (POP) allow human-readable diagnostic prototypes to automatically emerge, evolve, and be purified from long-term optimization behavior without predefined templates; Prototype-Guided Correction Gate (PGCG) and Render-Safe Guard (RSG) convert matched prototypes into render-safe correction signals; and Lightweight Structural Modulation (LSM) transforms these signals into lightweight structural modulation for Gaussian densification, pruning, opacity adjustment, and scale regularization. \nTogether, these modules form a closed-loop diagnosis-memory-correction framework. \n\nExperiments show IESC-4DGS provides human-readable explanations of failure modes, prototype evolution, and correction behavior, while maintaining competitive reconstruction quality and rendering efficiency. \nThe results demonstrate the proposed framework bridges diagnostic interpretability and\
    \ high-performance 4DGS reconstruction."

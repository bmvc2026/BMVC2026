- paper_id: CBTKHDlBvW
  number: 1230
  status: Accept (Poster)
  title: 'KGRF-Seg: Knowledge-Guided One-Step Rectified Flow Model for Medical Image Segmentation'
  authors:
  - Yunfan Liu
  - Hengyue Bi
  - Tian Xia
  - Wei Pang
  - Chengjia Wang
  abstract: 'Recent advances in latent generative models (LGMs) for image and video synthesis have motivated generative formulations of medical image segmentation, offering an effective avenue for structured mask modeling and efficient inference. However, two potential limitations remain: representation mismatch arising from natural-image pretraining and the possible attenuation of fine spatial details due to latent compression. To address these challenges, we propose a Knowledge-Guided one-step Rectified Flow model for medical image Segmentation (KGRF-Seg), which integrates task-intrinsic knowledge into the conditional velocity field in a structured manner. At the target level, KG-Space adopts a bounded signed distance function (SDF) target representation to explicitly encode geometric information and provide a better-conditioned target for endpoint estimation. At the image level, KG-UNet derives low-level visual priors from the input image and injects them into the velocity predictor through
    multi-scale gated modulation. This design provides task-relevant spatial guidance while avoiding dependence on external representations. At the endpoint level, KG-Flow exploits the affine endpoint relation induced by rectified-flow coupling and applies metric-aware endpoint supervision, thereby aligning generative velocity-field learning with a discriminative segmentation objective. By exclusively leveraging task-intrinsic knowledge, KGRF-Seg supports memory-efficient pixel-space training and one-step inference without requiring an external latent backbone. Experiments on five datasets spanning multiple medical imaging modalities show that KGRF-Seg achieves competitive segmentation performance with only 4.6 M parameters and promising cross-dataset generalization on breast ultrasound.'

- paper_id: aC85l7YEdi
  number: 780
  status: Accept (Poster)
  title: 'UniFaceTalk: Universal One-Shot 3D Talking-Head Synthesis via Motion-Disentangled Gaussian Splatting'
  authors:
  - Fang Liu
  - Zhaoxu Sun
  - Hanlin Yan
  - Ran Zuo
  - Linlin Yang
  abstract: Generating lifelike 3D talking heads from a single portrait remains a challenging problem due to the need for consistent identity preservation and temporally stable motion generation. Recent progress in 3D-aware generative modeling, especially with 3D Gaussian Splatting (3DGS), has enabled high-quality rendering and efficient representation. However, existing methods often rely on multi-view supervision or subject-specific tuning, which limits their generalization and introduces temporal artifacts. We introduce UniFaceTalk, a one-shot 3DGS-based framework for universal talking-head synthesis driven by either audio or video. UniFaceTalk directly predicts motion-disentangled FLAME parameters from driving inputs and jointly optimizes them with the 3DGS rendering objective. Instead of relying on noisy per-frame optimization at inference time, the learned predictor provides a rendering-consistent motion prior, which reduces frame-wise instability while preserving identity-specific
    appearance details. This eliminates the need for explicit 3D face reconstruction during inference, resulting in temporally coherent animations that preserve facial identity and fine-grained details. To further enhance realism and cross-domain robustness, we propose a joint learning paradigm that fuses FLAME-based motion priors with hierarchical source appearance features, guiding 3DGS learning in a spatially aligned and identity-consistent manner. Experiments show that UniFaceTalk achieves superior visual fidelity, temporal stability, and identity preservation compared to state-of-the-art approaches, while demonstrating strong generalization across unseen identities, stylized avatars, and facial-like non-human avatars.

- paper_id: t8IkyOAJkR
  number: 1243
  status: Accept (Poster)
  title: 'BlobBoards: Robust Markers for Accurate Pose'
  authors:
  - James Pritts
  - Till Sittart
  - Hendrik Sauer
  - Silja Janßen
  - Felix Seegräber
  - David Nakath
  - Kevin Köser
  abstract: "We propose BlobBoards, a fiducial marker system comprising a dense, multi-scale\nfield of Gaussian blobs and a feature-based pipeline for joint detection, identification, and\npose estimation. Each board is registered from hundreds of blob features whose dense\nspatial coverage constrains pose, while multiple scales preserve detectability across large\nchanges in focal length, distance, and obliquity. Learned local descriptors are matched\nto the reference pattern and spatially verified, so the correspondences determine pose\nand certify identity. Against motion-capture ground truth, BlobBoards achieve median\ntranslation errors of 3.6–5.0 mm, reducing AprilTag’s median translation error by 89%\non small boards and 70% on large ones. They also produce far fewer large-rotation \nfailures than state-of-the-art tag systems. BlobBoards achieve the highest detection rate,\n80% versus 74% for AprilTag and 58% for ArUco, with the largest margin on the smallest\nmarkers. Under 50% occlusion,\
    \ they still detect 69% of boards with essentially unchanged\nmedian translation error, while AprilTag and ArUco detect none. In experiments\nBlobBoards give state-of-the-art detection rate, pose accuracy and occlusion robustness."

- paper_id: BHKbLl6lxs
  number: 907
  status: Accept (Poster)
  title: 'CoCam4D: Geometry-Aware Cooperative 4D Perception for Camera-Only Autonomous Driving'
  authors:
  - Soham Pahari
  - Sudip Das
  - Arindam Das
  - Ujjwal Bhattacharya
  abstract: Autonomous vehicles often suffer from limited perception due to occlusions, blind spots, limited sensor range and complex nature of the surroundings. Multi-agent collaborative perception (CP) addresses these challenges by allowing vehicles to share sensory information seamlessly and reconstruct the scene. However, camera-only perception remains fundamentally restricted due to uncertain nature of the distance-dependent monocular depth. We propose CoCam4D, a Bayesian framework for collaborative perception that explicitly models geometric uncertainty. It uses a VGGT-based feedforward network to generate 3D Gaussian scene representations with uncertainty estimates, helping multiple vehicles or agents to combine their observations efficiently. By sharing compact Gaussian primitives, reliable observations from one agent reduces the limitation of depth uncertainty in another without requiring LiDAR sensor data. To support real-world deployment, we introduce Dynamic Object Primitives
    (DOPs), a compact 35-byte representation for efficient C-V2X communication. Extensive experiments show that our proposed metho consistently outperforms recent vision-only methods, achieving improvements of 11.48% on OPV2V+ and 10.62% on DAIR-V2X-C, suggesting a promising geometrically grounded direction toward LiDAR-free autonomous driving.

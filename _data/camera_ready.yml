- paper_id: Q06ZuWSrYT
  number: 511
  status: Accept (Poster)
  title: Controllable Optimizable Gamma Correction as Efficient Image Luminance Adapter
  authors:
  - Yimu Yang
  - Jiaming Chen
  - Zhenzhong Feng
  - Zhenyuan Yang
  abstract: Low-light images captured under complex ambient lighting and sensor variations frequently suffer from severe under- and over-exposure distortions, degrading visual quality and impairing the performance of downstream vision tasks. Existing state-of-the-art methods rely on heavy neural networks and complex training schemes to mitigate illumination and color shifts, leading to low inference efficiency, poor edge deployability. The one-size-fits-all enhancement paradigm leads to a limited adaptability across diverse real-world scenarios. In this paper, we target controllable, efficient, and generalizable low-light image enhancement and exposure correction, and propose an ultra-lightweight framework named Controllable Optimizable Gamma Correction (COGC), with only 0.13K parameters. COGC explicitly models the luminance distribution gap between degraded inputs and ideal well-lit images, utilizing interpretable hyperparameters and neural-encoded optimizable gamma mapping to iteratively
    rectify image illumination toward task-optimal states. To support flexible cross-task adaptation, we further introduce a task-oriented hyperparameter search strategy to determine optimal COGC control configurations for different low-level enhancement and high-level perception tasks. Extensive experiments on diverse benchmarks demonstrate that COGC achieves strong generalization ability and adaptability across unseen scenes and varying resolutions, delivering consistent and competitive enhancement performance in both simple low-resolution and complex high-resolution real-world scenarios.

- paper_id: PS8yZH0Nhh
  number: 40
  status: Accept (Poster)
  title: 'CR-JEPA: Cross-Modal Joint-Embedding Predictive Learning for Remote Sensing Image Retrieval'
  authors:
  - Md Aminur Hossain
  - Ayush V Patel
  - Nitant Dube
  - Biplab Banerjee
  abstract: Cross-modal remote sensing image retrieval aims to retrieve semantically related scenes across heterogeneous sensing modalities. This remains challenging because paired observations may differ substantially in imaging physics, spatial resolution, spectral configuration, and visual appearance. Moreover, a single retrieval projection trained with one objective may be insufficient to jointly support cross-modal semantic alignment and same-modal neighbourhood preservation. We propose CR-JEPA, a Cross-modal Retrieval Joint-Embedding Predictive Architecture tailored to heterogeneous dual-modality remote sensing retrieval. The model uses modality-specific stems, a shared transformer trunk, and JEPA-style predictive objectives to estimate masked latent target features within and across modalities. Inspired by LeJEPA, we apply Sketched Isotropic Gaussian Regularization to raw retrieval projections to stabilize embeddings and mitigate collapse. CR-JEPA further employs a decoupled-head
    design with a unified retrieval head for same-modal retrieval and a cross-modal retrieval head for cross-modal search. We evaluate CR-JEPA on BEN-14K, CBRSIR\_VS, and DSRSID. On BEN-14K, CR-JEPA improves S1$\rightarrow$S2 retrieval from 61.23\% to 75.82\% and S2$\rightarrow$S1 retrieval from 63.73\% to 75.40\% over X-JEPA, while also achieving competitive same-modal retrieval with fewer parameters than X-JEPA.

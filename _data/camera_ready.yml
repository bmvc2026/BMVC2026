- paper_id: Bik4q3Ok7r
  number: 541
  status: Accept (Poster)
  title: 'TAP-Out: Tracking Any Point in 360 via Out-painting'
  authors:
  - Finlay G C Hudson
  - James A D Gardner
  - William A P Smith
  abstract: Tracking points that leave the camera's field of view (FoV) requires reasoning about unobserved scene dynamics, a fundamentally different problem from tracking visible correspondences. We present TAP-Out, an offline method that makes this out-of-view (OOV) reasoning explicit by leveraging generative video outpainting as a world-model prior. Given a narrow-FoV input video, TAP-Out outpaints a complete 360 degree equirectangular video, locates target objects within the panoramic scene via video object segmentation, and synthesises object-centred perspective crops on which standard in-frame trackers operate. This decoupled design composes off-the-shelf foundation models without requiring task-specific architectural modifications. On the TAPVid360 benchmark, TAP-Out achieves state-of-the-art performance, improving OOV tracking accuracy by approximately 3 times over the best prior method. We demonstrate its flexibility on out-of-frame object segmentation and detection and we provide
    detailed diagnostic analyses across motion regimes, static versus dynamic content, and hallucination quality, characterising when and why the approach succeeds or fails.

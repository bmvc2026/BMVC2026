- paper_id: Y9sWCSwQJ3
  number: 1051
  status: Accept (Poster)
  title: 'BUSTER: Adaptive Sampling for VLM-guided Unsupervised Video Anomaly Detection'
  authors:
  - Deok-Hyun Ahn
  - Yonghun Choi
  - Jae-Ho Han
  - Ig-Jae Kim
  - Haksub Kim
  abstract: 'Vision-Language Models have shown strong promise for video anomaly detection, but applying them to long surveillance streams remains computationally impractical. Sparse uniform sampling further suffers from temporal aliasing and can miss short-lived anomalies, while many existing approaches also depend on expensive human supervision. We address these limitations with BUSTER, a label-free framework that distills VLM knowledge into a lightweight streaming detector for adaptive video anomaly detection. BUSTER follows a Scout-and-Burst policy: a lightweight student monitors the stream in Scout mode at low frame rate and selectively switches to Burst mode for dense inspection only around anomaly candidates. To make this possible without manual labels, we mine semantic pseudo-labels from a VLM teacher and train the student with a rank-aware distillation objective that preserves relative anomaly severity rather than only matching absolute scores. This design enables VLM-guided behavior
    during continuous monitoring without incurring VLM-level cost on the full stream. Experiments on UCF-Crime and ShanghaiTech show that BUSTER achieves state-of-the-art performance among unsupervised methods, matches dense fixed-rate processing while using only 53.2 percent of frames, runs at 496.7 FPS corresponding to 16.6 times real time at 30 FPS, and supports on-demand segment-level explanations through burst-triggered VLM reasoning. These results show that adaptive distillation can make label-free VLM-guided anomaly detection both efficient and practical for real-world surveillance.'

- paper_id: AjIgTgeip3
  number: 967
  status: Accept (Poster)
  title: 'From Patches to Pixels: Dual-Branch Prompt Learning for Hyperspectral Scene Generalization'
  authors:
  - Vivekananda Giri
  - Ushasi Chaudhuri
  - Biplab Banerjee
  abstract: |-
    Cross-scene hyperspectral image classification is fundamentally challenged by spectral shift underpinned by sensor variability, atmospheric conditions, and temporal changes. Domain adaptation methods require target scene data, while language-guided generalization approaches depend on handcrafted descriptions with full encoder fine-tuning, both fail to exploit the scene-agnostic representations of large-scale pretrained vision-language models. Moreover, no existing prompt learning method simultaneously exploits patch-level spectral-semantic context and pixel-level spatial detail for cross-scene hyperspectral transfer. We propose HyperPrompt, a dual-branch patch-to-pixel framework based on prompt adaptation of a frozen vision–language encoder (CLIP) and a frozen segmentation encoder (SAM-2), unifying CLIP patch tokens for global spectral-semantic grounding with frozen SAM-2 pixel tokens for fine-grained spatial fidelity, enabling scene-agnostic generalization without any backbone end-to-end fine-tuning. A Token-wise Cross-Scale Distillation Module (TCDM) directs semantic knowledge flow from patch to pixel tokens; a Prompt-Conditioned Low-Rank Adapter (PCLRA) with Hierarchical Orthogonality Regularization dynamically conditions each text encoder on its own prompt semantics during training while enforcing complementary branch specialization; and a Gated Product-of-Experts (GPoE) fusion demands joint expert confidence to sharpen predictions under spectral shift. Extensive experiments on Houston, Pavia, and HyRank demonstrate that HyperPrompt consistently outperforms state-of-the-art scene generalization and spectral foundation model methods across all evaluation metrics, achieving average AA gains of +6.62% and +10.59% over patch-only and pixel-only baselines on Houston, +10.07% and +7.56% on Pavia, and +5.59% and +4.73% on HyRank, with particularly pronounced improvements under class-imbalanced and
    low-source conditions

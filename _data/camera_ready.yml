- paper_id: mChKYXzgpU
  number: 463
  status: Accept (Poster)
  title: 'Scaling Supervision with Foundation Models: Coarse-to-Fine Learning for Generalizable Retinal Vessel Segmentation'
  authors:
  - Jingyao Zhu
  - Mingzhi Xu
  - Wenbo Zhang
  - Yizhe Zhang
  - Tao Zhou
  - Qiang Chen
  abstract: 'Retinal vessel segmentation models often suffer from poor cross-domain generalization because expert annotations are scarce and source datasets cover only a narrow range of imaging devices, acquisition protocols, and patient populations. We propose a scalable foundation-model-guided coarse-to-fine framework that converts diverse unlabeled fundus images into scalable, task-aware supervision for generalizable retinal vessel segmentation. In the coarse stage, a segmentation network is pre-trained on 8k auxiliary fundus images pseudo-annotated by a multimodal generative foundation model using a single text prompt, requiring no manual spatial prompts or post-processing. This stage learns broad vascular structure from domain-diverse unlabeled data, but the generated pseudo-masks may still miss thin vessels and contain local boundary noise. To address these limitations, the fine stage introduces a feature-guided refinement network trained with limited expert labels. The refinement
    network fuses the grayscale image, the coarse vessel probability map, and high-dimensional decoder features from the coarse network, and predicts residual corrections in logit space to recover fine vascular topology. Extensive experiments across six public retinal vessel segmentation benchmarks demonstrate strong cross-dataset robustness in region overlap, topological continuity, and boundary precision. Under the challenging DRIVE-source setting, our method improves the best semi-supervised baseline from 60.68 to 79.53 Dice and reduces HD95 from 19.24 to 3.33. A pre-training analysis further shows that the gain is not merely due to using more unlabeled data: generic MAE pre-training improves boundary stability, but remains limited in preserving vessel topology compared with foundation-model pseudo-supervision. Code and data are available at \url{https://github.com/ZJY226/fm-rvs}.'

- paper_id: JqIjRu2XMI
  number: 1701
  status: Accept (Poster)
  title: Exploring Adversarial Robustness and Safety Alignment in Multilingual Multi-Modal Large Language Models
  authors:
  - Hashmat Shadab Malik
  - Muzammal Naseer
  - Salman Khan
  abstract: "Multimodal Large Language Models (MLLMs) integrate visual perception into language reasoning, \nbut in doing so they introduce a continuous attack surface that is susceptible to adversarial attacks. \nAlthough prior works have examined their robustness, \nmost evaluations are restricted to English-centric tasks, \nleaving behaviour in multilingual settings unexplored. \nWe address this gap through a systematic study of adversarial robustness and multimodal safety \nacross 12 typologically diverse languages. \nWe primarily evaluate representative open-source MLLMs that acquire multilingual capability \nthrough multimodal instruction tuning. \nOur results on gradient-based adversarial attacks reveal a transferable multilingual vulnerability, \nwhereby adversarial images optimized in one language continue to induce failure when evaluated in others, \ndemonstrating strong cross-lingual transferability. \nOur safety analysis further shows that multilingual safety behaviour varies\
    \ across languages \ndepending on how effectively a model can retrieve or interpret harmful instructions. \nWhen harmful intent is issued through the textual modality, \nlanguages with stronger linguistic grounding are more likely to elicit misuse-enabling responses, \nwhile weaker languages produce far fewer unsafe outputs. \nSimilarly, when the harmful query is embedded in the vision modality as typographic content, \nEnglish scripts are reliably recognised and followed, \nwhereas non-English scripts are rarely parsed by the vision encoder. \nLower-resource languages and non-English scripts may therefore appear safer in both channels, \nbut this apparent robustness is an artefact of comprehension and visual-grounding failures \nrather than genuine safety alignment, a phenomenon we term safety-by-failure. \nIn contrast, MLLMs\nthat build multilingual capability throughout their training stages \nrather than only at instruction tuning, such as Qwen3-VL, \nexhibit genuine cross-lingual\
    \ safety, maintaining active refusal \nacross languages rather than masking comprehension failure. \nTogether, these findings highlight that shallow multilingual adaptation, \nsuch as fine-tuning just on translated instruction data, \nmay produce surface-level multilingual understanding \nthat creates illusory safety in low-resource languages; \na deeper integration of multilingual capability across training stages \nleads to more genuine multilingual understanding and safety alignment.\nOur code and benchmark adapted for the multilingual setting will be made publicly available."

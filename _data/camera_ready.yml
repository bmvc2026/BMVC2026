  - Sangtae Ahn
  - Khan Muhammad
  abstract: 'Robust deployment of gesture-driven interfaces hinges on a brittle front-end **hand-versus-non-hand** pre-filter. Existing gesture corpora optimize positive-class diversity but supply only incidental negatives, leaving deep models prone to overconfident false activations on visually confusing distractors (faces, electronics, indoor clutter). We address this gap with a **benchmarking and beyond** paradigm. We introduce **HNH40K**, a balanced RGB benchmark of 40,448 images at $192{\times}160$ from 40 subject-disjoint participants, equipped with a three-tier risk-aware negative taxonomy. Profiling 16 backbones (CNN, Transformer, SSM, SNN) at four scales exposes severe calibration errors and FPR divergence hidden by standard gesture data. We then propose a **Cascaded Risk-Aware Filter** that achieves computational asymmetry: a lightweight CNN stem rapidly handles easy negatives, while a conditional Transformer Structural Scrutinizer resolves structural ambiguities on a confidence-gated
    hard tail. We optimize the cascade using a new Risk-Weighted Focal Loss (RWFL) that anchors the dataset’s risk taxonomy directly in the gradient. At 0.159M parameters and 0.076G FLOPs, our filter attains 99.95\% accuracy, ROC-AUC 99.99\%, FPR $5{\times}10^{-4}$, and a $0.45\%$ drop under high-risk distractors at 837~FPS-dominating every benchmarked backbone.'

- paper_id: udJckuI99k
  number: 879
  status: Accept (Poster)
  title: Quality-Preserving Online Streaming Dynamic Gaussian Splatting
  authors:
  - Jinle Li
  - Wei Ye
  - Rui Fan
  - Peng Yun
  abstract: 'Physics-principled dynamic Gaussian Splatting learns motion dynamics from video sequences. It equips Gaussian representations with physical information for short-term future prediction. However, directly extending it to the online streaming setting causes progressive reconstruction quality degradation along the sequence. This degradation stems from two factors: (1) large inter-frame motion, occlusion, and newly appearing structures that hinder accurate Gaussian propagation; (2) rapid appearance changes that cause drift in Gaussian appearance attributes. In this paper, we propose an online streaming dynamic Gaussian Splatting framework built on TRACE''s physics-principled motion propagation. We introduce per-frame Gaussian appearance attribute updates to address rapid appearance, color, and illumination changes. We also introduce an intra-frame densification and pruning approach, carrying densified Gaussians to subsequent frames, to address large inter-frame motion and newly
    appearing structures. The experiment results on both the Dynamic Object and Dynamic Indoor Scene datasets show reduced degradation along the sequence and effective short-term future frame prediction.'

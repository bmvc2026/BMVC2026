- paper_id: DohFaEBaAk
  number: 811
  status: Accept (Poster)
  title: Foundational feature fusion for conditional flow matching in 6D pose estimation
  authors:
  - Amir Hamza
  - Davide Boscaini
  - Fabio Poiesi
  abstract: |-
    Conditional flow matching has enabled a step forward in object 6D pose estimation, achieving state-of-the-art performance by progressively denoising and registering object representations to observed scenes.
    Existing methods require training task-specific encoders supervised on object-scene overlap and rely on trivial feature fusion strategies to resolve pose ambiguities.
    We present FunFlow6D, a novel flow matching-based formulation that leverages features from geometric and appearance foundation models for pose estimation, eliminating the need for task-specific encoder training.
    We also introduce a cross attention-based fusion mechanism that dynamically combines geometric and appearance features to provide richer conditioning for the flow matching module.
    Experiments on four datasets from the BOP benchmark show that FunFlow6D outperforms the previous state of the art while reducing supervision requirements and memory overhead.
    Extensive ablations validate the contribution of each proposed component.
    Project website: https://tev-fbk.github.io/FunFlow6D/

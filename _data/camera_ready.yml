- paper_id: JpMpQzVUku
  number: 1065
  status: Accept (Poster)
  title: Dynamic Regularization for Adaptive Conformal Prediction in Deep Image Classifiers
  authors:
  - Navid Akhavan Attar
  - Hesam Asadollahzadeh
  - Ling Luo
  - Uwe Aickelin
  abstract: 'Conformal prediction provides distribution-free prediction sets with coverage guarantees. These sets are built using a nonconformity score that orders labels by how well they fit an input. In deep image classifiers, Adaptive Prediction Sets (APS) use this idea to give small sets for easy images and larger sets for hard ones, signaling uncertainty to the user. However, APS can still yield sets that are too large. Regularized APS (RAPS) reduces this by adding a rank-dependent penalty to low-ranked labels. Although this total penalty depends on label rank, its per-rank regularization strength is globally fixed: after the onset rank, each additional tail rank incurs the same penalty for every input. In this work, we propose dynamic regularization that makes this per-rank strength sample-dependent. We derive it from the Helmholtz free energy of the network’s logits by reinterpreting a standard classifier as an energy-based model, and optionally refining this signal through an energy-based
    fine-tuning stage. The result tightens sets for confident inputs and relaxes them for uncertain ones, improving adaptiveness while preserving the coverage guarantee. We implement dynamic regularization in RAPS and SAPS, yielding DRAPS and DSAPS, in which the global penalty coefficient or step size is replaced with a sample-dependent value. Our experiments across multiple vision datasets and architectures demonstrate that dynamic regularization lowers average set size and improves difficulty-aware behavior compared with state-of-the-art nonconformity scores.'

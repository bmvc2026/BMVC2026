- paper_id: aoSfyM7FO6
  number: 172
  status: Accept (Poster)
  title: 'Neural Residual Maps: Proposal-Level False Positive Suppression for Fixed-Camera Object Detection'
  authors:
  - Ahmed Hassan
  abstract: Fixed-camera detectors suffer from persistent false positives on static clutter. A recent frame-level background-embedding baseline applies a single global penalty to every detection in the frame, but this global signal becomes brittle on stronger CNN backbones and transformer detectors because it cannot separate true and false proposals within the same image. We introduce Neural Residual Maps (NRM), a gradient-free proposal-level rescoring method. After a short warm-up, NRM stores an exponential-moving-average background prototype at one detector feature stage, computes a dense $L_2$ residual map at inference, pools residual inside each detected box, and penalizes boxes whose local features match the background. On LLVIP, across YOLOv8s, YOLO11m, and RT-DETR-L, NRM changes mAP by only $+0.56$, $-0.03$, and $+0.05$ while improving P-AUC by $+3.58$, $+1.75$, and $+9.50$; the stability gain over the frame-level baseline is clearest on YOLO11m and RT-DETR-L. Reusing the same detector-level
    operating point on a static subset of MOT17, WildTrack, and a UA-DETRAC vehicle stress test shows that proposal-local residualisation remains useful without scene-specific retuning while making the transfer boundary explicit. NRM adds only $10$--$21$\,ms per frame and runs at $12$--$34$\,FPS on a single T4 GPU, without online optimization, detector fine-tuning, or new labels.

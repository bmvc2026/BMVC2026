- paper_id: zS15Xe4KxG
  number: 1469
  status: Accept (Poster)
  title: 'BasketEvent: Understanding Who Did What and When in Basketball Videos'
  authors:
  - Yu Zhang
  - Jiayuan Rao
  - Haoning Wu
  - Weidi Xie
  abstract: "Comprehensive basketball video understanding requires resolving not only what event occurs, but also who is responsible and when the key evidence appears. \nHowever, existing methods typically treat spatial perception and semantic recognition as isolated tasks, failing to ground events to individual players or pinpoint their temporal boundaries within complex collective dynamics. \nTo bridge this gap, we introduce BasketEvent, a player-centric basketball event understanding dataset curated from real NBA broadcasts. \nIn BasketEvent, event labels are grounded to the responsible players, and a manually annotated subset of 1,000 samples with precise event intervals is provided to evaluate temporal evidence localization. \nBased on this data, we propose PlayNet, a player-centric reasoning framework that maps basketball videos to player-level event predictions with temporal evidence. \nConcretely, PlayNet tracks key entities, associates player identities, and reasons about events\
    \ by modeling player-player, player-ball, and global court interactions, while aggregating sparse temporal evidence via gated pooling. \nExtensive experiments demonstrate that PlayNet significantly outperforms representative video-level and crop-based baselines, proving the superiority of player-centric modeling for fine-grained sports video understanding. \nOur data, code, and models will be made publicly available."

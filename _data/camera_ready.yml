- paper_id: 7uVFtw13zx
  number: 1245
  status: Accept (Poster)
  title: 'TCD: Timestep-wise Contrastive Denoising for Condition-Faithful Diffusion'
  authors:
  - Hai-Long Nguyen
  - Duc Viet Le
  abstract: Conditional diffusion models are typically trained with a mean squared error (MSE) denoising objective. This objective does not enforce a lower bound on the dependence of predicted noise on the conditioning signal c, which permits models to achieve low MSE while remaining insensitive to c. As a result, conditioning fidelity is learned only indirectly. We address this limitation by proposing Timestep-wise Contrastive Denoising (TCD), which applies an InfoNCE loss at each denoising step. TCD uses noise predictions under alternative conditions as negatives to enforce contrastive separation along the conditioning axis. The method does not require an external teacher, architectural modifications, or additional inference computation, since the projection head is removed after training. We evaluate TCD using the Conditioning Gap Ratio (CGR), defined as the ratio of denoising error under mismatched and true conditions. We prove that minimizing the TCD loss increases a lower bound on
    the conditioning gap, CGR-1. Empirical results show that TCD more than doubles the conditioning gap on Stable Diffusion v1.5 (average 2.21 times increase) and improves performance across all T2I-CompBench categories. TCD achieves the highest ranking in four of six categories, with the largest gains in attribute binding, consistent with theoretical expectations.

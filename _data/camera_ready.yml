- paper_id: D7tcEZsaNJ
  number: 1536
  status: Accept (Poster)
  title: Selective Prior-Conditioned State-Space Model for Remote Sensing Change Detection
  authors:
  - Yosra Naceur
  - Mariem Zaouali
  - Sonia Bouzidi
  abstract: To monitor Earth's surface modifications, high-resolution imagery provides rich details but suffers from spectral heterogeneity, complicating the distinction between relevant changes and noise. While Deep Learning models, particularly U-Net architectures, have advanced semantic feature extraction, they often struggle with edge integrity and the 'internal holes' phenomenon. Guided change detection and attention mechanisms improve focus but incur severe quadratic computational complexity. To address these limitations, we propose the Selective Prior-Conditioned State-Space Model (SPC-SSM), which fundamentally refactors multiscale feature fusion. Instead of naive concatenation or heavy self-attention, SPC-SSM leverages deep semantic features to generate change prior that directly condition a State-Space Model (Mamba). By guiding state transitions, our SSM dynamically fuses multi-scale features under strictly linear computational complexity. This prior-guided continuous fusion overcomes
    receptive field constraints and captures robust long-distance pixel dependencies. Extensive experiments across three major datasets confirm that SPC-SSM significantly improves discriminative power, achieving superior precision and stability with a 10.5\% speedup over the CGNet baseline, effectively capturing complex change patterns in remote sensing scenarios.

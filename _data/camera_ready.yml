- paper_id: jr6WXtVmp9
  number: 1647
  status: Accept (Poster)
  title: 'SPDistill: Sparse Pruning-Aware Distillation for Efficient 3D Small Object Detection'
  authors:
  - Lin Qian
  - Lintao Xiang
  - Zhenghao. Li
  - Hongpei Zheng
  - Hujun Yin
  abstract: Channel compression and dynamic spatial pruning reduce the cost of sparse 3D detectors, but their interaction can remove the few active voxels that support a small object before proposal generation. We study a student whose channel width is fixed before training; dynamic pruning denotes spatial selection of active coordinates, rather than channel pruning. We propose SPDistill, a pruning-aware knowledge distillation framework that follows this sparse information flow. Sparse Parameter Initialisation provides a compatible starting point, Scale-Aware Pruning-Policy Distillation transfers pre-head retention responses, and Scale-Aware Proposal Distillation transfers object-balanced classification and geometry-validated box responses after the head. On ScanNet, SPDistill improves the front-preserved 1/4-channel student by +4.40% AP@0.25 and +3.73% AP@0.50, while using 9.3% of the teacher sparse FLOPs and running 1.76× faster. On the small-object-heavy TO-Scene benchmark, the corresponding
    gains are +5.59% and +5.17%. These results show that supervising spatial pruning as well as proposal responses recovers accuracy without changing the student at inference.

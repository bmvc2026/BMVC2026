- paper_id: xO2rYKwBPz
  number: 1629
  status: Accept (Poster)
  title: 'GRCD: Grounded Region Change Detection for Multi-Finding Chest X-Ray Pairs'
  authors:
  - OFM Riaz Rahman Aranya
  - Peyman Najafirad
  - Kevin Desai
  abstract: Radiologists routinely compare current and prior chest X-rays to track disease progression, producing follow-up reports that describe multiple findings, each localised to an anatomical region and annotated with a temporal change status. Existing automated methods either generate reports from a single image without modelling temporal context, or incorporate temporal information but do not ground their outputs spatially. The few approaches that combine temporal reasoning with spatial grounding are restricted to single-finding descriptions, leaving multi-finding reports with mixed change directions unaddressed. We present GRCD, a framework for grounded report generation from chest X-ray pairs in the multi-finding setting. We first construct a rigorously cleaned dataset of temporal chest X-ray pairs by identifying and correcting two systematic labelling errors in the source annotations. We then introduce a Region-Guided Change Token module that encodes per-region temporal change
    across anatomical structures and injects this signal into a language model through a dual-pathway strategy combining prepended spatial tokens with gated cross-attention. On a multi-finding test set, GRCD substantially outperforms existing SOTA across all text generation, clinical accuracy, and change detection metrics, with consistent results across three training seeds. We further show that each proposed component is essential for multi-finding generation.

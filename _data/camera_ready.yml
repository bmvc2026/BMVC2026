- paper_id: 80pqPKJvDT
  number: 763
  status: Accept (Poster)
  title: 'EgoMaize: A First-Person Maize Instance Segmentation Benchmark under Severe Field Occlusion'
  authors:
  - Jiayi Li
  - Zihan Zhang
  - Erhankang Yan
  - YiTian Chen
  - Yuze Li
  - Chengzhang Ding
  - JIANXIN CAO
  abstract: 'Close-range first-person field images are important for mobile maize phenotyping because many plant-level traits depend on in-canopy structures that are difficult to observe from overhead views. However, post-seedling maize fields create a difficult instance segmentation setting: stems, leaves, tassels, and neighboring plants are elongated, repetitive, and strongly occluded. We introduce EgoMaize, a compact benchmark for first-person maize instance segmentation, where the task is to predict ownership-consistent plant masks and plant-owned stem/tassel cues from close-range field images with severe same-class overlap. Existing visible-only labels can fragment one physical plant into disconnected supervision, while full-amodal labels may require unverifiable completion behind neighboring plants or field objects. EgoMaize therefore uses an evidence-closed annotation workflow for occluded maize regions and assigns unreliable maize regions to ignore rather than background. Baseline
    results show that boundary refinement, query-based grouping, and high-resolution crop refinement help different aspects of the task, but no architecture solves the coupled challenges of fine structure recovery, same-class instance ownership, and occlusion reasoning; occlusion-level analysis further shows that performance decreases as plant visibility becomes more limited. The dataset and code will be made publicly available upon acceptance.'

- paper_id: EgzsZTMOF5
  number: 1237
  status: Accept (Poster)
  title: 'Articulate3D: Zero-Shot Text-Driven 3D Animal Asset Posing'
  authors:
  - Oishi Deb
  - Ashkan Khakzar
  - Anjun Hu
  - Hirokatsu Kataoka
  - Philip Torr
  - Christian Rupprecht
  abstract: We propose a training-free method, Articulate3D, for controlling the pose of 3D animal assets via language. Despite advances in vision and language models, this task remains surprisingly challenging. To achieve this goal, we decompose the problem into two steps. We modify a powerful image-generator to create target images conditioned on the input image and a text instruction. We then align the rigged, skinned 3D mesh to the target images through a multi-view pose optimisation step. In detail, we introduce a self-attention rewiring mechanism (RSActrl) that decouples the source structure from pose within an image generative model, allowing it to maintain a consistent structure across varying poses. We observed that differentiable rendering is an unreliable signal for articulation optimisation; instead, we use keypoints to establish correspondences between input and target images. The effectiveness of Articulate3D is demonstrated across various 3D animal assets and free-form text
    prompts, successfully manipulating poses while preserving the original mesh identity. Quantitative evaluations and a comparative user study, in which our method was preferred in over 85% of cases, confirm its superiority over existing approaches.

- paper_id: bCkpXSEOiH
  number: 564
  status: Accept (Poster)
  title: 'Hessian-Guided Spatial Diversity: Boosting Adversarial Transferability via Weighted Curvature Suppression'
  authors:
  - Shubham Kumar
  - Chalavadi Vishnu
  - G Ramakrishna
  abstract: 'Identifying vulnerabilities in deep learning models through adversarial attacks, is highly effective if we craft the perturbations by relying on the transferability of the features to fool unseen target models. But, their effectiveness is limited by two complementary failure modes: overfitting to specific gradients of known models for perturbations, and convergence to sharp loss maxima that fails to generalize across architectures. Existing methods address these issues separately through input transformations or through flatness regularization. Exploitation of the interaction between transformation diversity and the local geometry of the loss landscape is less explored. We propose $\textbf{Hessian-Guided Spatial Diversity (HGSD)}$, a transferable attack that combines stochastic spatial input transformations with per-sample curvature-aware gradient aggregation. For each transformed variant of the adversarial example, HGSD estimates local loss curvature using a second-order finite-difference
    exploration, and aggregates the resulting gradients via softmin weighting. This proposed approach emphasizes low-curvature, transferable directions and suppresses sharp, specific gradients. We have evaluated the proposed approach on ImageNet-compatible benchmarks against both adversarial attacks, namely gradient-based and transformation-based methods. Experimental studies show that our attacks work on both CNN and Transformer-based models. HGSD outperforms strong gradient-based baselines by up to 10\% attack success rate, whereas it performs competitively against transformation-based benchmarks. This demonstrates that joint modeling of spatial diversity and geometry of the loss surface yields more transferable adversarial samples.'

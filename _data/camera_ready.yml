- paper_id: cTThxSv7QX
  number: 115
  status: Accept (Poster)
  title: 'HybridMamba: Hierarchical State-Space Temporal Encoding for Sub-Second Crash Localization in Surveillance Video'
  authors:
  - Ibne Farabi Shihab
  - Sanjeda Akter
  - Anuj Sharma
  abstract: 'Precise temporal localization of crashes in long surveillance video forces a state-space temporal encoder to handle three problems at once: maintaining state across content boundaries without unbounded error accumulation, representing dynamics across the three orders of magnitude that separate impact mechanics from traffic-flow context, and propagating long-range information across the resets that boundary-aware state management creates. Prior work addresses these in isolation, and we hypothesize that they interact super-additively in the long-form crash-localization setting. HybridMamba is designed to test this hypothesis. It pairs a SigLIP2 spatial encoder with a Mamba-2 state-space temporal backbone, adds Context Gating for hierarchical resolution allocation as a shared front-end, and introduces three Mamba-native state mechanisms (selective state reset, multi-timescale state heads, and summary Mamba cross-block compression) together with a Mixture Density Network localization
    head whose ninety-five percent intervals empirically cover ground truth on 96.1\% of test videos. On a 2,500-video Iowa DOT benchmark, HybridMamba achieves 1.22\,s mean absolute error with 72.8\% of predictions within one second of ground truth, a 37.4\% MAE reduction ($1.6\times$ lower MAE) relative to the strongest controlled same-pipeline baseline ($p{<}0.01$ in paired bootstrap over per-video errors). A full $2^3$ factorial ablation across the three state mechanisms reveals a three-way interaction effect of $+0.61$\,s ($p < 0.01$ over five seeds), an order of magnitude larger than any two-way interaction; this is the predicted signature of super-additive coupling among the three state mechanisms. From-scratch training on CADP (0.74\,s) and BDDA (0.71\,s) provides cross-dataset evidence that the architecture is not specific to Iowa DOT, interpreted with the caveat that label precision on those benchmarks is $\pm 0.42$\,s and $\pm 0.79$\,s respectively.'

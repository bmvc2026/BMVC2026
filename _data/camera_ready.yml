- paper_id: 2bVrTg1BXk
  number: 300
  status: Accept (Poster)
  title: 'Sub-actions in Action: Text-Guided Hand-Role Alignment for Sub-Action Recognition'
  authors:
  - Sadegh Rahmaniboldaji
  - Filip Rybansky
  - Quoc C. Vuong
  - Frank Guerin
  - Andrew Gilbert
  abstract: "Our objective is to enhance VLMs' ability to distinguish the roles of the left and right hands in egocentric actions. We introduce sub-action detection, a task that requires models to explicitly recognise the left‑ and right‑hand roles and their manipulated objects within an ongoing high‑level action. To address this challenge, we propose BiScopeNet, a framework that augments existing video‑LLMs without modifying their vision encoders or language models. BiScopeNet incorporates two components: FocusAlign, a gated text-guided \nattention-based module that selectively aligns video features with textual context to emphasise action-relevant cues, and MetaLoss, a masked, object-weighted loss that prioritises visually grounded terms.\nTo supervise sub‑action detection, we introduce BiScopeCap-100K, a large-scale video-level dataset curated from existing egocentric datasets, providing dense captions that jointly describe high‑level actions, left/right‑hand roles, and manipulated objects,\
    \ enriched with spatial metadata for grounding. Across the evaluated Video-LLM backbones, BiScopeNet improves action, hand-role, and object recognition over the corresponding supervised baselines, achieving the strongest aggregate performance among the evaluated configurations on BiScopeCap-100K. The project page is available at: https://andrewjohngilbert.github.io/BiScopeNet/"

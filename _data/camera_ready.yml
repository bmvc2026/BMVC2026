- paper_id: 9yHypgMBAz
  number: 126
  status: Accept (Poster)
  title: 'SignFML: Gloss-Free Sign Language Production via Multi-Scale Latent Flow Matching'
  authors:
  - Kieu Vo
  - Tho Quan
  abstract: Sign Language Production (SLP) aims to generate realistic signing motion from spoken text; however, it remains notoriously challenging due to the high dimensionality of pose sequences and the inherently one-to-many nature of sign language. While recent diffusion-based methods improve visual fidelity, they incur prohibitive computational costs and often suffer from temporal inconsistencies when operating directly in high-dimensional pose spaces. To address these limitations, we propose SignFML, a novel gloss-free framework that models sign motion within a compact latent space via conditional flow matching. By decoupling representation learning from generation, SignFML ensures stable training even under the low-resource regimes typical of SLP. Our architecture introduces a multi-scale flow mechanism with coarse-to-fine velocity decomposition to jointly capture global trajectory structures and fine-grained articulatory dynamics. Furthermore, an SLT Perceptual Loss explicitly enforces
    sentence-level linguistic fidelity through back-translation supervision. Extensive experiments on the PHOENIX-2014T benchmark demonstrate that SignFML establishes highly competitive performance among gloss-free methods, achieving a BLEU-4 of 12.58 and a WER of 81.51. Notably, our approach rivals strong gloss-conditioned baselines while requiring up to an order of magnitude fewer function evaluations (NFEs) than diffusion-based approaches.

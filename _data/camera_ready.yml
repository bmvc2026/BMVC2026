- paper_id: YEGY8FEBml
  number: 1360
  status: Accept (Poster)
  title: On Structured Disentangled Representation and the Limits of Global Scores
  authors:
  - Jorge Elías García
  - Roberto Valle
  - José Miguel Buenaposada
  - Luis Baumela
  abstract: 'Unsupervised disentangled representations learned by generative models are assumed to capture the underlying factors of variation and to provide useful features for downstream tasks. In this work, we analyze how factor information is organized within structured disentangled representations and how this organization is reflected by standard evaluation protocols. We first observe that the representations learned by a diffusion-based disentanglement model preserve factor-relevant information more consistently under dataset bias than standard discriminative backbones. We then investigate whether this reflects clean latent-unit specialization or instead a richer, yet more entangled, distribution of explanatory information. To assess this, we use a unit-level probing methodology to show that despite achieving strong scores on standard disentanglement metrics, individual latent units frequently retain information about multiple underlying factors, indicating that factor-relevant information
    can remain recoverable without being cleanly localized or specialized. Our analysis further reveals that latent-space structure, specifically the dimensionality and number of latent units, creates fundamental trade-offs between factor recoverability, redundancy, and localization. Yet these structural differences are only weakly reflected by PCA-based disentanglement metrics (e.g., FactorVAE and DCI). These findings expose a mismatch between disentanglement scores and the actual organization of structured latent spaces, highlighting the need to evaluate disentanglement directly on the original latent-unit structure. Code and trained models available at: https://github.com/pcr-upm/bmvc26_recognition'

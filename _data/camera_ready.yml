- paper_id: 0JUHBrxMcG
  number: 1046
  status: Accept (Oral)
  title: 'CANDLE: Test-Time Debiasing of CLIP Against Typographic Attacks by Suppressing Text-Spotting Bias'
  authors:
  - Yuki Hirohashi
  - Takayoshi Yamashita
  - Hironobu Fujiyoshi
  abstract: 'CLIP and CLIP-based models achieve strong zero-shot performance across various tasks, yet they remain vulnerable to an excessive reliance on textual cues in images. This vulnerability enables typographic attacks where pasted words steer predictions toward arbitrary labels. To defend against such attacks, we propose CANDLE, a test-time debiasing method. CANDLE is based on two observations: (1) in images, text typically appears in compact, localized regions; (2) CLIP tend to concentrate attention on text regions independent of the given prompt. From a single forward pass, CANDLE derives, bias-suppression masks that covers the text regions and injects a negative bias into the attention logits. This locally reduces sensitivity to text-like appearances and guides the model toward object-centric evidence. CANDLE operates only at inference and requires no additional training. On a benchmark across 10 synthetic and 3 real-world datasets, CANDLE consistently outperforms existing defenses,
    and achieves comparable improvements on real images. In zero-shot anomaly detection, it reduces text-overlay false positives and improves AUROC stability.'

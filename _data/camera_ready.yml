- paper_id: BA5YyUHg9M
  number: 152
  status: Accept (Poster)
  title: 'CoDehaze: Color-Driven Diffusion with Structured Haze Guidance for Image Dehazing'
  authors:
  - Chia-Hsin Chang
  - Yu-Chiao Cheng
  - Chiou-Shann Fuh
  - Jhih-Ciang Wu
  abstract: Restoring visually faithful clear scenes in real-world environments remains challenging due to spatially non-uniform haze, color distortion, and structural attenuation. Most existing methods formulate dehazing as a direct deterministic image-to-image mapping, which implicitly absorbs degradation modeling into a single restoration network and may lead to over-enhancement, unnatural color shifts, or inconsistent structural details. In this paper, we propose CoDehaze, a diffusion-based dehazing framework that reformulates image dehazing as a structured conditional latent restoration problem. Rather than using synthesized haze merely as data augmentation, CoDehaze leverages diffusion-based haze generation to construct structurally aligned haze-clean pairs, enabling degradation-aware restoration supervision. At the core of CoDehaze, we introduce a Color-Structured Denoising Guidance (CSDG) that persistently injects haze-aware conditioning throughout the iterative latent denoising
    process, allowing progressive refinement under degradation-aware guidance. To improve perceptual fidelity, we further propose Dynamic Color Adjustment (DCA), which provides color-aware conditioning and training regularization to improve chromatic consistency and mitigate color distortion, together with a Frequency-aware Condition Enhancer (FCE) that enhances the degraded condition by exploiting both global haze appearance and local structural details. Extensive experiments on real-world dehazing benchmarks demonstrate that CoDehaze achieves strong perceptual restoration performance, producing natural colors, clear visibility, and structurally consistent results with better perceptual consistency and robustness. Moreover, without additional fine-tuning, CoDehaze shows promising zero-shot transferability to weather degradation removal tasks, including desnowing and deraining, highlighting the generality of the proposed restoration formulation guided by degradation cues. Our code is available
    at https://github.com/u-chow/CoDehaze.

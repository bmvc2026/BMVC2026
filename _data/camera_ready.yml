- paper_id: 98b76wVejW
  number: 1675
  status: Accept (Poster)
  title: Privacy–Utility Tradeoffs in Remote Photoplethysmography from Facial Video
  authors:
  - Benjamin Sporrer
  - Patrick J. Flynn
  abstract: Remote photoplethysmography (rPPG) enables contactless estimation of physiological signals from facial video, but the same imagery used for cardiovascular sensing also contains identity-revealing biometric information. This creates a practical privacy--utility tradeoff in which facial regions informative for recognition may need to be obscured, potentially degrading physiological signal recovery. In this work, we investigate how simple facial de-identification operations affect identity information and rPPG utility. We evaluate 18 conditions comprising an unobfuscated baseline and 17 deterministic obfuscation variants across four families. The periocular family includes separate-eye and eye-bar variants using black occlusion and blurring, with regions either temporally smoothed or defined independently in each frame. The other families are nose-centered radial blurring, full-face Gaussian blurring, and full-face pixelation, each evaluated at three severity levels. Experiments
    are conducted on the PURE, UBFC-rPPG, DDPM, and MSPM datasets using the classical CHROM and POS methods and the neural network methods RPNet and TS-CAN. Identity information is evaluated using ArcFace embedding disruption and an identification diagnostic that compares clean gallery templates with obfuscated probe templates. Results show that localized periocular obfuscation can reduce identity similarity while generally producing small changes in heart rate mean absolute error (HR MAE). Broader obfuscation generally produces greater reductions in identity similarity, with full-face Gaussian blurring producing smaller increases in HR MAE than full-face pixelation. These findings provide a controlled benchmark for evaluating privacy--utility tradeoffs in rPPG from facial video.

- paper_id: eOSs2CcuA9
  number: 1157
  status: Accept (Poster)
  title: Dual-Domain Road Patch Attacks on Vision-Based 3D Lane Detectors
  authors:
  - Lixingli
  - Lei Shi
  - Weilin
  - Meng Li
  - Yufei Gao
  - yucheng shi
  - Yin Ma
  abstract: "Lane detection is a critical task in road-structure perception for autonomous driving. While recent models have advanced from 2D image-plane detection to 3D spatial reasoning, the robustness of vision-based 3D lane detectors against localized road-plane perturbations \nremains largely underexplored. To address this issue, we study adversarial road patch attacks on vision-based 3D lane detectors and propose a two-stage patch generation framework. The framework first learns a global attack pattern over the full patch region, and then \nrefines the effective area through contribution-based region selection to focus optimization on high-contribution regions. We further introduce Dual-Domain Gradient Optimization (DGO), which decouples low- and high-frequency gradient components to improve patch stability and attack effectiveness. Experiments on OpenLane-V1 with three representative 3D lane detectors show that current models are clearly vulnerable to road patch perturbations. Our\
    \ method reduces the F-measure of PersFormer from 0.647 to 0.353 and, across the three evaluated models, outperforms the strongest baseline optimization method by about 5.0\\% in average ASR."

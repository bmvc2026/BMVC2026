- paper_id: BN3ZsQG691
  number: 410
  status: Accept (Poster)
  title: A Plug-in Interpretation of Conditioning in Score-Based Diffusion Models
  authors:
  - LIBO CHEN
  - Souvik Ghosh
  - Teo Deveney
  - Chris Budd
  - Vinay P. Namboodiri
  abstract: "We propose a conditioning mechanism for diffusion models based on multi-speed joint diffusion of the target and the condition. \nThe mechanism learns an unconditional joint score network and enforces conditioning at inference via a plug-in correction term. \nThe plug-in term separates the conditioning contribution from the learned unconditional dynamics, offering a transparent view of how the condition steers generation of the target distribution.\nBuilding on this, we derive explicit conditional reverse-time SDEs and an approximation probability-flow ODEs, enabling principled and directly comparable conditional samplers. \nTo reduce the induced ODE-SDE discrepancy, we introduce a log-Fokker--Planck residual regularization that improves ODE sampling quality. Experiments on conditional image generation tasks demonstrate\ncompetitive performance and support the effectiveness of the plug-in\nconditioning view. Additional ODE--SDE comparison experiments show that the\nlog-Fokker--Planck\
    \ residual regularization improves deterministic ODE sampling."

- paper_id: n4XoSPmYtc
  number: 1005
  status: Accept (Poster)
  title: 'GARFIELD: Graph-Adaptive SSM for Explainable 3D Multi-Person WiFi Pose Estimation'
  authors:
  - Quang-Anh N.D.
  - Pham Minh Duc
  - Kok-Seng Wong
  abstract: WiFi-based human pose estimation has emerged as a privacy-preserving alternative to camera-based systems, utilizing Channel State Information (CSI) to capture body movements through walls and in low-light conditions. However, most existing approaches are limited to single-person scenarios and lack interpretability, hindering their deployment in real-world multi-person environments. In this paper, we propose GARFIELD, a lightweight framework for explainable multi-person 3D pose estimation from WiFi CSI signals. GARFIELD utilizes a State Space Model-based encoder to efficiently capture long-range temporal dependencies in CSI sequences, combined with a graph-based decoder that models skeletal joint relationships and inter-person interactions. To improve transparency, we introduce an explainability mechanism that attributes pose predictions back to CSI signal components. Experiments on multiple benchmarks demonstrate that GARFIELD achieves competitive performance in multi-person
    3D pose estimation while reducing model parameters by 91.1% over the state-of-the-art (4.3M vs. 48.2M) and providing interpretable insights into the model decision process.

- paper_id: HGZ4fF3A3C
  number: 549
  status: Accept (Poster)
  title: 'Beyond False Stability: High-Noise Drift Gating for Test-Time Adversarial Defenses in Vision-Language Models'
  authors:
  - Hashmat Shadab Malik
  - Muzammal Naseer
  - Salman Khan
  abstract: "Vision--language models (VLMs) such as CLIP demonstrate strong zero-shot generalization but remain highly vulnerable to adversarial attacks. While adversarial training can improve robustness, it is often computationally expensive, motivating defenses that operate at test time. Recent test-time approaches attempt to improve robustness by exploiting how CLIP's visual representations respond to stochastic perturbations. Some aggregate predictions across multiple noisy views, while others construct Gaussian noise-averaged anchors and interpolate vision features toward these anchors, or apply counter-perturbations to move adversarial inputs away from their visual feature representations. Although these strategies can improve robustness, they often degrade clean accuracy, leading to an unfavorable clean--robust trade-off.\nIn this work, we revisit stochastic test-time defenses and identify an underexplored noise-regime transition in CLIP's visual representation space. While recent\
    \ work has explored stochastic \nperturbations primarily in the weak-noise \nregime, where adversarial examples can \nappear unusually stable (false \nstability), our analysis shows that this \ncharacterization reverses as perturbation \nstrength increases: beyond the weak-noise \nregime, adversarial representations become \nmarkedly more unstable than clean \nones, yielding a substantially clearer \nseparation signal. This transition is consistent across uniform and Gaussian noise, photometric/geometric transformations, datasets, and \ndiverse attack objectives and perturbation \nbudgets. Moreover, the separation largely disappears in adversarially trained models, supporting the view that the phenomenon is tied to the fragile local-basin geometry of adversarial representations in non-robust CLIP models.\nMotivated by this finding, we propose a training-free, plug-in drift-gated mechanism that uses high-noise feature drift as a lightweight gating signal to selectively trigger existing\
    \ test-time defenses only when adversarial-like instability is detected. Evaluated across 13 downstream datasets, \nour approach consistently improves the \nclean--robust trade-off of existing \ntest-time defenses. Across eight fine-grained datasets, the \naverage of clean and adversarial accuracy \nimproves from 65.7% to 71.4% for \ncounterattack-style defenses and from 68.4% \nto 73.2% for noise-anchoring approaches; \non ImageNet and four distribution-shifted \nvariants, the corresponding gains are from \n56.1% to 66.2% and from 62.1% to 67.6%.\nOur code will be made publicly available."

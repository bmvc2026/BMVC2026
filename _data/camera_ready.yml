- paper_id: G4bwovJ6Qb
  number: 1744
  status: Accept (Poster)
  title: 'NeuroScope: Causal Probing of Sparse Brain-Token Interfaces in Frozen Diffusion Models'
  authors:
  - Chun-Mei Tseng
  - Jiahe Wang
  - Xinyao Zhang
  - Chun Yuan
  abstract: Brain-conditioned diffusion decoders can reconstruct viewed natural images from fMRI, yet reconstruction quality alone does not explain how a non-spatial neural signal controls a frozen text-to-image generator. We introduce NeuroScope, a causal probing framework for analysing the brain-token interface of frozen diffusion models. Through token knockout, content replacement, and spatial attention masking, NeuroScope measures which parts of the conditioning interface carry brain-derived control and where they are read out by the frozen generator. Applied to an NSD fMRI-to-image decoder built on frozen Stable Diffusion1.5, NeuroScope reveals that brain-derived control is sparse, layer-selective, and temporally concentrated rather than uniformly distributed. Control experiments show that this structure is neither a fixed property of the frozen generator nor a mask-processor artefact, but instead follows adapter-written content and requires matched brain signal. These findings provide
    a simple intervention-based route for understanding how non-text biomedical signals control frozen diffusion models.

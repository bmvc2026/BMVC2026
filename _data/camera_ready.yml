- paper_id: RPj9VfW2vI
  number: 1816
  status: Accept (Poster)
  title: 'BATS-Net: Boundary-Aware Token Selection for Text-Guided Ultrasound Image Segmentation'
  authors:
  - Rahul Bhardwaj
  - Utkarsh Yashwant Tambe
  - Debanga Raj Neog
  abstract: 'Medical ultrasound image segmentation remains challenging due to speckle noise, acoustic shadowing, weak tissue contrast, and large variations in lesion scale and morphology, which often lead to errors around ambiguous boundaries. Vision-language methods can use clinical text as complementary semantic guidance, but existing fusion strategies often distribute textual information broadly across spatial locations, including regions where such guidance may be less informative. This paper presents BATS-Net, a text-guided ultrasound image segmentation framework built around the Selective Token Adaptive Refinement Decoder (STAR-Decoder). At each decoder stage, a learned Boundary-Supervised Gate (BSG) modulates skip-feature integration through Adaptive Skip Modulation (ASM), followed by Local Context Refinement (LCR) for lightweight local feature refinement. Building on these boundary-aware features, Structure-Aware Text-Guided Attention (SAT-Attention) injects text guidance into a
    structurally informative subset of visual tokens rather than the full spatial grid. The number of selected tokens adapts to the spatial structural complexity of each input through Structural Response Variation (SRV), concentrating language guidance at boundary and transitional regions where it is most effective. Experiments on three ultrasound benchmarks (BUSI, DDTI, and KidneyUS) demonstrate consistent improvements over strong unimodal and multimodal baselines, achieving 85.45/74.59, 87.43/76.57, and 92.06/85.29 Dice/mIoU, respectively, at 30.1M parameters and 8.9G FLOPs. Ablation studies further validate the proposed design, showing consistent performance gains from boundary-aware decoding and text-guided refinement. The source code is available at: https://github.com/bhardwaj-rahul-rb/bats-net'

- paper_id: 771FCQF9p8
  number: 493
  status: Accept (Poster)
  title: Robust Image Quality Assessment via Feature-Space Smoothing
  authors:
  - Ekaterina Shumitskaya
  - Dmitriy S. Vatolin
  - Anastasia Antsiferova
  abstract: We introduce FS-IQA, a feature-space smoothing approach for robust Image Quality Assessment (IQA). Unlike prior certified defenses that apply randomized smoothing directly in the input space, FS-IQA performs smoothing in deep perceptual feature representations, reducing distortion of perceptually relevant image content while enabling robustness analysis under input perturbations. The proposed method connects feature-space noise to input-space perturbations through local sensitivity estimation based on the backbone’s Jacobian and Hessian. FS-IQA is compatible with both full-reference (FR) and no-reference (NR) IQA models and can be integrated with existing architectures without modifying pretrained backbones. Extensive experiments on six IQA models across two benchmark datasets demonstrate that FS-IQA consistently achieves better robustness-accuracy trade-off compared to existing certified IQA defenses. In particular, FS-IQA reduces certified output deviation by up to 38% while
    improving Spearman rank correlation by 4.8%. In addition, performing smoothing in the feature space requires only a single backbone forward pass during inference, resulting in substantially lower runtime in non-certification mode. These results suggest that feature-space smoothing provides an effective and perceptually aligned alternative to conventional input-space randomized smoothing for robust IQA.

- paper_id: tZsvuTuhlA
  number: 899
  status: Accept (Poster)
  title: 'PASS-3D: Pose-Anchored Sphere-Ray Shuttle 3D Reconstruction from Monocular Broadcast Badminton'
  authors:
  - Jihoon Lee
  - Unsang Park
  abstract: Badminton broadcasts are abundant, but metric 3D shuttle data remain scarce because multi-camera systems are costly and proprietary. Monocular reconstruction could turn broadcasts into scalable 3D data, yet the shuttle is small and fast, drag governs its flight, and one elevated view leaves depth ambiguous. Prior methods rely on synthetic evaluation or dense manual annotation. We address both limitations. To our knowledge, we introduce the first automatic dual-view triangulation benchmark for broadcast badminton, with moving-shuttle reprojection near one pixel. We also reconstruct inter-hit flights without relying on ground-contact events, which badminton does not provide between hits. At each hit, a back-projected shuttle ray intersects a wrist-centered racket-reach sphere to yield a metric contact point, and drag-aware optimization recovers the flight. PASS-3D reaches $3.5$cm lateral, $7.4$cm vertical, and $24.5$cm depth error. Most residual error lies in depth because range
    is inferred from one ray. On public TrackNetV2 matches, reprojection is an order of magnitude below the previous monocular method's and remains consistent on independent broadcasts. Human input is limited to hit frames, stroke types, and jump boundaries, with no per-frame shuttle annotation. The pipeline also recovers approximate player positions.

- paper_id: h4Zp4s6E4z
  number: 83
  status: Accept (Poster)
  title: Multimodal Action Diffusion for Robust End-to-End Autonomous Driving
  authors:
  - Jorge Daniel Rodriguez-Vidal
  - Diego Porres
  - Gabriel Villalonga Pineda
  - Antonio M. López Peña
  abstract: End-to-End Autonomous Driving (E2E-AD) systems have largely converged on predicting intermediate trajectory waypoints, delegating final control to hand-crafted controllers with GPS access. Direct control-signal prediction (outputting throttle, steering, and brake in an end-to-end fashion) remains underexplored, and critically, the role of \emph{action multimodality} in such systems is not well understood. We argue that moving beyond deterministic, single-action outputs is not merely a modeling choice, but a key driver of driving performance, representational quality, and training stability. To validate this, we introduce the Action Diffusion Transformer (ADT), an anchor-free diffusion transformer trained with a simple MSE objective that natively models the multimodal distribution of plausible driving actions. Rather than committing to a single deterministic command, ADT generates $K$ action candidates and selects the most suitable one at inference via Nearest Neighbor Matching
    (NNM). Beyond strong benchmark numbers, we show that action multimodality yields measurable benefits in learned representations and behavioral consistency — effects that deterministic architectures cannot replicate. ADT surpasses previous state-of-the-art on the challenging closed-loop Bench2Drive benchmark while achieving $10\times$ lower latency, demonstrating that expressive, multimodal action modeling is both practically efficient and conceptually essential for robust end-to-end driving.

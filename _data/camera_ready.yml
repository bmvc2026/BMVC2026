- paper_id: IcNksEEYml
  number: 1343
  status: Accept (Poster)
  title: Simplex Diffusion for Ordinal Facial Action Unit Intensity Estimation
  authors:
  - Mengxin Shi
  - MENGQIN ZHANG
  - Ping Han
  - Zhangfeng Hu
  abstract: Facial Action Unit (AU) intensity estimation, which seeks to quantify the activation level of individual AUs from facial images, is fundamental to fine-grained facial behavior analysis. Despite notable progress, existing methods predominantly cast this problem as scalar regression or discrete classification over hard labels, a formulation that inherently fails to capture the ordinal proximity among intensity levels. We propose Simplex AU-Diff, a diffusion-based framework that reformulates AU intensity estimation as structured probability distribution recovery on the simplex. Our approach allows the model to learn ordinal intensities through the diffusion process by integrating the soft ordinal label construction and isometric log-ratio (ILR) transform. AU relation priors are further injected into the denoising steps, guiding the model to attend to semantically meaningful links between local facial features. By operating the diffusion process in the ILR space and supervising through
    a dual-space objective, our framework simultaneously enforces probabilistic validity, ordinal consistency, and inter-AU coherence. Extensive experiments show that Simplex AU-Diff achieves better results on DISFA compared to existing methods, while maintaining competitive performance on FERA 2015.

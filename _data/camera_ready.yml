- paper_id: inLbaRDuij
  number: 708
  status: Accept (Poster)
  title: 'UniFMamba: Uni-directional Visual Mamba with Full-Feature Parallel Mixing'
  authors:
  - Yanan Cheng
  - Cheng Ji
  - Pu Zhao
  - Chao Wu
  abstract: 'Uni-directional visual Mamba backbones provide an appealing solution for efficient visual recognition by modeling images as token sequences with linear complexity. However, we find that directly applying uni-directional sequence modeling to visual data leads to two inherent limitations: weak local spatial modeling due to the lack of explicit spatial priors, and limited global representation capacity when only a single class token is used for readout. In this paper, we present UniFMamba, a simple and efficient uni-directional Mamba backbone that addresses both issues in a unified manner. Specifically, we introduce a full-feature parallel depthwise convolution branch to enhance local spatial modeling without feature splitting, which avoids the information fragmentation caused by conventional hybrid designs. In addition, we employ multiple tail class tokens to strengthen global information aggregation under the uni-directional modeling paradigm. Furthermore, we adapt inter-layer
    flipping to our parallel architecture as a branch-specific strategy, applying it exclusively to the Mamba patch-token sequence to mitigate directional bias without disrupting the class tokens or convolution branch. Collectively, these designs preserve the efficiency of uni-directional sequence modeling while enhancing both local and global visual representations. Extensive experiments on widely used benchmark datasets demonstrate that UniFMamba achieves strong performance on ImageNet-1K classification and transfers well to various downstream tasks.'

- paper_id: ZswhpXuK3t
  number: 570
  status: Accept (Poster)
  title: Virtual-Domain-Guided Cross-Task Domain Adaptation with Scheduled Generated Supervision
  authors:
  - Mengying Zhao
  - Hao Li
  - Yueying Li
  - Yingying Zhao
  - Long Lan
  abstract: 'Unsupervised domain adaptation (UDA) aims to learn transferable models from labeled source-domain data and unlabeled target-domain data, thereby addressing the lack of target-domain annotations and the problem of domain shift. Existing UDA methods usually rely on indirect supervision signals, such as pseudo-labels, consistency constraints, or distribution alignment. Although some data generation methods can expand cross-domain training data, generated samples are still mostly used as ordinary augmented samples and do not effectively combine reliable source-domain labels with target-domain style. To this end, we model target-style generated samples as a supervised virtual domain, while the proposed virtual-domain supervision still faces two challenges: (1) controlling its intervention timing and supervision strength to avoid training noise and over-reliance; and (2) alleviating class bias caused by the virtual-domain label distribution. We propose a virtual-domain-guided UDA
    method with GenSup as a third supervision signal. It uses target-style generated samples with inherited source labels to provide explicit virtual-domain supervision, and further controls this supervision through stage-wise weight scheduling and class-balanced modulation. The method improves mIoU from 71.5\% to 74.7\% on GTA to Cityscapes and from 60.3\% to 63.6\% on Cityscapes to ACDC.'

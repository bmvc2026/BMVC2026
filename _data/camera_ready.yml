- paper_id: 2WuMz9nQUn
  number: 1413
  status: Accept (Poster)
  title: 'Motion-Equivariant Pseudo-Video Augmentation: Video-Style Generalization from a Single Static Polyp Dataset'
  authors:
  - Zhuoyu Wu
  - Wenhui OU
  - Qinchen Wu
  - Mingze Sun
  - Tan Pei Sze
  - Wenqi Fang
  - Raphaël C-W Phan
  abstract: Endoscopic polyp segmentation models are commonly trained as still-image segmenters, yet their clinical deployment faces video-style failures caused by camera displacement, motion blur, transient defocus, and quality fluctuation. Static augmentation can diversify appearances, but it still treats each manual mask as an isolated supervision event. We propose MEPVA, a motion-cued pseudo-video augmentation framework that turns one static image–mask pair into a short mask-consistent episode with controlled inter-frame displacement and motion-coupled degradation. Because the dominant displacement is known from the generator, the model can be trained with an explicit mask-propagation objective rather than relying on noisy estimated flow or real video annotation. The learned model remains an ordinary single-frame segmenter at test time, adding no parameters, temporal memory, optical-flow module, or multi-frame inference cost. Trained only on Kvasir-SEG and evaluated zero-shot on external
    polyp benchmarks, MEPVA improves degraded-set Dice from 0.652 with AugMix to 0.725 under three-seed SegFormer-B0 experiments, with consistent gains across multiple backbones. Under data scarcity, MEPVA remains effective with only 12.5% of the training images, supporting the view that pseudo-video episodes amortize scarce static annotations into richer motion-structured supervision. Ablations show that episode generation is the main source of robustness, while correct displacement cues provide targeted benefit on video-derived evaluation and expose a trade-off between context invariance and temporal consistency in augmentation design.

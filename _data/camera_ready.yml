- paper_id: 9lxGwr2EiJ
  number: 1351
  status: Accept (Poster)
  title: 'DrivingVoxels: Compositional Sparse Voxel Rasterization for Dynamic Driving Scene Reconstruction'
  authors:
  - Tania Aguirre
  - Luis Guillermo Roldao Jimenez
  - Moussab Bennehar
  - Nathan Piasco
  - Dzmitry Tsishkou
  - Simone Rossi
  - Pietro Michiardi
  abstract: |-
    Reconstructing dynamic urban scenes remains challenging due to the unbounded nature of driving environments and the presence of multiple dynamic objects.Currently, potentially faster sparse voxel methods are mainly designed for static scenarios. On the other hand, dynamic approaches based on 3D Gaussian Splatting, despite their high-fidelity, are often time-consuming for driving scenarios and exhibit uncontrollable memory growth in large scenes.

    To address these limitations, we present DrivingVoxels, a compositional sparse voxel rendering framework for dynamic driving scenes. Our method jointly rasterizes sparse voxels from multiple independent octrees within a single rendering pass. Each rigid dynamic object is represented by an octree defined in its local coordinate frame, while a separate static octree models the stationary background. DrivingVoxels a fully explicit, neural-free representation together with a LiDAR-guided structural initialization that efficiently captures scene geometry. We evaluate our framework on the PandaSet benchmark, demonstrating that DrivingVoxels on par on perceptual metrics and better on structural metrics for NVS and reconstruction—while requiring shorter training times than previous 3DGS-base methods to an efficient optimization workflow anchored by a strong LiDAR prior.

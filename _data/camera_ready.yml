- paper_id: mRiloVLsRn
  number: 1120
  status: Accept (Poster)
  title: '$\text{DA}^2$: Dataset-Aware Adaptive Augmentation for Few-Shot Class-Incremental Learning'
  authors:
  - Hitika Tiwari
  - Rajesh bhatt
  - RASHI NIYAS P
  abstract: 'Few-shot class-incremental learning (FSCIL) aims to enable models to continually learn new classes from limited data while retaining performance on previously learned ones. Existing approaches typically freeze the feature extractor during incremental updates, but do not explicitly ensure that base-class representations remain sufficiently separable. As a result, features of newly introduced classes may overlap with those of earlier classes. To address this, we propose $\textbf{Dataset-Aware Adaptive Augmentation (DA$^2$)}$, a feature-level augmentation strategy that automatically adapts the augmentation regime according to the geometry of the dataset feature space. We first compute the mean inter-class cosine similarity of base-class prototypes in a single forward pass before training and use this statistic to select the appropriate augmentation strategy. For coarse-grained datasets, where class prototypes are densely clustered, a full multi-domain pipeline is applied. For fine-grained
    datasets, where prototypes are already well separated and discriminability lies in subtle spectral structure, a spatial-only regime is used to preserve these cues. This mechanism requires no manual dataset annotation and introduces negligible overhead. Our method strengthens and diversifies base-class feature distributions prior to incremental learning, thereby improving the accommodation of new classes. It generates augmented features through complementary transformations across multiple representation domains, producing proxy representations that increase intra-class diversity while preserving the underlying discriminative structure of each class. Experiments on CIFAR-100 and miniImageNet demonstrate strong performance, with average accuracy gains of $\mathbf{+8.09\%}$ and $\mathbf{+6.10\%}$ over prior best methods. More details and code are available on our project webpage: https://anon2909conf-web.github.io/ImprovingRobustnessForFSCIL/.'

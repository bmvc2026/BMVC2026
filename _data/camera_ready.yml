- paper_id: hoDiDoTazk
  number: 1512
  status: Accept (Poster)
  title: 'SynGlass: A Large-Scale Synthetic Dataset for Fine-Grained Eyeglasses Segmentation'
  authors:
  - Alexandru-Ion Marinescu
  - DIANA-LAURA BORZA
  - DARABANT Sergiu Adrian
  - Bota Robert
  abstract: Eyeglasses segmentation is a task required in several computer vision applications, such as optometric measurement, frame retrieval, face recognition, and gaze estimation. However, progress in this problem is limited by the lack of large-scale, precisely annotated datasets. We introduce SynGlass, a synthetic dataset of 332,928 images generated from 867 distinct eyeglass models, which is, to the best of our knowledge, the most diverse set of frames in any eyeglasses segmentation dataset, worn by 128 humanoid avatars, covering a large range of frame styles, colours and materials, with pixel-accurate lens and frame segmentation masks generated directly from the rendering pipeline. We benchmark a range of CNN-based, transformer-based, and  foundation models on this dataset. To evaluate contour fidelity, we propose geometry-aware radial evaluation metrics that, unlike standard boundary measures, naturally decompose prediction errors across lens regions - nasal, temporal, top, and
    bottom. Finally, we perform a synthetic-to-real evaluation and show that pretraining on SynGlass improves generalization and boundary accuracy on real-world data.

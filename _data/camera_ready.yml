- paper_id: Ao4MjvVebe
  number: 124
  status: Accept (Poster)
  title: 'AURA : AUdio-dRiven streaming Avatar'
  authors:
  - Nathaniel Cohen
  - Nicolas Dufour
  - Amelie Royer
  - Alasdair Newson
  - Patrick Perez
  abstract: "Current audio-driven video diffusion models can synthesize realistic talking-head videos but generally require dozens of diffusion denoising steps over  multi-second video chunks, making them unsuitable for streaming applications such as voice assistants and virtual avatars, where low-latency and online causal generation are required properties.\nAURA generates high-resolution video chunk-by-chunk at $9.7$ fps with a rolling KV cache, requiring only the audio of the current chunk rather than the multi-second audio look-ahead buffered by bidirectional models, making it well-suited to interactive avatar applications.\nOur two-stage distillation pipeline first aligns the causal student with the teacher, by training it to match the teacher's trajectories with fewer diffusion steps and a chunk-wise causal attention mask, \nthen applies Distribution Matching Distillation (DMD) with backward simulation to close the remaining quality gap. On standard talking-head benchmarks, AURA matches\
    \ the teacher's quality while running $17\\times$ faster, achieving $720$p avatar streaming on a single GPU. To support reproducibility and further research on streaming avatar generation, we release our model's weights along with a dataset of $30$K synthetic videos and their precomputed teacher trajectories."

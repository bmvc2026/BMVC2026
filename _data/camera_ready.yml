- paper_id: R7HwZF1DOu
  number: 1652
  status: Accept (Poster)
  title: Multi Activity Sequence Alignment via Implicit Clustering
  authors:
  - Taein Kwon
  - Mahdi Rad
  - Zador Pataki
  - Marc Pollefeys
  abstract: "Self-supervised temporal sequence alignment can provide rich and effective representations for a wide range of applications. \nExisting self-supervised sequence alignment methods typically assume videos from the same activity or require separate models for each activity, limiting scalability and generalization.\nWe propose a novel framework that overcomes these limitations using sequence alignment via implicit clustering. \nSpecifically, our key idea is to perform implicit clip-level clustering while aligning frames in sequences, enabling the network to learn generalizable and discriminative representations.\nOur experiments show that our proposed method outperforms state-of-the-art methods and highlight the generalization capability of our framework with multiple activities and different modalities on three diverse datasets, H2O,\nPennAction, and IKEA ASM."
